<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="575" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >AGENTIC AI</text><text x="30" y="62" class="h1" text-anchor="start" >Seven "agents": one planner loop, the rest are calls</text><line x1="30" y1="72" x2="810" y2="72" class="uline"/><rect x="330" y="92" width="300" height="50" rx="6" class="cell"/><text x="480.0" y="112" class="h2" text-anchor="middle" >UI (Gradio) + timer</text><text x="480.0" y="130" class="mut" text-anchor="middle" >deals table, live logs, 3-D vector plot</text><rect x="330" y="162" width="300" height="50" rx="6" class="grey"/><text x="480.0" y="182" class="h2" text-anchor="middle" >agent framework</text><text x="480.0" y="200" class="mut" text-anchor="middle" >memory (JSON of surfaced deals) + logging</text><rect x="330" y="232" width="300" height="64" rx="6" class="pnk"/><text x="480.0" y="252" class="h2" text-anchor="middle" >planning agent</text><text x="480.0" y="270" class="mut" text-anchor="middle" >LLM in a tool loop: scan, price,</text><text x="480.0" y="286" class="mut" text-anchor="middle" >pick the best discount, notify</text><line x1="480" y1="142" x2="480" y2="162" class="ln" marker-end="url(#ar)"/><line x1="480" y1="212" x2="480" y2="232" class="ln" marker-end="url(#ar)"/><rect x="60" y="330" width="240" height="70" rx="6" class="yel"/><text x="180.0" y="350" class="h2" text-anchor="middle" >scanner agent</text><text x="180.0" y="368" class="mut" text-anchor="middle" >RSS feeds then LLM picks 5 deals</text><text x="180.0" y="384" class="mut" text-anchor="middle" >structured outputs (Pydantic)</text><line x1="480" y1="296" x2="180" y2="330" class="lnr" marker-end="url(#arr)"/><rect x="360" y="330" width="240" height="70" rx="6" class="blu"/><text x="480.0" y="350" class="h2" text-anchor="middle" >ensemble agent</text><text x="480.0" y="368" class="mut" text-anchor="middle" >fixed workflow, no autonomy</text><text x="480.0" y="384" class="mut" text-anchor="middle" >0.8 RAG + 0.1 + 0.1</text><line x1="480" y1="296" x2="480" y2="330" class="lnr" marker-end="url(#arr)"/><rect x="660" y="330" width="240" height="70" rx="6" class="grn"/><text x="780.0" y="350" class="h2" text-anchor="middle" >messaging agent</text><text x="780.0" y="368" class="mut" text-anchor="middle" >LLM writes the alert</text><text x="780.0" y="384" class="mut" text-anchor="middle" >push notification</text><line x1="480" y1="296" x2="780" y2="330" class="lnr" marker-end="url(#arr)"/><rect x="140" y="440" width="200" height="70" rx="6" class="blu"/><text x="240.0" y="460" class="h2" text-anchor="middle" >specialist agent</text><text x="240.0" y="478" class="mut" text-anchor="middle" >fine-tuned Llama 3B</text><text x="240.0" y="494" class="mut" text-anchor="middle" >served on Modal (GPU)</text><line x1="480" y1="400" x2="240" y2="440" class="ln" marker-end="url(#ar)"/><rect x="380" y="440" width="200" height="70" rx="6" class="blu"/><text x="480.0" y="460" class="h2" text-anchor="middle" >frontier agent</text><text x="480.0" y="478" class="mut" text-anchor="middle" >encode, search Chroma for 5</text><text x="480.0" y="494" class="mut" text-anchor="middle" >similar items, then LLM (RAG)</text><line x1="480" y1="400" x2="480" y2="440" class="ln" marker-end="url(#ar)"/><rect x="620" y="440" width="200" height="70" rx="6" class="blu"/><text x="720.0" y="460" class="h2" text-anchor="middle" >neural-net agent</text><text x="720.0" y="478" class="mut" text-anchor="middle" >Week 6 deep</text><text x="720.0" y="494" class="mut" text-anchor="middle" >residual network</text><line x1="480" y1="400" x2="720" y2="440" class="ln" marker-end="url(#ar)"/><text x="480" y="540" class="hand" text-anchor="middle" >only the planner loops and chooses; the ensemble is code calling three models in a fixed order</text><text x="480" y="558" class="mut" text-anchor="middle" >one full run: ~34 model calls across 6 different models</text></svg>
