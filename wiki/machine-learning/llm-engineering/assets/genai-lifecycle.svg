<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="570" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >GENERATIVE AI</text><text x="30" y="62" class="h1" text-anchor="start" >A foundation model's life, and the cheap places to change it</text><line x1="30" y1="72" x2="930" y2="72" class="uline"/><rect x="30" y="100" width="210" height="70" rx="6" class="grey"/><text x="135" y="128" class="h2" text-anchor="middle" >1 data</text><text x="135" y="148" class="mut" text-anchor="middle" >collect, clean</text><line x1="241" y1="135" x2="261" y2="135" class="ln" marker-end="url(#ar)"/><rect x="262" y="100" width="210" height="70" rx="6" class="grey"/><text x="367" y="128" class="h2" text-anchor="middle" >2 architecture</text><text x="367" y="148" class="mut" text-anchor="middle" >choose / adapt</text><line x1="473" y1="135" x2="493" y2="135" class="ln" marker-end="url(#ar)"/><rect x="494" y="100" width="210" height="70" rx="6" class="pnk"/><text x="599" y="128" class="h2" text-anchor="middle" >3 pre-train</text><text x="599" y="148" class="mut" text-anchor="middle" >next-token, $$$$</text><line x1="705" y1="135" x2="725" y2="135" class="ln" marker-end="url(#ar)"/><rect x="726" y="100" width="210" height="70" rx="6" class="yel"/><text x="831" y="128" class="h2" text-anchor="middle" >4 fine-tune</text><text x="831" y="148" class="mut" text-anchor="middle" >domain, instructions, RLHF</text><rect x="30" y="196" width="210" height="70" rx="6" class="blu"/><text x="135" y="224" class="h2" text-anchor="middle" >5 evaluate</text><text x="135" y="244" class="mut" text-anchor="middle" >humans, metrics, judges</text><line x1="241" y1="231" x2="261" y2="231" class="ln" marker-end="url(#ar)"/><rect x="262" y="196" width="210" height="70" rx="6" class="grn"/><text x="367" y="224" class="h2" text-anchor="middle" >6 deploy</text><text x="367" y="244" class="mut" text-anchor="middle" >API, endpoint</text><line x1="473" y1="231" x2="493" y2="231" class="ln" marker-end="url(#ar)"/><rect x="494" y="196" width="210" height="70" rx="6" class="grn"/><text x="599" y="224" class="h2" text-anchor="middle" >7 monitor</text><text x="599" y="244" class="mut" text-anchor="middle" >drift, feedback</text><line x1="705" y1="231" x2="725" y2="231" class="ln" marker-end="url(#ar)"/><rect x="726" y="196" width="210" height="70" rx="6" class="grey"/><text x="831" y="224" class="h2" text-anchor="middle" >8 iterate</text><text x="831" y="244" class="mut" text-anchor="middle" >back to 1 or 4</text><path d="M830,170 L830,183 L135,183 L135,194" class="ln" marker-end="url(#ar)"/><text x="40" y="322" class="h2" text-anchor="start" >cheapest to most expensive way to change behaviour</text><rect x="30" y="336" width="170" height="84" rx="6" class="yel"/><text x="115" y="360" class="h2" text-anchor="middle" >prompt</text><text x="115" y="380" class="mut" text-anchor="middle" >4 elements, few-shot,</text><text x="115" y="396" class="mut" text-anchor="middle" >chain-of-thought</text><rect x="216" y="336" width="170" height="84" rx="6" class="yel"/><text x="301" y="360" class="h2" text-anchor="middle" >inference params</text><text x="301" y="380" class="mut" text-anchor="middle" >temperature, top-p,</text><text x="301" y="396" class="mut" text-anchor="middle" >top-k, max tokens</text><rect x="402" y="336" width="170" height="84" rx="6" class="blu"/><text x="487" y="360" class="h2" text-anchor="middle" >RAG</text><text x="487" y="380" class="mut" text-anchor="middle" >fetch facts at query</text><text x="487" y="396" class="mut" text-anchor="middle" >time, cite sources</text><rect x="588" y="336" width="170" height="84" rx="6" class="pur"/><text x="673" y="360" class="h2" text-anchor="middle" >fine-tune</text><text x="673" y="380" class="mut" text-anchor="middle" >prompt/completion</text><text x="673" y="396" class="mut" text-anchor="middle" >pairs, LoRA</text><rect x="774" y="336" width="170" height="84" rx="6" class="pnk"/><text x="859" y="360" class="h2" text-anchor="middle" >pre-train</text><text x="859" y="380" class="mut" text-anchor="middle" >only for labs:</text><text x="859" y="396" class="mut" text-anchor="middle" >data + GPUs + months</text><line x1="40" y1="436" x2="920" y2="436" class="lnr" marker-end="url(#arr)"/><text x="480" y="456" class="hand" text-anchor="middle" >more cost, data and time; changes stick deeper</text><rect x="30" y="470" width="900" height="84" rx="6" class="note"/><text x="44" y="492" class="h2" text-anchor="start" >Prompt anatomy (the course's four elements)</text><text x="44" y="512" class="hand" text-anchor="start" >instruction (what to do) · context (constraints, background) · input data (the material) · output indicator (format)</text><text x="44" y="530" class="hand" text-anchor="start" >A template fixes all but the user's slots — and anything typed into a slot reaches the model, including injected instructions.</text></svg>
