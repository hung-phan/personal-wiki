<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="580" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >LLM FOUNDATIONS</text><text x="30" y="62" class="h1" text-anchor="start" >One API call: everything goes in, one token comes out at a time</text><line x1="30" y1="72" x2="975" y2="72" class="uline"/><text x="40" y="104" class="h2" text-anchor="start" >1. the request: a list of messages</text><rect x="40" y="122" width="260" height="36" rx="4" class="yel"/><text x="50" y="137" class="numb" text-anchor="start" >system</text><text x="50" y="152" class="num" text-anchor="start" >You are a snarky assistant.</text><rect x="40" y="166" width="260" height="36" rx="4" class="blu"/><text x="50" y="181" class="numb" text-anchor="start" >user</text><text x="50" y="196" class="num" text-anchor="start" >What is 2+2?</text><rect x="40" y="210" width="260" height="36" rx="4" class="grn"/><text x="50" y="225" class="numb" text-anchor="start" >assistant</text><text x="50" y="240" class="num" text-anchor="start" >4, obviously.</text><rect x="40" y="254" width="260" height="36" rx="4" class="blu"/><text x="50" y="269" class="numb" text-anchor="start" >user</text><text x="50" y="284" class="num" text-anchor="start" >And 3+3?</text><text x="170" y="312" class="hand" text-anchor="middle" >the model never remembers: your code</text><text x="170" y="330" class="hand" text-anchor="middle" >re-sends the whole history every call</text><line x1="310" y1="210" x2="360" y2="210" class="ln" marker-end="url(#ar)"/><text x="335" y="200" class="mut" text-anchor="middle" >chat template</text><text x="370" y="104" class="h2" text-anchor="start" >2. one flat token sequence</text><rect x="370" y="150" width="56" height="30" rx="3" class="pur"/><text x="398" y="170" class="num" text-anchor="middle" >&lt;sys&gt;</text><rect x="432" y="150" width="56" height="30" rx="3" class="cell"/><text x="460" y="170" class="num" text-anchor="middle" >You</text><rect x="494" y="150" width="56" height="30" rx="3" class="cell"/><text x="522" y="170" class="num" text-anchor="middle" > are</text><rect x="556" y="150" width="56" height="30" rx="3" class="cell"/><text x="584" y="170" class="num" text-anchor="middle" > a</text><rect x="618" y="150" width="56" height="30" rx="3" class="cell"/><text x="646" y="170" class="num" text-anchor="middle" > snark</text><rect x="680" y="150" width="56" height="30" rx="3" class="cell"/><text x="708" y="170" class="num" text-anchor="middle" >y</text><rect x="742" y="150" width="56" height="30" rx="3" class="cell"/><text x="770" y="170" class="num" text-anchor="middle" >…</text><rect x="804" y="150" width="56" height="30" rx="3" class="pur"/><text x="832" y="170" class="num" text-anchor="middle" >&lt;user&gt;</text><rect x="370" y="194" width="56" height="30" rx="3" class="cell"/><text x="398" y="214" class="num" text-anchor="middle" >What</text><rect x="432" y="194" width="56" height="30" rx="3" class="cell"/><text x="460" y="214" class="num" text-anchor="middle" > is</text><rect x="494" y="194" width="56" height="30" rx="3" class="cell"/><text x="522" y="214" class="num" text-anchor="middle" > 2</text><rect x="556" y="194" width="56" height="30" rx="3" class="cell"/><text x="584" y="214" class="num" text-anchor="middle" >+</text><rect x="618" y="194" width="56" height="30" rx="3" class="cell"/><text x="646" y="214" class="num" text-anchor="middle" >2</text><rect x="680" y="194" width="56" height="30" rx="3" class="cell"/><text x="708" y="214" class="num" text-anchor="middle" >?</text><rect x="742" y="194" width="56" height="30" rx="3" class="cell"/><text x="770" y="214" class="num" text-anchor="middle" >…</text><rect x="804" y="194" width="56" height="30" rx="3" class="pur"/><text x="832" y="214" class="num" text-anchor="middle" >&lt;asst&gt;</text><text x="620" y="260" class="mut" text-anchor="middle" >special tokens mark who is speaking; the request</text><text x="620" y="276" class="mut" text-anchor="middle" >ends with an open assistant turn to be continued</text><rect x="420" y="300" width="400" height="60" rx="8" class="pnk"/><text x="620" y="326" class="h2" text-anchor="middle" >LLM: predict the next token</text><text x="620" y="346" class="mut" text-anchor="middle" >probabilities over ~100k–200k possible tokens</text><line x1="620" y1="290" x2="620" y2="300" class="ln" marker-end="url(#ar)"/><path d="M820,330 C 900,330 900,200 870,180" class="lnr" marker-end="url(#arr)"/><text x="905" y="260" class="hand" text-anchor="middle" >append the</text><text x="905" y="276" class="hand" text-anchor="middle" >chosen token,</text><text x="905" y="292" class="hand" text-anchor="middle" >repeat</text><text x="620" y="386" class="num" text-anchor="middle" >streamed back token by token until an end-of-turn token or max_tokens</text><text x="40" y="424" class="h2" text-anchor="start" >3. the context window holds the request AND the reply</text><rect x="40" y="438" width="69.0" height="34" rx="2" class="yel"/><text x="74.5" y="459" class="num" text-anchor="middle" >system</text><rect x="109.0" y="438" width="46.0" height="34" rx="2" class="blu"/><text x="132.0" y="459" class="num" text-anchor="middle" >user 1</text><rect x="155.0" y="438" width="172.5" height="34" rx="2" class="grn"/><text x="241.25" y="459" class="num" text-anchor="middle" >assistant 1</text><rect x="327.5" y="438" width="46.0" height="34" rx="2" class="blu"/><text x="350.5" y="459" class="num" text-anchor="middle" >user 2</text><rect x="373.5" y="438" width="172.5" height="34" rx="2" class="grn"/><text x="459.75" y="459" class="num" text-anchor="middle" >assistant 2</text><rect x="546.0" y="438" width="138.0" height="34" rx="2" class="cell"/><text x="615.0" y="459" class="num" text-anchor="middle" >…</text><rect x="684.0" y="438" width="46.0" height="34" rx="2" class="blu"/><text x="707.0" y="459" class="num" text-anchor="middle" >new user</text><rect x="730.0" y="438" width="195.49999999999997" height="34" rx="2" class="pnk"/><text x="827.75" y="459" class="num" text-anchor="middle" >reply being generated</text><text x="931.5" y="459" class="numb" text-anchor="start" >| limit</text><rect x="40" y="488" width="430" height="76" rx="6" class="note"/><text x="54" y="510" class="h2" text-anchor="start" >You pay for</text><text x="54" y="530" class="handk" text-anchor="start" >every input token on every call (history included)</text><text x="54" y="548" class="handk" text-anchor="start" >+ every output token, including hidden reasoning tokens</text><rect x="490" y="488" width="440" height="76" rx="6" class="note"/><text x="504" y="510" class="h2" text-anchor="start" >Rules of thumb (English text)</text><text x="504" y="530" class="handk" text-anchor="start" >1 token ≈ 4 characters ≈ 0.75 words</text><text x="504" y="548" class="handk" text-anchor="start" >code, numbers and rare words cost more tokens</text></svg>
