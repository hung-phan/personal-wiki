<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="570" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >RESPONSIBLE AI</text><text x="30" y="62" class="h1" text-anchor="start" >Guard both directions, and know what you can explain</text><line x1="30" y1="72" x2="810" y2="72" class="uline"/><text x="40" y="104" class="h2" text-anchor="start" >1. guardrails check the prompt AND the answer</text><rect x="40" y="124" width="130" height="50" rx="6" class="cell"/><text x="105" y="154" class="h2" text-anchor="middle" >user</text><rect x="230" y="124" width="130" height="50" rx="6" class="yel"/><text x="295" y="154" class="h2" text-anchor="middle" >guardrail</text><rect x="420" y="124" width="130" height="50" rx="6" class="pnk"/><text x="485" y="154" class="h2" text-anchor="middle" >model</text><rect x="610" y="124" width="130" height="50" rx="6" class="yel"/><text x="675" y="154" class="h2" text-anchor="middle" >guardrail</text><rect x="800" y="124" width="130" height="50" rx="6" class="cell"/><text x="865" y="154" class="h2" text-anchor="middle" >user</text><line x1="170" y1="149" x2="230" y2="149" class="ln" marker-end="url(#ar)"/><line x1="360" y1="149" x2="420" y2="149" class="ln" marker-end="url(#ar)"/><line x1="550" y1="149" x2="610" y2="149" class="ln" marker-end="url(#ar)"/><line x1="740" y1="149" x2="800" y2="149" class="ln" marker-end="url(#ar)"/><path d="M295,174 L295,206" class="lnr" marker-end="url(#arr)"/><text x="295" y="224" class="hand" text-anchor="middle" >blocked: fixed message</text><path d="M675,174 L675,206" class="lnr" marker-end="url(#arr)"/><text x="675" y="224" class="hand" text-anchor="middle" >blocked: fixed message</text><text x="480" y="250" class="mut" text-anchor="middle" >content filters (hate, insults, sexual, violence, misconduct; adjustable strength) · denied topics · PII masking · grounding checks</text><text x="40" y="292" class="h2" text-anchor="start" >2. interpretability vs performance (typical, not a law)</text><line x1="60" y1="470" x2="900" y2="470" class="ln" marker-end="url(#ar)"/><line x1="60" y1="470" x2="60" y2="312" class="ln" marker-end="url(#ar)"/><text x="900" y="490" class="mut" text-anchor="end" >performance on complex data</text><text x="70" y="322" class="mut" text-anchor="start" >how transparent</text><circle cx="140.0" cy="342.0" r="7" class="blu"/><text x="152.0" y="346.0" class="num" text-anchor="start" >linear / logistic regression</text><circle cx="300.0" cy="366.0" r="7" class="blu"/><text x="312.0" y="370.0" class="num" text-anchor="start" >decision tree</text><circle cx="396.0" cy="380.4" r="7" class="blu"/><text x="408.0" y="384.4" class="num" text-anchor="start" >naive Bayes</text><circle cx="580.0" cy="408.0" r="7" class="blu"/><text x="592.0" y="412.0" class="num" text-anchor="start" >ensembles</text><circle cx="780.0" cy="438.0" r="7" class="blu"/><text x="792.0" y="442.0" class="num" text-anchor="start" >neural networks</text><rect x="600" y="290" width="330" height="106" rx="6" class="note"/><text x="614" y="312" class="h2" text-anchor="start" >Two ways to answer "why?"</text><text x="614" y="332" class="handk" text-anchor="start" >interpretability: read the model itself</text><text x="614" y="350" class="handk" text-anchor="start" >  (coefficients, a short tree)</text><text x="614" y="368" class="handk" text-anchor="start" >explainability: probe it from outside</text><text x="614" y="386" class="handk" text-anchor="start" >  (feature importance, partial dependence)</text><rect x="40" y="500" width="890" height="56" rx="6" class="note"/><text x="54" y="522" class="h2" text-anchor="start" >Responsible-AI checklist (course)</text><text x="54" y="542" class="handk" text-anchor="start" >fairness · explainability · privacy and security · robustness · governance · transparency — plus legal risks: bias, hallucination, IP, toxicity, privacy</text></svg>
