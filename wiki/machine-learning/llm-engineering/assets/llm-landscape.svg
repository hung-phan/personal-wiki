<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="570" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >LLM FOUNDATIONS</text><text x="30" y="62" class="h1" text-anchor="start" >Three kinds of model, three ways to use one</text><line x1="30" y1="72" x2="675" y2="72" class="uline"/><rect x="40" y="100" width="270" height="150" rx="8" class="yel"/><text x="175" y="126" class="h2" text-anchor="middle" >base</text><text x="175" y="154" class="ink" text-anchor="middle" >pretrained on web text</text><text x="175" y="174" class="ink" text-anchor="middle" >continues any text:</text><text x="175" y="194" class="ink" text-anchor="middle" >autocomplete</text><text x="175" y="236" class="hand" text-anchor="middle" >use for: fine-tuning a new skill</text><line x1="312" y1="175" x2="338" y2="175" class="ln" marker-end="url(#ar)"/><rect x="340" y="100" width="270" height="150" rx="8" class="blu"/><text x="475" y="126" class="h2" text-anchor="middle" >chat / instruct</text><text x="475" y="154" class="ink" text-anchor="middle" >+ trained on conversations</text><text x="475" y="174" class="ink" text-anchor="middle" >+ human feedback (RLHF):</text><text x="475" y="194" class="ink" text-anchor="middle" >follows roles &amp; instructions</text><text x="475" y="236" class="hand" text-anchor="middle" >use for: most apps; fast, fluent</text><line x1="612" y1="175" x2="638" y2="175" class="ln" marker-end="url(#ar)"/><rect x="640" y="100" width="270" height="150" rx="8" class="pnk"/><text x="775" y="126" class="h2" text-anchor="middle" >reasoning</text><text x="775" y="154" class="ink" text-anchor="middle" >+ trained to think step by step</text><text x="775" y="174" class="ink" text-anchor="middle" >before answering</text><text x="775" y="194" class="ink" text-anchor="middle" >(hidden 'thinking' tokens)</text><text x="775" y="236" class="hand" text-anchor="middle" >use for: puzzles, maths, code, planning</text><text x="480" y="272" class="mut" text-anchor="middle" >hybrid models decide per question how long to think; more thinking = more tokens, cost and latency</text><text x="40" y="310" class="h2" text-anchor="start" >ways to run a model</text><rect x="40" y="324" width="280" height="120" rx="6" class="note"/><text x="54" y="346" class="h2" text-anchor="start" >chat product</text><text x="54" y="366" class="handk" text-anchor="start" >ChatGPT, Claude, Gemini apps</text><text x="54" y="384" class="handk" text-anchor="start" >UI, memory, web search are</text><text x="54" y="402" class="handk" text-anchor="start" >product features, not the model</text><rect x="340" y="324" width="280" height="120" rx="6" class="note"/><text x="354" y="346" class="h2" text-anchor="start" >cloud API</text><text x="354" y="366" class="handk" text-anchor="start" >direct (OpenAI, Anthropic, Google…)</text><text x="354" y="384" class="handk" text-anchor="start" >managed (Bedrock, Vertex, Azure)</text><text x="354" y="402" class="handk" text-anchor="start" >routers (OpenRouter), fast hosts (Groq)</text><rect x="640" y="324" width="280" height="120" rx="6" class="note"/><text x="654" y="346" class="h2" text-anchor="start" >local</text><text x="654" y="366" class="handk" text-anchor="start" >Ollama: optimised C++ + GGUF weights</text><text x="654" y="384" class="handk" text-anchor="start" >HF transformers: the raw Python model,</text><text x="654" y="402" class="handk" text-anchor="start" >the route to fine-tuning</text><rect x="40" y="460" width="880" height="90" rx="6" class="note"/><text x="54" y="482" class="h2" text-anchor="start" >One client for all of them</text><text x="54" y="502" class="hand" text-anchor="start" >Almost every provider and Ollama expose an OpenAI-compatible endpoint, so the same OpenAI client works:</text><text x="54" y="520" class="hand" text-anchor="start" >change base_url and api_key, keep the code. Open-weight ≠ open source: the weights are public, the training data usually isn't.</text></svg>
