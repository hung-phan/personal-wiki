.0,181.5 L608.0,183.8 L612.0,186.2 L616.0,188.5 L620.0,190.9 L624.0,193.3 L628.0,195.7 L632.0,198.1 L636.0,200.5 L640.0,203.0 L644.0,205.4 L648.0,207.8 L652.0,210.2 L656.0,212.6 L660.0,215.0 L664.0,217.4 L668.0,219.8 L672.0,222.1 L676.0,224.4 L680.0,226.7 L684.0,229.0 L688.0,231.3 L692.0,233.5 L696.0,235.7 L700.0,237.8 L704.0,240.0 L708.0,242.0 L712.0,244.1 L716.0,246.1 L720.0,248.1 L724.0,250.0 L728.0,251.9 L732.0,253.7 L736.0,255.5 L740.0,257.3 L744.0,259.0 L748.0,260.7 L752.0,262.3 L756.0,263.9 L760.0,265.4 L764.0,266.9 L768.0,268.3 L772.0,269.7 L776.0,271.1 L780.0,272.4 L784.0,273.7 L788.0,274.9 L792.0,276.1 L796.0,277.2 L800.0,278.3 L804.0,279.4 L808.0,280.4 L812.0,281.4 L816.0,282.4 L820.0,283.3 L824.0,284.1 L828.0,285.0 L832.0,285.8 L836.0,286.5 L840.0,287.3 L844.0,288.0 L848.0,288.6 L852.0,289.3 L856.0,289.9 L860.0,290.5 L864.0,291.0 L868.0,291.5 L872.0,292.0 L876.0,292.5 L880.0,293.0" class="ln"/><text x="480" y="126" class="mut" text-anchor="middle" >weights in a layer are roughly bell-shaped (most near 0)</text><path d="M80,300 L880,300" class="ln"/><line x1="80.0" y1="330" x2="80.0" y2="356" class="ln" stroke-width="2"/><line x1="133.3" y1="330" x2="133.3" y2="356" class="ln" stroke-width="2"/><line x1="186.7" y1="330" x2="186.7" y2="356" class="ln" stroke-width="2"/><line x1="240.0" y1="330" x2="240.0" y2="356" class="ln" stroke-width="2"/><line x1="293.3" y1="330" x2="293.3" y2="356" class="ln" stroke-width="2"/><line x1="346.7" y1="330" x2="346.7" y2="356" class="ln" stroke-width="2"/><line x1="400.0" y1="330" x2="400.0" y2="356" class="ln" stroke-width="2"/><line x1="453.3" y1="330" x2="453.3" y2="356" class="ln" stroke-width="2"/><line x1="506.7" y1="330" x2="506.7" y2="356" class="ln" stroke-width="2"/><line x1="560.0" y1="330" x2="560.0" y2="356" class="ln" stroke-width="2"/><line x1="613.3" y1="330" x2="613.3" y2="356" class="ln" stroke-width="2"/><line x1="666.7" y1="330" x2="666.7" y2="356" class="ln" stroke-width="2"/><line x1="720.0" y1="330" x2="720.0" y2="356" class="ln" stroke-width="2"/><line x1="773.3" y1="330" x2="773.3" y2="356" class="ln" stroke-width="2"/><line x1="826.7" y1="330" x2="826.7" y2="356" class="ln" stroke-width="2"/><line x1="880.0" y1="330" x2="880.0" y2="356" class="ln" stroke-width="2"/><text x="80" y="324" class="numb" text-anchor="start" >int4: 16 evenly spaced levels</text><line x1="80.0" y1="384" x2="80.0" y2="410" class="lnr" stroke-width="2"/><line x1="211.5" y1="384" x2="211.5" y2="410" class="lnr" stroke-width="2"/><line x1="276.5" y1="384" x2="276.5" y2="410" class="lnr" stroke-width="2"/><line x1="324.3" y1="384" x2="324.3" y2="410" class="lnr" stroke-width="2"/><line x1="364.2" y1="384" x2="364.2" y2="410" class="lnr" stroke-width="2"/><line x1="399.7" y1="384" x2="399.7" y2="410" class="lnr" stroke-width="2"/><line x1="432.7" y1="384" x2="432.7" y2="410" class="lnr" stroke-width="2"/><line x1="464.4" y1="384" x2="464.4" y2="410" class="lnr" stroke-width="2"/><line x1="495.6" y1="384" x2="495.6" y2="410" class="lnr" stroke-width="2"/><line x1="527.3" y1="384" x2="527.3" y2="410" class="lnr" stroke-width="2"/><line x1="560.3" y1="384" x2="560.3" y2="410" class="lnr" stroke-width="2"/><line x1="595.8" y1="384" x2="595.8" y2="410" class="lnr" stroke-width="2"/><line x1="635.7" y1="384" x2="635.7" y2="410" class="lnr" stroke-width="2"/><line x1="683.5" y1="384" x2="683.5" y2="410" class="lnr" stroke-width="2"/><line x1="748.5" y1="384" x2="748.5" y2="410" class="lnr" stroke-width="2"/><line x1="880.0" y1="384" x2="880.0" y2="410" class="lnr" stroke-width="2"/><text x="80" y="378" class="numb" text-anchor="start" >NF4: 16 levels at normal-distribution quantiles</text><text x="480" y="436" class="hand" text-anchor="middle" >NF4 puts its notches where the weights are: denser near 0, sparser in the tails</text><rect x="40" y="456" width="430" height="100" rx="6" class="note"/><text x="54" y="478" class="h2" text-anchor="start" >Memory for 3B parameters</text><text x="54" y="498" class="handk" text-anchor="start" >fp32 12 GB · bf16 6 GB · 8-bit 3 GB · 4-bit 1.5 GB</text><text x="54" y="516" class="handk" text-anchor="start" >(+ small per-block scale factors; double quant</text><text x="54" y="534" class="handk" text-anchor="start" >compresses those too)</text><rect x="490" y="456" width="440" height="100" rx="6" class="note"/><text x="504" y="478" class="h2" text-anchor="start" >Why it works</text><text x="504" y="498" class="handk" text-anchor="start" >each weight is stored as a 4-bit index plus a shared</text><text x="504" y="516" class="handk" text-anchor="start" >scale per block; compute de-quantizes to bf16.</text><text x="504" y="534" class="handk" text-anchor="start" >Accuracy drops a little, not 4× — known empirically.</text></svg>
