<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="536" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >DATA PREPROCESSING</text><text x="30" y="62" class="h1" text-anchor="start" >Split first; learn every statistic from the training rows only</text><line x1="30" y1="72" x2="960" y2="72" class="uline"/><rect x="40" y="100" width="200" height="56" rx="6" class="cell"/><text x="140.0" y="122" class="h2" text-anchor="middle" >raw table</text><text x="140.0" y="140" class="mut" text-anchor="middle" >features X, target y</text><line x1="240" y1="128" x2="290" y2="128" class="ln" marker-end="url(#ar)"/><rect x="290" y="100" width="180" height="56" rx="6" class="yel"/><text x="380.0" y="122" class="h2" text-anchor="middle" >train / test split</text><text x="380.0" y="140" class="mut" text-anchor="middle" >e.g. 80 / 20, fixed seed</text><line x1="470" y1="118" x2="530" y2="100" class="ln" marker-end="url(#ar)"/><line x1="470" y1="140" x2="530" y2="200" class="ln" marker-end="url(#ar)"/><rect x="530" y="74" width="180" height="56" rx="6" class="grn"/><text x="620.0" y="96" class="h2" text-anchor="middle" >training rows</text><text x="620.0" y="114" class="mut" text-anchor="middle" >fit + transform</text><rect x="530" y="176" width="180" height="56" rx="6" class="pnk"/><text x="620.0" y="198" class="h2" text-anchor="middle" >test rows</text><text x="620.0" y="216" class="mut" text-anchor="middle" >transform only</text><rect x="760" y="74" width="170" height="158" rx="8" class="note"/><text x="845" y="100" class="hand" text-anchor="middle" >learned on train:</text><text x="845" y="126" class="num" text-anchor="middle" >imputation means</text><text x="845" y="152" class="num" text-anchor="middle" >scaler mean / std</text><text x="845" y="178" class="num" text-anchor="middle" >category list</text><text x="845" y="204" class="num" text-anchor="middle" >(dummy columns)</text><path d="M760,150 L712,204" class="lnd" marker-end="url(#ar)"/><text x="718" y="252" class="hand" text-anchor="start" >reuse them on test</text><text x="40" y="300" class="h2" text-anchor="start" >steps inside the fitted transformer</text><rect x="40" y="316" width="270" height="56" rx="6" class="blu"/><text x="175.0" y="338" class="h2" text-anchor="middle" >missing values</text><text x="175.0" y="356" class="mut" text-anchor="middle" >fill with the mean (numbers)</text><line x1="310" y1="344" x2="340" y2="344" class="ln" marker-end="url(#ar)"/><rect x="340" y="316" width="270" height="56" rx="6" class="blu"/><text x="475.0" y="338" class="h2" text-anchor="middle" >categories</text><text x="475.0" y="356" class="mut" text-anchor="middle" >one-hot: one 0/1 column each</text><line x1="610" y1="344" x2="640" y2="344" class="ln" marker-end="url(#ar)"/><rect x="640" y="316" width="270" height="56" rx="6" class="blu"/><text x="775.0" y="338" class="h2" text-anchor="middle" >scaling</text><text x="775.0" y="356" class="mut" text-anchor="middle" >standardize or normalize</text><rect x="40" y="396" width="430" height="120" rx="6" class="note"/><text x="54" y="418" class="h2" text-anchor="start" >Two scalings</text><text x="54" y="438" class="handk" text-anchor="start" >normalize: (x − min) / (max − min), into [0, 1]</text><text x="54" y="456" class="handk" text-anchor="start" >standardize: (x − mean) / std, mean 0, std 1</text><text x="54" y="474" class="handk" text-anchor="start" ></text><text x="54" y="492" class="handk" text-anchor="start" >both per COLUMN; distances and gradients</text><text x="54" y="510" class="handk" text-anchor="start" >need comparable columns</text><rect x="500" y="396" width="430" height="120" rx="6" class="note"/><text x="514" y="418" class="h2" text-anchor="start" >Why split first</text><text x="514" y="438" class="handk" text-anchor="start" >the test set plays 'future data':</text><text x="514" y="456" class="handk" text-anchor="start" >a mean or std computed with it</text><text x="514" y="474" class="handk" text-anchor="start" >leaks the answer into training,</text><text x="514" y="492" class="handk" text-anchor="start" >and scaling test rows by their OWN</text><text x="514" y="510" class="handk" text-anchor="start" >statistics changes what values mean</text></svg>
