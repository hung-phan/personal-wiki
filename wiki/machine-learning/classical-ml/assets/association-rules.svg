<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="476" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >ASSOCIATION RULES</text><text x="30" y="62" class="h1" text-anchor="start" >People who bought A also bought B — but more than usual?</text><line x1="30" y1="72" x2="870" y2="72" class="uline"/><rect x="40" y="100" width="380" height="230" rx="6" class="cell"/><text x="230" y="122" class="numb" text-anchor="middle" >100 viewers</text><circle cx="190" cy="220" r="80" class="yel"/><circle cx="270" cy="230" r="42" class="blu" opacity="0.8"/><text x="150" y="222" class="num" text-anchor="middle" >Interstellar 40</text><text x="292" y="240" class="num" text-anchor="middle" >Ex Machina 10</text><text x="244" y="200" class="numb" text-anchor="middle" >both 7</text><rect x="460" y="100" width="470" height="230" rx="6" class="note"/><text x="474" y="122" class="h2" text-anchor="start" >Three numbers per rule A → B</text><text x="474" y="142" class="handk" text-anchor="start" >support(B) = share of all baskets containing B = 10%</text><text x="474" y="160" class="handk" text-anchor="start" >confidence(A -&gt; B) = P(B | A) = 7 / 40 = 17.5%</text><text x="474" y="178" class="handk" text-anchor="start" >lift = confidence / support(B) = 1.75</text><text x="474" y="196" class="handk" text-anchor="start" ></text><text x="474" y="214" class="handk" text-anchor="start" >lift &gt; 1: A makes B more likely than usual</text><text x="474" y="232" class="handk" text-anchor="start" >Apriori: keep itemsets above min support,</text><text x="474" y="250" class="handk" text-anchor="start" >grow them, keep rules above min confidence/lift</text><text x="474" y="268" class="handk" text-anchor="start" >Eclat: support of itemsets only, no rules</text><rect x="40" y="356" width="890" height="100" rx="6" class="note"/><text x="54" y="378" class="h2" text-anchor="start" >Setting thresholds (the course)</text><text x="54" y="398" class="handk" text-anchor="start" >min support from the business: an item bought 3 times a day, over a week of 7,501 baskets: 3·7/7501 ≈ 0.003;</text><text x="54" y="416" class="handk" text-anchor="start" >min confidence 0.2 (0.8 found no rules, 0.4 a few hundred); min lift 3. Rank rules by lift; check that the sample is large.</text></svg>
