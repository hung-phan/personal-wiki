<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="486" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >BAG OF WORDS</text><text x="30" y="62" class="h1" text-anchor="start" >Text to a row of word counts, then any classifier</text><line x1="30" y1="72" x2="765" y2="72" class="uline"/><rect x="30" y="100" width="166" height="60" rx="6" class="cell"/><text x="113" y="124" class="h2" text-anchor="middle" >review</text><text x="113" y="144" class="mut" text-anchor="middle" >"The crust is not good!"</text><line x1="196" y1="130" x2="216" y2="130" class="ln" marker-end="url(#ar)"/><rect x="216" y="100" width="166" height="60" rx="6" class="grey"/><text x="299" y="124" class="h2" text-anchor="middle" >clean</text><text x="299" y="144" class="mut" text-anchor="middle" >letters only, lower case</text><line x1="382" y1="130" x2="402" y2="130" class="ln" marker-end="url(#ar)"/><rect x="402" y="100" width="166" height="60" rx="6" class="yel"/><text x="485" y="124" class="h2" text-anchor="middle" >stop words</text><text x="485" y="144" class="mut" text-anchor="middle" >drop 'the', 'is' — keep 'not'</text><line x1="568" y1="130" x2="588" y2="130" class="ln" marker-end="url(#ar)"/><rect x="588" y="100" width="166" height="60" rx="6" class="yel"/><text x="671" y="124" class="h2" text-anchor="middle" >stem</text><text x="671" y="144" class="mut" text-anchor="middle" >loved -&gt; love</text><line x1="754" y1="130" x2="774" y2="130" class="ln" marker-end="url(#ar)"/><rect x="774" y="100" width="166" height="60" rx="6" class="blu"/><text x="857" y="124" class="h2" text-anchor="middle" >count vector</text><text x="857" y="144" class="mut" text-anchor="middle" >one column per word</text><rect x="120" y="200" width="90" height="36" rx="0" class="cell"/><text x="165" y="223" class="numb" text-anchor="middle" >1</text><text x="165" y="252" class="mut" text-anchor="middle" >crust</text><rect x="210" y="200" width="90" height="36" rx="0" class="cell"/><text x="255" y="223" class="numb" text-anchor="middle" >1</text><text x="255" y="252" class="mut" text-anchor="middle" >good</text><rect x="300" y="200" width="90" height="36" rx="0" class="cell"/><text x="345" y="223" class="numb" text-anchor="middle" >0</text><text x="345" y="252" class="mut" text-anchor="middle" >love</text><rect x="390" y="200" width="90" height="36" rx="0" class="cell"/><text x="435" y="223" class="numb" text-anchor="middle" >1</text><text x="435" y="252" class="mut" text-anchor="middle" >not</text><rect x="480" y="200" width="90" height="36" rx="0" class="cell"/><text x="525" y="223" class="numb" text-anchor="middle" >0</text><text x="525" y="252" class="mut" text-anchor="middle" >place</text><rect x="570" y="200" width="90" height="36" rx="0" class="cell"/><text x="615" y="223" class="numb" text-anchor="middle" ></text><text x="615" y="252" class="mut" text-anchor="middle" >...</text><rect x="660" y="200" width="90" height="36" rx="0" class="cell"/><text x="705" y="223" class="numb" text-anchor="middle" >0</text><text x="705" y="252" class="mut" text-anchor="middle" >unknown</text><text x="40" y="223" class="h2" text-anchor="start" >the row:</text><text x="760" y="280" class="hand" text-anchor="end" >1,500 most frequent words kept</text><rect x="40" y="296" width="430" height="170" rx="6" class="note"/><text x="54" y="318" class="h2" text-anchor="start" >Then classify</text><text x="54" y="338" class="handk" text-anchor="start" >rows = reviews, columns = words: a sparse matrix</text><text x="54" y="356" class="handk" text-anchor="start" >naive Bayes (the course, Python),</text><text x="54" y="374" class="handk" text-anchor="start" >random forest (the course, R), logistic regression</text><text x="54" y="392" class="handk" text-anchor="start" ></text><text x="54" y="410" class="handk" text-anchor="start" >bag = order thrown away: 'not good' and</text><text x="54" y="428" class="handk" text-anchor="start" >'good, not bad' look alike unless you add</text><text x="54" y="446" class="handk" text-anchor="start" >word pairs (bigrams)</text><rect x="500" y="296" width="430" height="170" rx="6" class="note"/><text x="514" y="318" class="h2" text-anchor="start" >Where it sits</text><text x="514" y="338" class="handk" text-anchor="start" >NLP overlap deep learning = deep NLP; seq2seq in it</text><text x="514" y="356" class="handk" text-anchor="start" >rule-based chatbots -&gt; bag of words -&gt;</text><text x="514" y="374" class="handk" text-anchor="start" >CNNs on word vectors -&gt; seq2seq -&gt; transformers</text><text x="514" y="392" class="handk" text-anchor="start" ></text><text x="514" y="410" class="handk" text-anchor="start" >the course's email example: a 20,000-slot</text><text x="514" y="428" class="handk" text-anchor="start" >count vector with start/end/unknown slots,</text><text x="514" y="446" class="handk" text-anchor="start" >feeding a yes/no reply classifier</text></svg>
