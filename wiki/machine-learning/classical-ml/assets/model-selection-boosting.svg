<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="540" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >MODEL SELECTION AND BOOSTING</text><text x="30" y="62" class="h1" text-anchor="start" >Estimate honestly, tune on folds, then boost</text><line x1="30" y1="72" x2="690" y2="72" class="uline"/><text x="40" y="104" class="h2" text-anchor="start" >1. 10-fold cross-validation (inside the training set)</text><rect x="40" y="120" width="36" height="22" rx="2" class="pnk"/><rect x="78" y="120" width="36" height="22" rx="2" class="grn"/><rect x="116" y="120" width="36" height="22" rx="2" class="grn"/><rect x="154" y="120" width="36" height="22" rx="2" class="grn"/><rect x="192" y="120" width="36" height="22" rx="2" class="grn"/><rect x="230" y="120" width="36" height="22" rx="2" class="grn"/><rect x="268" y="120" width="36" height="22" rx="2" class="grn"/><rect x="306" y="120" width="36" height="22" rx="2" class="grn"/><rect x="344" y="120" width="36" height="22" rx="2" class="grn"/><rect x="382" y="120" width="36" height="22" rx="2" class="grn"/><text x="430" y="136" class="mut" text-anchor="start" >fit 1: score fold 1</text><rect x="40" y="146" width="36" height="22" rx="2" class="grn"/><rect x="78" y="146" width="36" height="22" rx="2" class="pnk"/><rect x="116" y="146" width="36" height="22" rx="2" class="grn"/><rect x="154" y="146" width="36" height="22" rx="2" class="grn"/><rect x="192" y="146" width="36" height="22" rx="2" class="grn"/><rect x="230" y="146" width="36" height="22" rx="2" class="grn"/><rect x="268" y="146" width="36" height="22" rx="2" class="grn"/><rect x="306" y="146" width="36" height="22" rx="2" class="grn"/><rect x="344" y="146" width="36" height="22" rx="2" class="grn"/><rect x="382" y="146" width="36" height="22" rx="2" class="grn"/><text x="430" y="162" class="mut" text-anchor="start" >fit 2: score fold 2</text><rect x="40" y="172" width="36" height="22" rx="2" class="grn"/><rect x="78" y="172" width="36" height="22" rx="2" class="grn"/><rect x="116" y="172" width="36" height="22" rx="2" class="pnk"/><rect x="154" y="172" width="36" height="22" rx="2" class="grn"/><rect x="192" y="172" width="36" height="22" rx="2" class="grn"/><rect x="230" y="172" width="36" height="22" rx="2" class="grn"/><rect x="268" y="172" width="36" height="22" rx="2" class="grn"/><rect x="306" y="172" width="36" height="22" rx="2" class="grn"/><rect x="344" y="172" width="36" height="22" rx="2" class="grn"/><rect x="382" y="172" width="36" height="22" rx="2" class="grn"/><text x="430" y="188" class="mut" text-anchor="start" >fit 3: score fold 3</text><rect x="40" y="198" width="36" height="22" rx="2" class="grn"/><rect x="78" y="198" width="36" height="22" rx="2" class="grn"/><rect x="116" y="198" width="36" height="22" rx="2" class="grn"/><rect x="154" y="198" width="36" height="22" rx="2" class="pnk"/><rect x="192" y="198" width="36" height="22" rx="2" class="grn"/><rect x="230" y="198" width="36" height="22" rx="2" class="grn"/><rect x="268" y="198" width="36" height="22" rx="2" class="grn"/><rect x="306" y="198" width="36" height="22" rx="2" class="grn"/><rect x="344" y="198" width="36" height="22" rx="2" class="grn"/><rect x="382" y="198" width="36" height="22" rx="2" class="grn"/><text x="430" y="214" class="mut" text-anchor="start" >fit 4: score fold 4</text><rect x="40" y="224" width="36" height="22" rx="2" class="grn"/><rect x="78" y="224" width="36" height="22" rx="2" class="grn"/><rect x="116" y="224" width="36" height="22" rx="2" class="grn"/><rect x="154" y="224" width="36" height="22" rx="2" class="grn"/><rect x="192" y="224" width="36" height="22" rx="2" class="pnk"/><rect x="230" y="224" width="36" height="22" rx="2" class="grn"/><rect x="268" y="224" width="36" height="22" rx="2" class="grn"/><rect x="306" y="224" width="36" height="22" rx="2" class="grn"/><rect x="344" y="224" width="36" height="22" rx="2" class="grn"/><rect x="382" y="224" width="36" height="22" rx="2" class="grn"/><text x="430" y="240" class="mut" text-anchor="start" >fit 5: score fold 5</text><text x="40" y="262" class="mut" text-anchor="start" >… 10 fits; report the mean and spread; test set touched once at the end</text><text x="560" y="104" class="h2" text-anchor="start" >2. bias vs variance (10 fits as darts)</text><circle cx="600" cy="150" r="36" class="cell"/><circle cx="600" cy="150" r="23" class="cell"/><circle cx="600" cy="150" r="10" class="cell"/><circle cx="573.4748203386764" cy="152.321155096903" r="2.5" class="pnk"/><circle cx="575.5423227867883" cy="154.24752272425968" r="2.5" class="pnk"/><circle cx="574.8787828968792" cy="154.054319967988" r="2.5" class="pnk"/><circle cx="566.3480627394034" cy="149.66997748202982" r="2.5" class="pnk"/><circle cx="577.3202806039798" cy="151.43015571011446" r="2.5" class="pnk"/><circle cx="576.8108059010075" cy="146.2867772606702" r="2.5" class="pnk"/><circle cx="571.6288285733859" cy="147.56709919315037" r="2.5" class="pnk"/><circle cx="572.5251303108312" cy="150.70983540410975" r="2.5" class="pnk"/><circle cx="566.1573702750668" cy="147.28060608445296" r="2.5" class="pnk"/><circle cx="569.3537883921333" cy="153.9969155693621" r="2.5" class="pnk"/><text x="648" y="144" class="mut" text-anchor="start" >high bias</text><text x="648" y="160" class="mut" text-anchor="start" >low variance</text><circle cx="770" cy="150" r="36" class="cell"/><circle cx="770" cy="150" r="23" class="cell"/><circle cx="770" cy="150" r="10" class="cell"/><circle cx="782.7548216781988" cy="136.92880175454866" r="2.5" class="pnk"/><circle cx="784.2630555886979" cy="136.12866886651787" r="2.5" class="pnk"/><circle cx="775.6377209823736" cy="135.66525052993035" r="2.5" class="pnk"/><circle cx="746.0851933857217" cy="164.26194219741242" r="2.5" class="pnk"/><circle cx="756.0539063597656" cy="139.0744768982297" r="2.5" class="pnk"/><circle cx="793.1562132236444" cy="164.3004581927732" r="2.5" class="pnk"/><circle cx="759.8866480518525" cy="167.72075477568322" r="2.5" class="pnk"/><circle cx="771.8827265057989" cy="156.82869032642276" r="2.5" class="pnk"/><circle cx="755.829416697622" cy="166.93347844177916" r="2.5" class="pnk"/><circle cx="779.1508131731316" cy="167.9160695929803" r="2.5" class="pnk"/><text x="818" y="144" class="mut" text-anchor="start" >low bias</text><text x="818" y="160" class="mut" text-anchor="start" >high variance</text><circle cx="600" cy="248" r="36" class="cell"/><circle cx="600" cy="248" r="23" class="cell"/><circle cx="600" cy="248" r="10" class="cell"/><circle cx="594.899600523671" cy="250.27349367758853" r="2.5" class="pnk"/><circle cx="569.3371168666745" cy="245.17271259378222" r="2.5" class="pnk"/><circle cx="558.9936916579528" cy="241.30136499362598" r="2.5" class="pnk"/><circle cx="566.4652368369342" cy="261.95942390045394" r="2.5" class="pnk"/><circle cx="552.1623897299692" cy="264.83267518263136" r="2.5" class="pnk"/><circle cx="568.2190493581376" cy="250.70238457356015" r="2.5" class="pnk"/><circle cx="591.2888675830594" cy="257.2606151665935" r="2.5" class="pnk"/><circle cx="567.1580690806293" cy="257.27878603149554" r="2.5" class="pnk"/><circle cx="585.8241184387637" cy="240.98883569417433" r="2.5" class="pnk"/><circle cx="598.8047790309233" cy="239.67803762890446" r="2.5" class="pnk"/><text x="648" y="242" class="mut" text-anchor="start" >high bias</text><text x="648" y="258" class="mut" text-anchor="start" >high variance</text><circle cx="770" cy="248" r="36" class="cell"/><circle cx="770" cy="248" r="23" class="cell"/><circle cx="770" cy="248" r="10" class="cell"/><circle cx="772.9975402674953" cy="251.31085653812605" r="2.5" class="pnk"/><circle cx="764.2168104245424" cy="250.76228771821218" r="2.5" class="pnk"/><circle cx="768.3942137101023" cy="248.753780758946" r="2.5" class="pnk"/><circle cx="764.1089406418344" cy="243.64858033950983" r="2.5" class="pnk"/><circle cx="766.1710338554126" cy="252.3697270360752" r="2.5" class="pnk"/><circle cx="766.3582600461561" cy="250.45506955953266" r="2.5" class="pnk"/><circle cx="775.1558638351703" cy="252.2436207625059" r="2.5" class="pnk"/><circle cx="768.1325817566361" cy="246.60601476855595" r="2.5" class="pnk"/><circle cx="770.2964218483174" cy="250.64578894111037" r="2.5" class="pnk"/><circle cx="765.296634428778" cy="250.38462134225276" r="2.5" class="pnk"/><text x="818" y="242" class="mut" text-anchor="start" >low bias</text><text x="818" y="258" class="mut" text-anchor="start" >low variance</text><text x="40" y="310" class="h2" text-anchor="start" >3. boosting: each new tree fits what the ensemble still gets wrong</text><rect x="40" y="326" width="190" height="56" rx="6" class="yel"/><text x="135" y="350" class="numb" text-anchor="middle" >tree 1</text><text x="135" y="370" class="mut" text-anchor="middle" >fit the target</text><line x1="230" y1="354" x2="270" y2="354" class="ln" marker-end="url(#ar)"/><rect x="270" y="326" width="190" height="56" rx="6" class="yel"/><text x="365" y="350" class="numb" text-anchor="middle" >tree 2</text><text x="365" y="370" class="mut" text-anchor="middle" >fit residuals of 1</text><line x1="460" y1="354" x2="500" y2="354" class="ln" marker-end="url(#ar)"/><rect x="500" y="326" width="190" height="56" rx="6" class="yel"/><text x="595" y="350" class="numb" text-anchor="middle" >tree 3</text><text x="595" y="370" class="mut" text-anchor="middle" >fit residuals of 1+2</text><line x1="690" y1="354" x2="730" y2="354" class="ln" marker-end="url(#ar)"/><rect x="730" y="326" width="190" height="56" rx="6" class="grn"/><text x="825" y="350" class="numb" text-anchor="middle" >sum of trees</text><text x="825" y="370" class="mut" text-anchor="middle" >prediction</text><rect x="40" y="400" width="430" height="120" rx="6" class="note"/><text x="54" y="422" class="h2" text-anchor="start" >Grid search</text><text x="54" y="442" class="handk" text-anchor="start" >try every combination (C, kernel, gamma)</text><text x="54" y="460" class="handk" text-anchor="start" >score each with k-fold CV, keep the best</text><text x="54" y="478" class="handk" text-anchor="start" >its best CV score is optimistic:</text><text x="54" y="496" class="handk" text-anchor="start" >use a test set or nested CV to report</text><rect x="500" y="400" width="430" height="120" rx="6" class="note"/><text x="514" y="422" class="h2" text-anchor="start" >XGBoost</text><text x="514" y="442" class="handk" text-anchor="start" >gradient-boosted trees with regularisation,</text><text x="514" y="460" class="handk" text-anchor="start" >shrinkage (learning rate) and fast splitting;</text><text x="514" y="478" class="handk" text-anchor="start" >strong default for tabular data —</text><text x="514" y="496" class="handk" text-anchor="start" >but not always the winner (see snippet)</text></svg>
