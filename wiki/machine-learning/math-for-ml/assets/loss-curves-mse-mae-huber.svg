<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <style>
    .ax    { stroke: #64748b; stroke-width: 1.5; }
    .grid  { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 4; }
    .mse   { stroke: #2563eb; stroke-width: 3; fill: none; }
    .mae   { stroke: #dc2626; stroke-width: 3; fill: none; }
    .huber { stroke: #059669; stroke-width: 3; fill: none; stroke-dasharray: 6 5; }
    .txt   { fill: #0f172a; }
    .tick  { fill: #475569; font-size: 12px; }
    .title { font-weight: 700; font-size: 16px; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .mse { stroke: #60a5fa; }
      .mae { stroke: #f87171; }
      .huber { stroke: #6ee7b7; }
      .txt, .title { fill: #e2e8f0; }
      .tick { fill: #cbd5e1; }
    }
  </style>

  <text class="title" x="360" y="30" text-anchor="middle">Loss vs. residual — MSE explodes, MAE stays linear</text>

  <line class="ax" x1="60" y1="380" x2="660" y2="380"/>
  <line class="ax" x1="60" y1="60"  x2="60"  y2="385"/>

  <g>
    <line class="grid" x1="180" y1="60" x2="180" y2="380"/>
    <text class="tick" x="180" y="398" text-anchor="middle">1</text>
    <line class="grid" x1="300" y1="60" x2="300" y2="380"/>
    <text class="tick" x="300" y="398" text-anchor="middle">2</text>
    <line class="grid" x1="420" y1="60" x2="420" y2="380"/>
    <text class="tick" x="420" y="398" text-anchor="middle">3</text>
    <line class="grid" x1="540" y1="60" x2="540" y2="380"/>
    <text class="tick" x="540" y="398" text-anchor="middle">4</text>
    <line class="grid" x1="660" y1="60" x2="660" y2="380"/>
    <text class="tick" x="660" y="398" text-anchor="middle">5</text>
    <text class="tick" x="60"  y="398" text-anchor="middle">0</text>
  </g>
  <text class="tick" x="360" y="415" text-anchor="middle">|residual| r</text>

  <g>
    <line class="grid" x1="60" y1="380" x2="660" y2="380"/>
    <line class="grid" x1="60" y1="316" x2="660" y2="316"/>
    <text class="tick" x="55" y="320" text-anchor="end">5</text>
    <line class="grid" x1="60" y1="252" x2="660" y2="252"/>
    <text class="tick" x="55" y="256" text-anchor="end">10</text>
    <line class="grid" x1="60" y1="188" x2="660" y2="188"/>
    <text class="tick" x="55" y="192" text-anchor="end">15</text>
    <line class="grid" x1="60" y1="124" x2="660" y2="124"/>
    <text class="tick" x="55" y="128" text-anchor="end">20</text>
    <line class="grid" x1="60" y1="60"  x2="660" y2="60"/>
    <text class="tick" x="55" y="64" text-anchor="end">25</text>
    <text class="tick" x="55" y="384" text-anchor="end">0</text>
  </g>
  <text class="tick" x="30" y="220" text-anchor="middle" transform="rotate(-90 30,220)">loss</text>

  <path class="mse" d="
    M 60 380
    L 90 379.2
    L 120 376.8
    L 150 372.8
    L 180 367.2
    L 210 360.0
    L 240 351.2
    L 270 340.8
    L 300 328.8
    L 330 315.2
    L 360 300.0
    L 390 283.2
    L 420 264.8
    L 450 244.8
    L 480 223.2
    L 510 200.0
    L 540 175.2
    L 570 148.8
    L 600 120.8
    L 630 91.2
    L 660 60.0
  "/>

  <line class="mae" x1="60" y1="380" x2="660" y2="316"/>

  <path class="huber" d="
    M 60 380
    L 90 379.6
    L 120 378.4
    L 150 376.4
    L 180 373.6
    L 210 369.28
    L 240 363.52
    L 270 357.76
    L 300 352.0
    L 330 346.24
    L 360 340.48
    L 390 334.72
    L 420 328.96
    L 450 323.2
    L 480 317.44
    L 510 311.68
    L 540 305.92
    L 570 300.16
    L 600 294.4
    L 630 288.64
    L 660 282.88
  "/>

  <rect x="80" y="70" width="220" height="90" rx="6" fill="rgba(255,255,255,0.85)" stroke="#cbd5e1"/>
  <line class="mse"   x1="95" y1="90"  x2="140" y2="90"/>
  <text class="txt" x="150" y="94">MSE = r²  (Gaussian)</text>
  <line class="mae"   x1="95" y1="115" x2="140" y2="115"/>
  <text class="txt" x="150" y="119">MAE = |r|  (Laplace)</text>
  <line class="huber" x1="95" y1="140" x2="140" y2="140"/>
  <text class="txt" x="150" y="144">Huber (δ = 1)</text>

  <circle cx="660" cy="60" r="4" fill="#2563eb"/>
  <text class="tick" x="640" y="55" text-anchor="end">MSE(5) = 25</text>
  <circle cx="660" cy="316" r="4" fill="#dc2626"/>
  <text class="tick" x="640" y="332" text-anchor="end">MAE(5) = 5</text>
</svg>
