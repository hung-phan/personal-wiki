<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >STAGE B · STEPS 5, 9, 10</text><text x="30" y="62" class="h1" text-anchor="start" >Many heads, then mix them with W_O</text><line x1="30" y1="72" x2="540" y2="72" class="uline"/><text x="60" y="104" class="h2" text-anchor="start" >Q, K, V — each 6 × 512 — columns cut into 4 heads of 128</text><rect x="60" y="114" width="160" height="50" rx="0" class="pur"/><text x="140" y="144" class="num" text-anchor="middle" >cols 0–127</text><line x1="140" y1="166" x2="140" y2="200" class="ln" marker-end="url(#ar)"/><rect x="68" y="202" width="144" height="76" rx="6" class="note"/><text x="140" y="224" class="h2" text-anchor="middle" >Head 1</text><text x="140" y="244" class="mut" text-anchor="middle" >steps 6–9 on its</text><text x="140" y="258" class="mut" text-anchor="middle" >own 6 × 128 slice</text><line x1="140" y1="280" x2="140" y2="312" class="ln" marker-end="url(#ar)"/><text x="148" y="302" class="hand" text-anchor="start" >Z1: 6 × 128</text><rect x="60" y="314" width="160" height="50" rx="0" class="pur"/><text x="140" y="344" class="h2" text-anchor="middle" >Z1</text><rect x="220" y="114" width="160" height="50" rx="0" class="grn"/><text x="300" y="144" class="num" text-anchor="middle" >cols 128–255</text><line x1="300" y1="166" x2="300" y2="200" class="ln" marker-end="url(#ar)"/><rect x="228" y="202" width="144" height="76" rx="6" class="note"/><text x="300" y="224" class="h2" text-anchor="middle" >Head 2</text><text x="300" y="244" class="mut" text-anchor="middle" >steps 6–9 on its</text><text x="300" y="258" class="mut" text-anchor="middle" >own 6 × 128 slice</text><line x1="300" y1="280" x2="300" y2="312" class="ln" marker-end="url(#ar)"/><text x="308" y="302" class="hand" text-anchor="start" >Z2: 6 × 128</text><rect x="220" y="314" width="160" height="50" rx="0" class="grn"/><text x="300" y="344" class="h2" text-anchor="middle" >Z2</text><rect x="380" y="114" width="160" height="50" rx="0" class="yel"/><text x="460" y="144" class="num" text-anchor="middle" >cols 256–383</text><line x1="460" y1="166" x2="460" y2="200" class="ln" marker-end="url(#ar)"/><rect x="388" y="202" width="144" height="76" rx="6" class="note"/><text x="460" y="224" class="h2" text-anchor="middle" >Head 3</text><text x="460" y="244" class="mut" text-anchor="middle" >steps 6–9 on its</text><text x="460" y="258" class="mut" text-anchor="middle" >own 6 × 128 slice</text><line x1="460" y1="280" x2="460" y2="312" class="ln" marker-end="url(#ar)"/><text x="468" y="302" class="hand" text-anchor="start" >Z3: 6 × 128</text><rect x="380" y="314" width="160" height="50" rx="0" class="yel"/><text x="460" y="344" class="h2" text-anchor="middle" >Z3</text><rect x="540" y="114" width="160" height="50" rx="0" class="blu"/><text x="620" y="144" class="num" text-anchor="middle" >cols 384–511</text><line x1="620" y1="166" x2="620" y2="200" class="ln" marker-end="url(#ar)"/><rect x="548" y="202" width="144" height="76" rx="6" class="note"/><text x="620" y="224" class="h2" text-anchor="middle" >Head 4</text><text x="620" y="244" class="mut" text-anchor="middle" >steps 6–9 on its</text><text x="620" y="258" class="mut" text-anchor="middle" >own 6 × 128 slice</text><line x1="620" y1="280" x2="620" y2="312" class="ln" marker-end="url(#ar)"/><text x="628" y="302" class="hand" text-anchor="start" >Z4: 6 × 128</text><rect x="540" y="314" width="160" height="50" rx="0" class="blu"/><text x="620" y="344" class="h2" text-anchor="middle" >Z4</text><text x="60" y="386" class="mut" text-anchor="start" >concat side by side → Z : 6 × 512 (heads still separate blocks of columns)</text><line x1="700" y1="339" x2="744" y2="339" class="ln" marker-end="url(#ar)"/><rect x="746" y="314" width="184" height="50" rx="6" class="pnk"/><text x="838" y="336" class="h2" text-anchor="middle" >× W_O</text><text x="838" y="354" class="mut" text-anchor="middle" >512 × 512, learned</text><line x1="838" y1="366" x2="838" y2="400" class="ln" marker-end="url(#ar)"/><rect x="746" y="402" width="23" height="50" rx="0" class="pur"/><rect x="769" y="402" width="23" height="50" rx="0" class="grn"/><rect x="792" y="402" width="23" height="50" rx="0" class="yel"/><rect x="815" y="402" width="23" height="50" rx="0" class="blu"/><rect x="838" y="402" width="23" height="50" rx="0" class="pur"/><rect x="861" y="402" width="23" height="50" rx="0" class="grn"/><rect x="884" y="402" width="23" height="50" rx="0" class="yel"/><rect x="907" y="402" width="23" height="50" rx="0" class="blu"/><text x="838" y="470" class="mut" text-anchor="middle" >O : 6 × 512 — every column</text><text x="838" y="486" class="mut" text-anchor="middle" >now mixes ALL heads</text><rect x="720" y="100" width="210" height="190" rx="6" class="note"/><text x="734" y="122" class="h2" text-anchor="start" >Why many heads?</text><text x="734" y="142" class="hand" text-anchor="start" >One softmax = one kind</text><text x="734" y="160" class="hand" text-anchor="start" >of “relevance”.</text><text x="734" y="178" class="hand" text-anchor="start" >4 heads let “sat” look at</text><text x="734" y="196" class="hand" text-anchor="start" >its subject in one head</text><text x="734" y="214" class="hand" text-anchor="start" >and the previous word</text><text x="734" y="232" class="hand" text-anchor="start" >in another (illustrative)</text><text x="734" y="250" class="hand" text-anchor="start" >— same cost as 1 big head.</text><rect x="30" y="410" width="680" height="130" rx="6" class="note"/><text x="44" y="432" class="h2" text-anchor="start" >Shapes to remember</text><text x="44" y="452" class="handk" text-anchor="start" >d_head = d_model / heads → 512 / 4 = 128</text><text x="44" y="470" class="handk" text-anchor="start" >GPT-3 175B: 96 heads × 128 = 12 288</text><text x="44" y="488" class="handk" text-anchor="start" >In → 6 × 512.  Out → 6 × 512.  Same shape, ready for the residual add.</text><text x="44" y="506" class="handk" text-anchor="start" >The deck's slide 15 uses 16 heads × 32 instead — also valid, just a different split.</text></svg>
