<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .txt     { fill: #0f172a; }
    .sub     { fill: #475569; font-size: 11px; }
    .shape   { fill: #334155; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title   { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .caption { font-size: 12px; fill: #475569; font-style: italic; }
    .line    { stroke: #0f172a; stroke-width: 1.6; fill: none; }
    .skip    { stroke: #dc2626; stroke-width: 1.8; fill: none; }
    .loop    { stroke: #7c3aed; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .frame   { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 7 5; }
    .skiplbl { fill: #dc2626; font-size: 11px; }
    .looplbl { fill: #7c3aed; font-size: 11px; }
    .embed   { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.3; }
    .norm    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.3; }
    .attn    { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.3; }
    .ffn     { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.3; }
    .out     { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.3; }
    .plus    { fill: #ffffff; stroke: #dc2626; stroke-width: 1.8; }
    .plustxt { fill: #dc2626; font-weight: 700; font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      .txt, .title { fill: #e2e8f0; }
      .sub, .caption { fill: #cbd5e1; }
      .shape { fill: #cbd5e1; }
      .line { stroke: #e2e8f0; }
      .frame { stroke: #94a3b8; }
      .skip, .plus { stroke: #f87171; }
      .skiplbl, .plustxt { fill: #f87171; }
      .loop { stroke: #a78bfa; }
      .looplbl { fill: #a78bfa; }
      .embed { fill: #3b0764; stroke: #a78bfa; }
      .norm  { fill: #451a03; stroke: #f59e0b; }
      .attn  { fill: #450a0a; stroke: #f87171; }
      .ffn   { fill: #172554; stroke: #60a5fa; }
      .out   { fill: #052e16; stroke: #4ade80; }
      .plus  { fill: #0f172a; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" class="title">GPT forward pass — the 18 PDF steps on one page (pre-LN, as GPT-2/3 actually do it)</text>

  <!-- main stream -->
  <rect x="260" y="50" width="300" height="44" rx="6" class="embed"/>
  <text x="410" y="69" text-anchor="middle" class="txt">Text → token IDs</text>
  <text x="410" y="85" text-anchor="middle" class="sub">step 1 · tokenizer (BPE), no learning</text>
  <text x="590" y="77" class="shape">ids: (6,)  integers</text>

  <line x1="410" y1="94" x2="410" y2="118" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="120" width="300" height="48" rx="6" class="embed"/>
  <text x="410" y="140" text-anchor="middle" class="txt">Embedding row lookup + position vector</text>
  <text x="410" y="157" text-anchor="middle" class="sub">steps 2–3 · X = W_E[ids] + W_P[0..5]</text>
  <text x="590" y="149" class="shape">X: 6 × 512</text>

  <!-- decoder block frame -->
  <rect x="160" y="186" width="710" height="372" rx="10" class="frame"/>
  <text x="850" y="548" text-anchor="end" class="caption">× N decoder blocks, identical shape, different weights (GPT-3 175B: N = 96)</text>

  <line x1="410" y1="168" x2="410" y2="218" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="220" width="300" height="34" rx="6" class="norm"/>
  <text x="410" y="242" text-anchor="middle" class="txt">LayerNorm</text><text x="550" y="242" text-anchor="end" class="sub">step 4</text>
  <text x="590" y="242" class="shape">6 × 512  (each row → mean 0, var 1)</text>

  <line x1="410" y1="254" x2="410" y2="272" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="274" width="300" height="52" rx="6" class="attn"/>
  <text x="410" y="295" text-anchor="middle" class="txt">Masked multi-head self-attention</text>
  <text x="410" y="313" text-anchor="middle" class="sub">steps 5–10 · tokens talk to EARLIER tokens</text>
  <text x="590" y="290" class="shape">Q,K,V per head: 6 × d_head</text>
  <text x="590" y="306" class="shape">scores, weights: 6 × 6</text>
  <text x="590" y="322" class="shape">concat · W_O → 6 × 512</text>

  <line x1="410" y1="326" x2="410" y2="339" class="line" marker-end="url(#ar)"/>
  <circle cx="410" cy="352" r="13" class="plus"/>
  <text x="410" y="358" text-anchor="middle" class="plustxt">+</text>
  <text x="590" y="356" class="shape">X ← X + Attn(LN(X))   step 11</text>

  <line x1="410" y1="365" x2="410" y2="400" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="402" width="300" height="34" rx="6" class="norm"/>
  <text x="410" y="424" text-anchor="middle" class="txt">LayerNorm</text><text x="550" y="424" text-anchor="end" class="sub">step 11</text>
  <text x="590" y="424" class="shape">6 × 512</text>

  <line x1="410" y1="436" x2="410" y2="452" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="454" width="300" height="44" rx="6" class="ffn"/>
  <text x="410" y="473" text-anchor="middle" class="txt">Feed-forward network (per token)</text>
  <text x="410" y="490" text-anchor="middle" class="sub">steps 12–13 · W₂ · GELU(W₁x + b₁) + b₂</text>
  <text x="590" y="480" class="shape">6×512 → 6×2048 → 6×512</text>

  <line x1="410" y1="498" x2="410" y2="510" class="line" marker-end="url(#ar)"/>
  <circle cx="410" cy="523" r="13" class="plus"/>
  <text x="410" y="529" text-anchor="middle" class="plustxt">+</text>
  <text x="590" y="527" class="shape">X ← X + FFN(LN(X))   step 14</text>

  <!-- residual skips -->
  <path d="M410,200 H220 V352 H395" class="skip" marker-end="url(#ar)"/>
  <path d="M410,380 H220 V523 H395" class="skip" marker-end="url(#ar)"/>
  <text x="214" y="282" text-anchor="end" class="skiplbl">residual</text>
  <text x="214" y="296" text-anchor="end" class="skiplbl">(copy)</text>
  <text x="214" y="460" text-anchor="end" class="skiplbl">residual</text>
  <text x="214" y="474" text-anchor="end" class="skiplbl">(copy)</text>

  <!-- head -->
  <line x1="410" y1="536" x2="410" y2="578" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="580" width="300" height="34" rx="6" class="norm"/>
  <text x="410" y="602" text-anchor="middle" class="txt">Final LayerNorm</text><text x="550" y="602" text-anchor="end" class="sub">step 15</text>
  <text x="590" y="602" class="shape">6 × 512</text>

  <line x1="410" y1="614" x2="410" y2="632" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="634" width="300" height="44" rx="6" class="out"/>
  <text x="410" y="653" text-anchor="middle" class="txt">Project to vocabulary → logits</text>
  <text x="410" y="670" text-anchor="middle" class="sub">step 16 · usually W_vocab = W_Eᵀ (tied)</text>
  <text x="590" y="660" class="shape">6×512 · 512×50257 → 6×50257</text>

  <line x1="410" y1="678" x2="410" y2="696" class="line" marker-end="url(#ar)"/>
  <rect x="260" y="698" width="300" height="44" rx="6" class="out"/>
  <text x="410" y="717" text-anchor="middle" class="txt">Softmax on LAST row → pick a token</text>
  <text x="410" y="734" text-anchor="middle" class="sub">steps 17–18 · argmax or sample</text>
  <text x="590" y="724" class="shape">p: 50257 probabilities, sum 1</text>

  <!-- autoregressive loop -->
  <path d="M260,720 H110 V72 H258" class="loop" marker-end="url(#ar)"/>
  <text x="100" y="400" text-anchor="middle" class="looplbl" transform="rotate(-90 100 400)">append the new token, run everything again (autoregressive loop)</text>

  <text x="460" y="782" text-anchor="middle" class="caption">Every arrow keeps the 6 × 512 shape until the vocab projection. Only attention mixes rows (tokens); everything else works on one row at a time.</text>
</svg>
