<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .title    { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .subtitle { font-weight: 700; font-size: 14px; fill: #0f172a; }
    .txt      { fill: #0f172a; }
    .label    { fill: #475569; font-size: 12px; }
    .note     { fill: #475569; font-size: 11px; font-style: italic; }

    .step-solve  { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .step-inv    { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .cost-solve  { fill: #16a34a; font-weight: 700; }
    .cost-inv    { fill: #dc2626; font-weight: 700; }

    .arrow-green { stroke: #16a34a; stroke-width: 2.5; fill: none; }
    .arrow-red   { stroke: #dc2626; stroke-width: 2.5; fill: none; }

    .ax     { stroke: #64748b; stroke-width: 1.5; }
    .grid   { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 4; }
    .line-solve { stroke: #16a34a; stroke-width: 2.5; fill: none; }
    .line-inv   { stroke: #dc2626; stroke-width: 2.5; fill: none; }
    .dot-solve  { fill: #16a34a; }
    .dot-inv    { fill: #dc2626; }
    .tick   { fill: #475569; font-size: 11px; }

    @media (prefers-color-scheme: dark) {
      .title, .subtitle, .txt { fill: #e2e8f0; }
      .label, .note, .tick { fill: #cbd5e1; }
      .ax { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .step-solve { fill: #14532d; stroke: #4ade80; }
      .step-inv   { fill: #7f1d1d; stroke: #f87171; }
      .cost-solve { fill: #4ade80; }
      .cost-inv   { fill: #f87171; }
      .arrow-green { stroke: #4ade80; }
      .arrow-red   { stroke: #f87171; }
      .line-solve  { stroke: #4ade80; }
      .line-inv    { stroke: #f87171; }
      .dot-solve   { fill: #4ade80; }
      .dot-inv     { fill: #f87171; }
    }
  </style>

  <defs>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text class="title" x="560" y="34" text-anchor="middle">solve(A, b) vs inv(A) @ b — same math on paper, very different on a computer</text>

  <!-- SOLVE pipeline: three boxes with 120 & 150 px gaps between them for labels -->
  <text class="subtitle" x="60"  y="70" fill="#16a34a">solve(A, b)  —  the right way</text>

  <rect class="step-solve" x="60"  y="84" width="120" height="52" rx="6"/>
  <text class="txt"   x="120" y="106" text-anchor="middle" font-weight="700">A</text>
  <text class="label" x="120" y="124" text-anchor="middle">input matrix</text>

  <text class="cost-solve" x="240" y="102" text-anchor="middle" font-size="11">LU factor</text>
  <text class="label"      x="240" y="118" text-anchor="middle">(2/3)n³</text>
  <path class="arrow-green" d="M 180 130 L 300 130" marker-end="url(#ah-g)"/>

  <rect class="step-solve" x="300" y="84" width="120" height="52" rx="6"/>
  <text class="txt"   x="360" y="106" text-anchor="middle" font-weight="700">L, U</text>
  <text class="label" x="360" y="124" text-anchor="middle">triangular factors</text>

  <text class="cost-solve" x="495" y="102" text-anchor="middle" font-size="11">fwd + back sub</text>
  <text class="label"      x="495" y="118" text-anchor="middle">2n²</text>
  <path class="arrow-green" d="M 420 130 L 570 130" marker-end="url(#ah-g)"/>

  <rect class="step-solve" x="570" y="84" width="120" height="52" rx="6"/>
  <text class="txt"   x="630" y="106" text-anchor="middle" font-weight="700">x</text>
  <text class="label" x="630" y="124" text-anchor="middle">answer</text>

  <rect class="step-solve" x="780" y="82" width="300" height="56" rx="6"/>
  <text class="txt"   x="930" y="106" text-anchor="middle" font-weight="700" font-size="14">Total ≈ (2/3)n³ + 2n²</text>
  <text class="label" x="930" y="126" text-anchor="middle">baseline cost</text>

  <!-- INV pipeline: 4 boxes + 3 arrow gaps, 60..950. Total sits in its own row below. -->
  <text class="subtitle" x="60" y="190" fill="#dc2626">inv(A) @ b  —  the "textbook" way that's wasteful and lossy</text>

  <rect class="step-inv" x="60" y="204" width="120" height="52" rx="6"/>
  <text class="txt"   x="120" y="226" text-anchor="middle" font-weight="700">A</text>
  <text class="label" x="120" y="244" text-anchor="middle">input matrix</text>

  <text class="cost-inv" x="240" y="222" text-anchor="middle" font-size="11">LU factor</text>
  <text class="label"    x="240" y="238" text-anchor="middle">(2/3)n³</text>
  <path class="arrow-red" d="M 180 250 L 300 250" marker-end="url(#ah-r)"/>

  <rect class="step-inv" x="300" y="204" width="120" height="52" rx="6"/>
  <text class="txt"   x="360" y="226" text-anchor="middle" font-weight="700">L, U</text>
  <text class="label" x="360" y="244" text-anchor="middle">triangular factors</text>

  <!-- The heavy middle step gets three lines of label; use a wider 150-px gap and shift the arrow down -->
  <text class="cost-inv" x="495" y="216" text-anchor="middle" font-size="11">solve n times</text>
  <text class="label"    x="495" y="232" text-anchor="middle">(once per e_i column)</text>
  <text class="cost-inv" x="495" y="272" text-anchor="middle" font-size="11">2n³ (!)</text>
  <path class="arrow-red" d="M 420 250 L 570 250" marker-end="url(#ah-r)"/>

  <rect class="step-inv" x="570" y="204" width="130" height="52" rx="6"/>
  <text class="txt"   x="635" y="226" text-anchor="middle" font-weight="700">A⁻¹</text>
  <text class="label" x="635" y="244" text-anchor="middle">explicit inverse</text>

  <text class="cost-inv" x="760" y="222" text-anchor="middle" font-size="11">A⁻¹ @ b</text>
  <text class="label"    x="760" y="238" text-anchor="middle">n²</text>
  <path class="arrow-red" d="M 700 250 L 820 250" marker-end="url(#ah-r)"/>

  <rect class="step-inv" x="820" y="204" width="130" height="52" rx="6"/>
  <text class="txt"   x="885" y="226" text-anchor="middle" font-weight="700">x</text>
  <text class="label" x="885" y="244" text-anchor="middle">noisier answer</text>

  <!-- Total row for inv (below, full-width) -->
  <rect class="step-inv" x="60" y="310" width="890" height="46" rx="6"/>
  <text class="txt" x="505" y="331" text-anchor="middle" font-weight="700" font-size="14">
    Total ≈ (8/3)n³ + n²  —  4× more work than solve, and produces a worse answer
  </text>

  <!-- Commentary strip -->
  <text class="note" x="505" y="385" text-anchor="middle" fill="#dc2626">
    The extra "solve n times" step produces a full inverse matrix — any noise in it gets multiplied by b at the end.
  </text>
  <text class="note" x="505" y="403" text-anchor="middle" fill="#dc2626">
    Solve's error grows as κ(A) · ε.   Invert-then-multiply's error grows as κ(A)² · ε in bad cases.
  </text>

  <!-- BOTTOM LEFT: mental model -->
  <g>
    <rect class="step-solve" x="60" y="430" width="510" height="230" rx="6"/>
    <text class="subtitle" x="315" y="457" text-anchor="middle">Mental model — why inversion is wasteful and lossy</text>

    <text class="txt" x="82" y="490" font-weight="700" font-size="13">Cost</text>
    <text class="label" x="82" y="510">Both paths build the same LU factors — solve stops there.</text>
    <text class="label" x="82" y="528">Invert keeps going: run n more back-substitutions to produce</text>
    <text class="label" x="82" y="546">every column of A⁻¹. That's 3× the arithmetic, then one more matmul.</text>

    <text class="txt" x="82" y="580" font-weight="700" font-size="13">Stability</text>
    <text class="label" x="82" y="600">Each column of A⁻¹ carries floating-point noise proportional to κ(A).</text>
    <text class="label" x="82" y="618">Multiplying that noisy matrix by b mixes and amplifies the noise —</text>
    <text class="label" x="82" y="636">final error tracks κ(A)² in worst cases. Solve avoids the middle-man.</text>
    <text class="label" x="82" y="654" font-style="italic">Rule of thumb: if your code computes A⁻¹, it's probably a bug.</text>
  </g>

  <!-- BOTTOM RIGHT: error-vs-condition chart -->
  <text class="subtitle" x="850" y="457" text-anchor="middle">Relative error vs. condition number κ(A)</text>

  <g>
    <line class="ax" x1="650" y1="480" x2="650" y2="660"/>
    <line class="ax" x1="650" y1="660" x2="1080" y2="660"/>

    <line class="grid" x1="650"  y1="480" x2="650"  y2="660"/>
    <text class="tick" x="650"  y="675" text-anchor="middle">10²</text>
    <line class="grid" x1="793"  y1="480" x2="793"  y2="660"/>
    <text class="tick" x="793"  y="675" text-anchor="middle">10⁵</text>
    <line class="grid" x1="937"  y1="480" x2="937"  y2="660"/>
    <text class="tick" x="937"  y="675" text-anchor="middle">10⁸</text>
    <line class="grid" x1="1080" y1="480" x2="1080" y2="660"/>
    <text class="tick" x="1080" y="675" text-anchor="middle">10¹¹</text>

    <line class="grid" x1="650" y1="480"   x2="1080" y2="480"/>
    <text class="tick" x="645" y="484" text-anchor="end">10⁻³</text>
    <line class="grid" x1="650" y1="521.5" x2="1080" y2="521.5"/>
    <text class="tick" x="645" y="525.5" text-anchor="end">10⁻⁶</text>
    <line class="grid" x1="650" y1="563.1" x2="1080" y2="563.1"/>
    <text class="tick" x="645" y="567.1" text-anchor="end">10⁻⁹</text>
    <line class="grid" x1="650" y1="604.6" x2="1080" y2="604.6"/>
    <text class="tick" x="645" y="608.6" text-anchor="end">10⁻¹²</text>
    <line class="grid" x1="650" y1="646.2" x2="1080" y2="646.2"/>
    <text class="tick" x="645" y="650.2" text-anchor="end">10⁻¹⁵</text>

    <!-- benchmark points, remapped to y offset +20 vs previous version -->
    <polyline class="line-solve" points="650,631.7 793,602.5 937,563.4 1080,521.6"/>
    <circle class="dot-solve" cx="650"  cy="631.7" r="4"/>
    <circle class="dot-solve" cx="793"  cy="602.5" r="4"/>
    <circle class="dot-solve" cx="937"  cy="563.4" r="4"/>
    <circle class="dot-solve" cx="1080" cy="521.6" r="4"/>

    <polyline class="line-inv" points="650,624.7 793,589.6 937,547.6 1080,506.0"/>
    <circle class="dot-inv" cx="650"  cy="624.7" r="4"/>
    <circle class="dot-inv" cx="793"  cy="589.6" r="4"/>
    <circle class="dot-inv" cx="937"  cy="547.6" r="4"/>
    <circle class="dot-inv" cx="1080" cy="506.0" r="4"/>

    <text class="tick" x="865" y="692" text-anchor="middle">condition number κ(A)</text>
    <text class="tick" x="615" y="570" text-anchor="middle" transform="rotate(-90 615,570)">relative error</text>

    <line class="line-solve" x1="920" y1="492" x2="950" y2="492"/>
    <text class="txt" x="956" y="496" fill="#16a34a">solve(A, b)</text>
    <line class="line-inv" x1="920" y1="510" x2="950" y2="510"/>
    <text class="txt" x="956" y="514" fill="#dc2626">inv(A) @ b</text>
  </g>
</svg>
