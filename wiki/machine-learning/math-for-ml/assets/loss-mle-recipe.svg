<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16">
  <style>
    .box { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; }
    .label { fill: #1e1b4b; }
    .step { fill: #4338ca; font-weight: 700; }
    .arrow { stroke: #3730a3; stroke-width: 2.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e1b4b; stroke: #a5b4fc; }
      .label { fill: #e0e7ff; }
      .step { fill: #c7d2fe; }
      .arrow { stroke: #a5b4fc; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3730a3"/>
    </marker>
  </defs>

  <rect class="box" x="20"  y="50" width="180" height="80" rx="12"/>
  <text class="step"  x="110" y="80"  text-anchor="middle">1. Assume</text>
  <text class="label" x="110" y="100" text-anchor="middle">noise distribution</text>
  <text class="label" x="110" y="118" text-anchor="middle" font-style="italic">ε ~ ?</text>

  <rect class="box" x="240" y="50" width="180" height="80" rx="12"/>
  <text class="step"  x="330" y="80"  text-anchor="middle">2. Write PDF</text>
  <text class="label" x="330" y="100" text-anchor="middle">P(y | x, θ)</text>

  <rect class="box" x="460" y="50" width="180" height="80" rx="12"/>
  <text class="step"  x="550" y="80"  text-anchor="middle">3. Log</text>
  <text class="label" x="550" y="100" text-anchor="middle">log P(y | x, θ)</text>

  <rect class="box" x="680" y="50" width="200" height="80" rx="12"/>
  <text class="step"  x="780" y="80"  text-anchor="middle">4. Negate + sum</text>
  <text class="label" x="780" y="100" text-anchor="middle">= total loss</text>

  <path class="arrow" d="M 200 90 L 240 90" marker-end="url(#ah)"/>
  <path class="arrow" d="M 420 90 L 460 90" marker-end="url(#ah)"/>
  <path class="arrow" d="M 640 90 L 680 90" marker-end="url(#ah)"/>
</svg>
