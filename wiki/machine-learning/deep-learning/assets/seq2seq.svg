<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="550" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >SEQ2SEQ</text><text x="30" y="62" class="h1" text-anchor="start" >Encode the whole input into a state, decode one token at a time</text><line x1="30" y1="72" x2="975" y2="72" class="uline"/><rect x="40" y="240" width="90" height="40" rx="4" class="yel"/><text x="85" y="265" class="numb" text-anchor="middle" >LSTM</text><line x1="85" y1="316" x2="85" y2="282" class="ln" marker-end="url(#ar)"/><text x="85" y="332" class="num" text-anchor="middle" >how</text><line x1="130" y1="260" x2="150" y2="260" class="ln" marker-end="url(#ar)"/><rect x="150" y="240" width="90" height="40" rx="4" class="yel"/><text x="195" y="265" class="numb" text-anchor="middle" >LSTM</text><line x1="195" y1="316" x2="195" y2="282" class="ln" marker-end="url(#ar)"/><text x="195" y="332" class="num" text-anchor="middle" >are</text><line x1="240" y1="260" x2="260" y2="260" class="ln" marker-end="url(#ar)"/><rect x="260" y="240" width="90" height="40" rx="4" class="yel"/><text x="305" y="265" class="numb" text-anchor="middle" >LSTM</text><line x1="305" y1="316" x2="305" y2="282" class="ln" marker-end="url(#ar)"/><text x="305" y="332" class="num" text-anchor="middle" >you</text><text x="175" y="220" class="mut" text-anchor="middle" >encoder (outputs thrown away)</text><rect x="370" y="236" width="120" height="48" rx="6" class="pnk"/><text x="430" y="256" class="numb" text-anchor="middle" >thought vector</text><text x="430" y="274" class="mut" text-anchor="middle" >final h, c</text><line x1="350" y1="260" x2="370" y2="260" class="ln" marker-end="url(#ar)"/><line x1="490" y1="260" x2="520" y2="260" class="ln" marker-end="url(#ar)"/><rect x="520" y="240" width="100" height="40" rx="4" class="blu"/><text x="570" y="265" class="numb" text-anchor="middle" >LSTM</text><line x1="570" y1="316" x2="570" y2="282" class="ln" marker-end="url(#ar)"/><text x="570" y="332" class="num" text-anchor="middle" >&lt;sos&gt;</text><line x1="570" y1="240" x2="570" y2="200" class="ln" marker-end="url(#ar)"/><rect x="520" y="160" width="100" height="40" rx="4" class="grn"/><text x="570" y="185" class="numb" text-anchor="middle" >cómo</text><line x1="620" y1="260" x2="660" y2="260" class="ln" marker-end="url(#ar)"/><path d="M620,180 C 640,180 640,330 680,330" class="lnd" marker-end="url(#ar)"/><rect x="660" y="240" width="100" height="40" rx="4" class="blu"/><text x="710" y="265" class="numb" text-anchor="middle" >LSTM</text><line x1="710" y1="316" x2="710" y2="282" class="ln" marker-end="url(#ar)"/><text x="710" y="332" class="num" text-anchor="middle" >cómo</text><line x1="710" y1="240" x2="710" y2="200" class="ln" marker-end="url(#ar)"/><rect x="660" y="160" width="100" height="40" rx="4" class="grn"/><text x="710" y="185" class="numb" text-anchor="middle" >estás</text><line x1="760" y1="260" x2="800" y2="260" class="ln" marker-end="url(#ar)"/><path d="M760,180 C 780,180 780,330 820,330" class="lnd" marker-end="url(#ar)"/><rect x="800" y="240" width="100" height="40" rx="4" class="blu"/><text x="850" y="265" class="numb" text-anchor="middle" >LSTM</text><line x1="850" y1="316" x2="850" y2="282" class="ln" marker-end="url(#ar)"/><text x="850" y="332" class="num" text-anchor="middle" >estás</text><line x1="850" y1="240" x2="850" y2="200" class="ln" marker-end="url(#ar)"/><rect x="800" y="160" width="100" height="40" rx="4" class="grn"/><text x="850" y="185" class="numb" text-anchor="middle" >&lt;eos&gt;</text><text x="730" y="140" class="mut" text-anchor="middle" >decoder: predicts the next word</text><text x="730" y="360" class="hand" text-anchor="middle" >dashed: at inference, feed back the word just predicted</text><rect x="40" y="392" width="430" height="140" rx="6" class="note"/><text x="54" y="414" class="h2" text-anchor="start" >Training: teacher forcing</text><text x="54" y="434" class="handk" text-anchor="start" >decoder input  = &lt;sos&gt; cómo estás</text><text x="54" y="452" class="handk" text-anchor="start" >decoder target = cómo estás &lt;eos&gt;</text><text x="54" y="470" class="handk" text-anchor="start" ></text><text x="54" y="488" class="handk" text-anchor="start" >feed the TRUE previous word, not the guess:</text><text x="54" y="506" class="handk" text-anchor="start" >fast, stable, but never practises recovering</text><rect x="500" y="392" width="430" height="140" rx="6" class="note"/><text x="514" y="414" class="h2" text-anchor="start" >Inference: a loop</text><text x="514" y="434" class="handk" text-anchor="start" >x = &lt;sos&gt;, state = encoder's final state</text><text x="514" y="452" class="handk" text-anchor="start" >repeat: predict, pick (argmax or sample),</text><text x="514" y="470" class="handk" text-anchor="start" >feed it back; stop at &lt;eos&gt; or max length</text><text x="514" y="488" class="handk" text-anchor="start" ></text><text x="514" y="506" class="handk" text-anchor="start" >needs its own one-step decoder model</text><rect x="40" y="96" width="300" height="96" rx="6" class="note"/><text x="54" y="118" class="h2" text-anchor="start" >Bidirectional encoder</text><text x="54" y="138" class="handk" text-anchor="start" >read left-to-right AND right-to-left,</text><text x="54" y="156" class="handk" text-anchor="start" >concatenate: T x 2M</text><text x="54" y="174" class="handk" text-anchor="start" >only if the whole input is known</text></svg>
