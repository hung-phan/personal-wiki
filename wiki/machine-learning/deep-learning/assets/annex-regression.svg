<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="580" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >ML BASICS (ANNEX)</text><text x="30" y="62" class="h1" text-anchor="start" >A line for numbers, an S-curve for yes/no</text><line x1="30" y1="72" x2="645" y2="72" class="uline"/><text x="40" y="104" class="h2" text-anchor="start" >1. linear regression: minimise the squared gaps</text><path d="M70,420.0 L450,420.0 M70,420.0 L70,121.0" class="ln"/><text x="450" y="438.0" class="mut" text-anchor="end" >hours studied</text><text x="76" y="125.0" class="mut" text-anchor="start" >score</text><path d="M70,370.67777777777775 L450,145.27777777777777" class="lnr"/><line x1="108" y1="341.8" x2="108" y2="348.1377777777777" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="108" cy="341.8" r="4.5" class="pnk"/><circle cx="108" cy="348.1377777777777" r="3" class="grn"/><line x1="146" y1="332.6" x2="146" y2="325.59777777777776" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="146" cy="332.6" r="4.5" class="pnk"/><circle cx="146" cy="325.59777777777776" r="3" class="grn"/><line x1="184" y1="291.20000000000005" x2="184" y2="303.05777777777774" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="184" cy="291.20000000000005" r="4.5" class="pnk"/><circle cx="184" cy="303.05777777777774" r="3" class="grn"/><line x1="222" y1="295.8" x2="222" y2="280.5177777777777" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="222" cy="295.8" r="4.5" class="pnk"/><circle cx="222" cy="280.5177777777777" r="3" class="grn"/><line x1="260" y1="245.20000000000002" x2="260" y2="257.97777777777776" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="260" cy="245.20000000000002" r="4.5" class="pnk"/><circle cx="260" cy="257.97777777777776" r="3" class="grn"/><line x1="298" y1="254.4" x2="298" y2="235.43777777777774" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="298" cy="254.4" r="4.5" class="pnk"/><circle cx="298" cy="235.43777777777774" r="3" class="grn"/><line x1="336" y1="199.20000000000002" x2="336" y2="212.89777777777772" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="336" cy="199.20000000000002" r="4.5" class="pnk"/><circle cx="336" cy="212.89777777777772" r="3" class="grn"/><line x1="374" y1="208.4" x2="374" y2="190.35777777777776" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="374" cy="208.4" r="4.5" class="pnk"/><circle cx="374" cy="190.35777777777776" r="3" class="grn"/><line x1="412" y1="153.20000000000005" x2="412" y2="167.8177777777778" class="ln" stroke="#5f8a3a" stroke-width="2"/><circle cx="412" cy="153.20000000000005" r="4.5" class="pnk"/><circle cx="412" cy="167.8177777777778" r="3" class="grn"/><text x="250" y="241.20000000000002" class="handk" text-anchor="end" >y_i (actual)</text><text x="270" y="275.97777777777776" class="handk" text-anchor="start" >ŷ_i (on the line)</text><text x="78" y="362.67777777777775" class="hand" text-anchor="start" >b0 = 40.7: score at 0 hours</text><text x="282.79999999999995" y="146.2937777777778" class="hand" text-anchor="middle" >b1 = 4.90 points per hour</text><rect x="40" y="450" width="420" height="106" rx="6" class="note"/><text x="54" y="472" class="h2" text-anchor="start" >Ordinary least squares</text><text x="54" y="492" class="handk" text-anchor="start" >Of all straight lines, keep the one with the</text><text x="54" y="510" class="handk" text-anchor="start" >smallest sum of (y_i − ŷ_i)². Closed form:</text><text x="54" y="528" class="handk" text-anchor="start" >b1 = cov(x, y) / var(x),  b0 = ȳ − b1·x̄</text><text x="510" y="104" class="h2" text-anchor="start" >2. logistic regression: predict a probability</text><path d="M540.0,380 L924.4000000000001,380 M540.0,416.0 L540.0,116.0" class="ln"/><text x="534.0" y="384" class="num" text-anchor="end" >0</text><text x="534.0" y="264.0" class="num" text-anchor="end" >0.5</text><text x="534.0" y="144" class="num" text-anchor="end" >1</text><text x="924.4000000000001" y="398" class="mut" text-anchor="end" >days since last order</text><path d="M540.0,260.0 L924.4000000000001,260.0" class="lnd"/><text x="924.4000000000001" y="254.0" class="mut" text-anchor="end" >threshold 0.5</text><circle cx="558.6" cy="380" r="4" class="blu"/><circle cx="583.4" cy="380" r="4" class="blu"/><circle cx="602.0" cy="380" r="4" class="blu"/><circle cx="626.8" cy="380" r="4" class="blu"/><circle cx="651.6" cy="380" r="4" class="blu"/><circle cx="676.4" cy="380" r="4" class="blu"/><circle cx="701.2" cy="380" r="4" class="blu"/><circle cx="719.8" cy="380" r="4" class="blu"/><circle cx="788.0" cy="380" r="4" class="blu"/><circle cx="688.8" cy="140" r="4" class="pnk"/><circle cx="732.2" cy="140" r="4" class="pnk"/><circle cx="750.8" cy="140" r="4" class="pnk"/><circle cx="775.6" cy="140" r="4" class="pnk"/><circle cx="806.6" cy="140" r="4" class="pnk"/><circle cx="831.4000000000001" cy="140" r="4" class="pnk"/><circle cx="856.2" cy="140" r="4" class="pnk"/><circle cx="881.0" cy="140" r="4" class="pnk"/><circle cx="899.6" cy="140" r="4" class="pnk"/><path d="M540.0,408.8 L912.0,111.19999999999999" class="lnd"/><text x="546.2" y="412.8" class="mut" text-anchor="start" >straight line goes below 0 (and above 1)</text><path d="M540.0,379.5 L546.2,379.4 L552.4,379.3 L558.6,379.1 L564.8,378.9 L571.0,378.7 L577.2,378.4 L583.4,378.0 L589.6,377.6 L595.8,377.1 L602.0,376.5 L608.2,375.7 L614.4,374.7 L620.6,373.6 L626.8,372.2 L633.0,370.6 L639.2,368.6 L645.4,366.2 L651.6,363.4 L657.8,360.0 L664.0,356.1 L670.2,351.4 L676.4,346.0 L682.6,339.7 L688.8,332.5 L695.0,324.4 L701.2,315.5 L707.4,305.6 L713.6,295.0 L719.8,283.7 L726.0,272.0 L732.2,260.0 L738.4,248.0 L744.6,236.3 L750.8,225.0 L757.0,214.4 L763.2,204.5 L769.4,195.6 L775.6,187.5 L781.8,180.3 L788.0,174.0 L794.2,168.6 L800.4,163.9 L806.6,160.0 L812.8,156.6 L819.0,153.8 L825.2,151.4 L831.4,149.4 L837.6,147.8 L843.8,146.4 L850.0,145.3 L856.2,144.3 L862.4,143.5 L868.6,142.9 L874.8,142.4 L881.0,142.0 L887.2,141.6 L893.4,141.3 L899.6,141.1 L905.8,140.9 L912.0,140.7" class="lnr"/><line x1="571.0" y1="380" x2="571.0" y2="378.7" class="lnd"/><circle cx="571.0" cy="378.6832882641319" r="4" class="yel"/><text x="571.0" y="368.6832882641319" class="numb" text-anchor="middle" >0.8%</text><line x1="695.0" y1="380" x2="695.0" y2="324.4" class="lnd"/><circle cx="695.0" cy="324.44594803976423" r="4" class="yel"/><text x="695.0" y="314.44594803976423" class="numb" text-anchor="middle" >24%</text><line x1="757.0" y1="380" x2="757.0" y2="214.4" class="lnd"/><circle cx="757.0" cy="214.406124529373" r="4" class="yel"/><text x="757.0" y="204.406124529373" class="numb" text-anchor="middle" >67%</text><line x1="881.0" y1="380" x2="881.0" y2="142.0" class="lnd"/><circle cx="881.0" cy="141.95901707675836" r="4" class="yel"/><text x="881.0" y="131.95901707675836" class="numb" text-anchor="middle" >99%</text><rect x="510" y="450" width="420" height="106" rx="6" class="note"/><text x="524" y="472" class="h2" text-anchor="start" >Two outputs from one curve</text><text x="524" y="492" class="handk" text-anchor="start" >p̂ = σ(b0 + b1·x) is between 0 and 1: a score you</text><text x="524" y="510" class="handk" text-anchor="start" >can rank customers by. ŷ = 1 if p̂ &gt; threshold:</text><text x="524" y="528" class="handk" text-anchor="start" >0.5 by default, move it to trade misses for false alarms.</text></svg>
