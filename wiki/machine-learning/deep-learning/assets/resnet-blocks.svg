<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 645" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="645" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >RESNET BLOCKS</text><text x="30" y="62" class="h1" text-anchor="start" >Same main branch, two kinds of shortcut</text><line x1="30" y1="72" x2="615" y2="72" class="uline"/><text x="30" y="104" class="h2" text-anchor="start" >A. identity block</text><circle cx="220" cy="120" r="11" class="pnk"/><text x="220" y="125" class="numb" text-anchor="middle" >x</text><line x1="220" y1="131" x2="220" y2="140" class="ln" marker-end="url(#ar)"/><rect x="160" y="142" width="120" height="18" rx="2" class="cell"/><text x="220" y="155" class="num" text-anchor="middle" >Conv 1x1, f1</text><path d="M220,160 L220,166" class="ln"/><rect x="160" y="166" width="120" height="18" rx="2" class="cell"/><text x="220" y="179" class="num" text-anchor="middle" >BN</text><path d="M220,184 L220,190" class="ln"/><rect x="160" y="190" width="120" height="18" rx="2" class="cell"/><text x="220" y="203" class="num" text-anchor="middle" >ReLU</text><path d="M220,208 L220,214" class="ln"/><rect x="160" y="214" width="120" height="18" rx="2" class="cell"/><text x="220" y="227" class="num" text-anchor="middle" >Conv 3x3, f2</text><path d="M220,232 L220,238" class="ln"/><rect x="160" y="238" width="120" height="18" rx="2" class="cell"/><text x="220" y="251" class="num" text-anchor="middle" >BN</text><path d="M220,256 L220,262" class="ln"/><rect x="160" y="262" width="120" height="18" rx="2" class="cell"/><text x="220" y="275" class="num" text-anchor="middle" >ReLU</text><path d="M220,280 L220,286" class="ln"/><rect x="160" y="286" width="120" height="18" rx="2" class="cell"/><text x="220" y="299" class="num" text-anchor="middle" >Conv 1x1, f3</text><path d="M220,304 L220,310" class="ln"/><rect x="160" y="310" width="120" height="18" rx="2" class="cell"/><text x="220" y="323" class="num" text-anchor="middle" >BN</text><line x1="220" y1="328" x2="220" y2="338" class="ln" marker-end="url(#ar)"/><circle cx="220" cy="352" r="13" class="pnk"/><text x="220" y="357" class="numb" text-anchor="middle" >+</text><line x1="220" y1="365" x2="220" y2="375" class="ln" marker-end="url(#ar)"/><rect x="160" y="375" width="120" height="18" rx="2" class="grn"/><text x="220" y="388" class="num" text-anchor="middle" >ReLU</text><line x1="220" y1="393" x2="220" y2="403" class="ln" marker-end="url(#ar)"/><circle cx="220" cy="414" r="11" class="grn"/><text x="220" y="419" class="num" text-anchor="middle" >out</text><path d="M231,120 L300,120 L300,352 L235,352" class="ln" marker-end="url(#ar)"/><text x="312" y="228" class="mut" text-anchor="start" >shortcut: a plain wire,</text><text x="312" y="244" class="mut" text-anchor="start" >0 parameters, 0 cost</text><text x="312" y="300" class="hand" text-anchor="start" >no ReLU before the</text><text x="312" y="318" class="hand" text-anchor="start" >add - activation</text><text x="312" y="336" class="hand" text-anchor="start" >comes AFTER it</text><text x="30" y="344" class="numb" text-anchor="start" >out = f(x) + x</text><text x="30" y="362" class="mut" text-anchor="start" >f learns only the</text><text x="30" y="378" class="mut" text-anchor="start" >RESIDUAL; f(x)=0</text><text x="30" y="394" class="mut" text-anchor="start" >recovers identity</text><line x1="150" y1="352" x2="205" y2="352" class="lnd" marker-end="url(#ar)"/><path d="M478,96 L478,440" class="lnd"/><text x="500" y="104" class="h2" text-anchor="start" >B. convolutional block</text><circle cx="690" cy="120" r="11" class="pnk"/><text x="690" y="125" class="numb" text-anchor="middle" >x</text><line x1="690" y1="131" x2="690" y2="140" class="ln" marker-end="url(#ar)"/><rect x="630" y="142" width="120" height="18" rx="2" class="cell"/><text x="690" y="155" class="num" text-anchor="middle" >Conv 1x1, str s</text><path d="M690,160 L690,166" class="ln"/><rect x="630" y="166" width="120" height="18" rx="2" class="cell"/><text x="690" y="179" class="num" text-anchor="middle" >BN</text><path d="M690,184 L690,190" class="ln"/><rect x="630" y="190" width="120" height="18" rx="2" class="cell"/><text x="690" y="203" class="num" text-anchor="middle" >ReLU</text><path d="M690,208 L690,214" class="ln"/><rect x="630" y="214" width="120" height="18" rx="2" class="cell"/><text x="690" y="227" class="num" text-anchor="middle" >Conv 3x3, f2</text><path d="M690,232 L690,238" class="ln"/><rect x="630" y="238" width="120" height="18" rx="2" class="cell"/><text x="690" y="251" class="num" text-anchor="middle" >BN</text><path d="M690,256 L690,262" class="ln"/><rect x="630" y="262" width="120" height="18" rx="2" class="cell"/><text x="690" y="275" class="num" text-anchor="middle" >ReLU</text><path d="M690,280 L690,286" class="ln"/><rect x="630" y="286" width="120" height="18" rx="2" class="cell"/><text x="690" y="299" class="num" text-anchor="middle" >Conv 1x1, f3</text><path d="M690,304 L690,310" class="ln"/><rect x="630" y="310" width="120" height="18" rx="2" class="cell"/><text x="690" y="323" class="num" text-anchor="middle" >BN</text><line x1="690" y1="328" x2="690" y2="338" class="ln" marker-end="url(#ar)"/><circle cx="690" cy="352" r="13" class="pnk"/><text x="690" y="357" class="numb" text-anchor="middle" >+</text><line x1="690" y1="365" x2="690" y2="375" class="ln" marker-end="url(#ar)"/><rect x="630" y="375" width="120" height="18" rx="2" class="grn"/><text x="690" y="388" class="num" text-anchor="middle" >ReLU</text><line x1="690" y1="393" x2="690" y2="403" class="ln" marker-end="url(#ar)"/><circle cx="690" cy="414" r="11" class="grn"/><text x="690" y="419" class="num" text-anchor="middle" >out</text><path d="M701,120 L855,120 L855,196" class="ln" marker-end="url(#ar)"/><rect x="800" y="196" width="110" height="22" rx="2" class="yel"/><text x="855" y="211" class="num" text-anchor="middle" >Conv 1x1, str s</text><line x1="855" y1="218" x2="855" y2="248" class="ln" marker-end="url(#ar)"/><rect x="800" y="248" width="110" height="22" rx="2" class="yel"/><text x="855" y="263" class="num" text-anchor="middle" >BN</text><path d="M855,270 L855,282 L775,282 L775,352 L705,352" class="ln" marker-end="url(#ar)"/><text x="800" y="302" class="mut" text-anchor="start" >shortcut has a conv:</text><text x="800" y="318" class="mut" text-anchor="start" >it ADDS parameters</text><text x="500" y="344" class="mut" text-anchor="start" >used when the shape</text><text x="500" y="360" class="mut" text-anchor="start" >changes (stride or</text><text x="500" y="376" class="mut" text-anchor="start" >channel count), so x</text><text x="500" y="392" class="mut" text-anchor="start" >CAN be added at all</text><line x1="620" y1="352" x2="675" y2="352" class="lnd" marker-end="url(#ar)"/><text x="30" y="440" class="h2" text-anchor="start" >C. how they stack</text><rect x="30" y="466" width="88" height="26" rx="3" class="cell"/><text x="74" y="483" class="num" text-anchor="middle" >conv 7x7</text><line x1="118" y1="479" x2="130" y2="479" class="ln" marker-end="url(#ar)"/><rect x="130" y="466" width="88" height="26" rx="3" class="cell"/><text x="174" y="483" class="num" text-anchor="middle" >BN</text><line x1="218" y1="479" x2="230" y2="479" class="ln" marker-end="url(#ar)"/><rect x="230" y="466" width="88" height="26" rx="3" class="cell"/><text x="274" y="483" class="num" text-anchor="middle" >maxpool</text><line x1="318" y1="479" x2="330" y2="479" class="ln" marker-end="url(#ar)"/><rect x="330" y="466" width="88" height="26" rx="3" class="grn"/><text x="374" y="483" class="num" text-anchor="middle" >C I I</text><line x1="418" y1="479" x2="430" y2="479" class="ln" marker-end="url(#ar)"/><text x="374" y="460" class="mut" text-anchor="middle" >stage2</text><rect x="430" y="466" width="88" height="26" rx="3" class="grn"/><text x="474" y="483" class="num" text-anchor="middle" >C I I I</text><line x1="518" y1="479" x2="530" y2="479" class="ln" marker-end="url(#ar)"/><text x="474" y="460" class="mut" text-anchor="middle" >stage3</text><rect x="530" y="466" width="88" height="26" rx="3" class="grn"/><text x="574" y="483" class="num" text-anchor="middle" >C I I I I I</text><line x1="618" y1="479" x2="630" y2="479" class="ln" marker-end="url(#ar)"/><text x="574" y="460" class="mut" text-anchor="middle" >stage4</text><rect x="630" y="466" width="88" height="26" rx="3" class="grn"/><text x="674" y="483" class="num" text-anchor="middle" >C I I</text><line x1="718" y1="479" x2="730" y2="479" class="ln" marker-end="url(#ar)"/><text x="674" y="460" class="mut" text-anchor="middle" >stage5</text><rect x="730" y="466" width="88" height="26" rx="3" class="cell"/><text x="774" y="483" class="num" text-anchor="middle" >avg pool</text><line x1="818" y1="479" x2="830" y2="479" class="ln" marker-end="url(#ar)"/><rect x="830" y="466" width="88" height="26" rx="3" class="cell"/><text x="874" y="483" class="num" text-anchor="middle" >Dense 1000</text><text x="30" y="512" class="mut" text-anchor="start" >C = convolutional block (shortcut has a conv) ; I = identity block (plain wire)</text><text x="30" y="530" class="numb" text-anchor="start" >16 blocks x 3 convs + the first conv + the final dense = 50 -&gt; ResNet50</text><rect x="30" y="552" width="900" height="76" rx="6" class="note"/><text x="44" y="574" class="h2" text-anchor="start" >The one idea</text><text x="44" y="594" class="handk" text-anchor="start" >The two block types have the SAME main branch; the only difference is what the shortcut carries - a bare</text><text x="44" y="612" class="handk" text-anchor="start" >wire, or one conv + BN to match a changed shape. In both, the last BN has no ReLU: it comes after the add.</text></svg>
