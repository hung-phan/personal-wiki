<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="506" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >WHY AN ACTIVATION</text><text x="30" y="62" class="h1" text-anchor="start" >Without one, depth is an illusion</text><line x1="30" y1="72" x2="525" y2="72" class="uline"/><text x="30" y="116" class="h2" text-anchor="start" >no activation</text><rect x="36" y="136" width="90" height="48" rx="6" class="blu"/><text x="81" y="166" class="numb" text-anchor="middle" >W1</text><rect x="146" y="136" width="90" height="48" rx="6" class="blu"/><text x="191" y="166" class="numb" text-anchor="middle" >W2</text><line x1="126" y1="160" x2="146" y2="160" class="ln" marker-end="url(#ar)"/><text x="36" y="212" class="mut" text-anchor="start" >two matrices, 112 numbers</text><line x1="130" y1="232" x2="130" y2="258" class="lnr" marker-end="url(#arr)"/><text x="146" y="250" class="hand" text-anchor="start" >is algebraically</text><rect x="36" y="268" width="200" height="48" rx="6" class="grey"/><text x="136" y="298" class="numb" text-anchor="middle" >W2 . W1</text><text x="36" y="344" class="num" text-anchor="start" >ONE matrix, 12 numbers.</text><text x="36" y="362" class="num" text-anchor="start" >you paid for depth and</text><text x="36" y="380" class="num" text-anchor="start" >got a one-layer model.</text><path d="M290,100 L290,398" class="lnd"/><text x="312" y="116" class="h2" text-anchor="start" >with an activation</text><rect x="318" y="136" width="90" height="48" rx="6" class="blu"/><text x="363.0" y="166" class="numb" text-anchor="middle" >W1</text><rect x="428" y="136" width="70" height="48" rx="6" class="yel"/><text x="463.0" y="166" class="numb" text-anchor="middle" >g</text><rect x="538" y="136" width="90" height="48" rx="6" class="blu"/><text x="583.0" y="166" class="numb" text-anchor="middle" >W2</text><line x1="408" y1="160" x2="428" y2="160" class="ln" marker-end="url(#ar)"/><line x1="498" y1="160" x2="538" y2="160" class="ln" marker-end="url(#ar)"/><text x="318" y="212" class="mut" text-anchor="start" >g is not linear, so the product</text><text x="318" y="228" class="mut" text-anchor="start" >cannot be folded up</text><rect x="318" y="252" width="310" height="64" rx="6" class="note"/><text x="332" y="278" class="handk" text-anchor="start" >depth now buys real</text><text x="332" y="298" class="handk" text-anchor="start" >extra expressiveness</text><text x="318" y="344" class="num" text-anchor="start" >ANY nonlinearity does this -</text><text x="318" y="362" class="num" text-anchor="start" >sigmoid, tanh, ReLU, GELU.</text><text x="318" y="380" class="num" text-anchor="start" >It does not pick between them.</text><path d="M660,100 L660,398" class="lnd"/><text x="682" y="116" class="h2" text-anchor="start" >the smallest proof: XOR</text><path d="M696,314 L696,190" class="ln"/><path d="M696,314 L820,314" class="ln"/><circle cx="710" cy="300" r="13" class="grn"/><text x="710" y="304" class="num" text-anchor="middle" >0</text><circle cx="710" cy="210" r="13" class="pnk"/><text x="710" y="214" class="num" text-anchor="middle" >1</text><circle cx="800" cy="300" r="13" class="pnk"/><text x="800" y="304" class="num" text-anchor="middle" >1</text><circle cx="800" cy="210" r="13" class="grn"/><text x="800" y="214" class="num" text-anchor="middle" >0</text><path d="M755,322 L755,186" class="lnr"/><text x="682" y="166" class="hand" text-anchor="start" >try any line: each side is</text><text x="682" y="184" class="hand" text-anchor="start" >still left with a 0 AND a 1</text><text x="682" y="344" class="num" text-anchor="start" >linear stack:  MSE 0.250</text><text x="682" y="362" class="num" text-anchor="start" >with ReLU:     MSE 0.000</text><text x="682" y="380" class="num" text-anchor="start" >with sigmoid:  MSE 0.000</text><rect x="30" y="410" width="900" height="80" rx="6" class="note"/><text x="44" y="432" class="h2" text-anchor="start" >The one idea</text><text x="44" y="452" class="handk" text-anchor="start" >Breaking linearity is what makes depth mean anything - and it is the job of ANY activation.</text><text x="44" y="470" class="handk" text-anchor="start" >Which activation to use is a separate question, decided by gradient flow, not expressiveness.</text></svg>
