<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="552" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >BACKPROPAGATION</text><text x="30" y="62" class="h1" text-anchor="start" >Two stories about blame, and which one is the gradient</text><line x1="30" y1="72" x2="840" y2="72" class="uline"/><text x="30" y="112" class="h2" text-anchor="start" >A. the book's intuition</text><text x="30" y="134" class="mut" text-anchor="start" >split the blame by weight</text><circle cx="90" cy="190" r="18" class="grn"/><text x="90" y="195" class="num" text-anchor="middle" >h1</text><circle cx="90" cy="266" r="18" class="grn"/><text x="90" y="271" class="num" text-anchor="middle" >h2</text><circle cx="250" cy="228" r="18" class="pnk"/><text x="250" y="233" class="num" text-anchor="middle" >o1</text><line x1="108" y1="190" x2="232" y2="222" class="ln" marker-end="url(#ar)"/><line x1="108" y1="266" x2="232" y2="234" class="ln" marker-end="url(#ar)"/><text x="165" y="186" class="num" text-anchor="middle" >w=3</text><text x="165" y="272" class="num" text-anchor="middle" >w=1</text><text x="282" y="233" class="numb" text-anchor="start" >e1</text><text x="282" y="251" class="mut" text-anchor="start" >error</text><text x="36" y="316" class="mut" text-anchor="start" >the bigger weight did more of the damage,</text><text x="36" y="332" class="mut" text-anchor="start" >so give it more of the blame:</text><text x="36" y="358" class="num" text-anchor="start" >e(h1) = e1 * 3/(3+1) = 0.75 e1</text><text x="36" y="376" class="num" text-anchor="start" >e(h2) = e1 * 1/(3+1) = 0.25 e1</text><text x="36" y="404" class="hand" text-anchor="start" >the shares add to 1 - it is a split</text><path d="M330,100 L330,440" class="lnd"/><text x="352" y="112" class="h2" text-anchor="start" >B. what the code does</text><text x="358" y="146" class="numb" text-anchor="start" >e(hidden) = W.T . e(output)</text><rect x="358" y="164" width="230" height="64" rx="6" class="grey"/><text x="473" y="188" class="num" text-anchor="middle" >e(h1) = 3 e1</text><text x="473" y="208" class="num" text-anchor="middle" >e(h2) = 1 e1</text><text x="358" y="256" class="hand" text-anchor="start" >the denominators are GONE.</text><text x="358" y="274" class="hand" text-anchor="start" >these are 4x the shares in A.</text><text x="358" y="302" class="mut" text-anchor="start" >The book switches from one to the</text><text x="358" y="318" class="mut" text-anchor="start" >other without saying so. The split</text><text x="358" y="334" class="mut" text-anchor="start" >story is a mnemonic for the SHAPE</text><text x="358" y="350" class="mut" text-anchor="start" >of the answer, W.T, not for its size.</text><text x="358" y="378" class="mut" text-anchor="start" >A per-node denominator is not a</text><text x="358" y="394" class="mut" text-anchor="start" >constant, so the learning rate</text><text x="358" y="410" class="mut" text-anchor="start" >cannot absorb it.</text><path d="M612,100 L612,440" class="lnd"/><text x="634" y="112" class="h2" text-anchor="start" >C. the actual gradient</text><text x="640" y="146" class="num" text-anchor="start" >dE/do(j) = sum over k of</text><rect x="640" y="164" width="290" height="48" rx="6" class="yel"/><text x="785" y="194" class="numb" text-anchor="middle" >e(k) * sig'(net k) * w(j,k)</text><text x="640" y="240" class="hand" text-anchor="start" >the chain rule puts sig'(net k)</text><text x="640" y="258" class="hand" text-anchor="start" >INSIDE the sum. The book</text><text x="640" y="276" class="hand" text-anchor="start" >leaves it out.</text><text x="640" y="306" class="mut" text-anchor="start" >Measured on one hidden layer:</text><text x="640" y="328" class="num" text-anchor="start" >cosine vs true gradient  0.9996</text><text x="640" y="346" class="num" text-anchor="start" >magnitude                5.17x</text><text x="640" y="374" class="mut" text-anchor="start" >Right direction, wrong length -</text><text x="640" y="390" class="mut" text-anchor="start" >which is why the book's network</text><text x="640" y="406" class="mut" text-anchor="start" >trains anyway and nobody notices.</text><rect x="30" y="456" width="900" height="80" rx="6" class="note"/><text x="44" y="478" class="h2" text-anchor="start" >The one idea</text><text x="44" y="498" class="handk" text-anchor="start" >All three stories agree that blame flows back through W transposed. They disagree on the factor.</text><text x="44" y="516" class="handk" text-anchor="start" >Only C is the derivative of the loss; A and B are useful pictures that happen to point the same way.</text></svg>
