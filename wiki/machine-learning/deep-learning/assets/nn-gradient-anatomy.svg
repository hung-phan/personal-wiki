<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="584" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >THE ONE LAW</text><text x="30" y="62" class="h1" text-anchor="start" >A gradient is three numbers multiplied</text><line x1="30" y1="72" x2="600" y2="72" class="uline"/><text x="30" y="112" class="mut" text-anchor="start" >one weight, one training example</text><rect x="120" y="126" width="190" height="58" rx="6" class="pnk"/><text x="215.0" y="150" class="numb" text-anchor="middle" >error</text><text x="215.0" y="168" class="mut" text-anchor="middle" >how wrong</text><rect x="400" y="126" width="190" height="58" rx="6" class="yel"/><text x="495.0" y="150" class="numb" text-anchor="middle" >responsiveness</text><text x="495.0" y="168" class="mut" text-anchor="middle" >how reactive</text><rect x="680" y="126" width="190" height="58" rx="6" class="grn"/><text x="775.0" y="150" class="numb" text-anchor="middle" >signal</text><text x="775.0" y="168" class="mut" text-anchor="middle" >how loud</text><text x="330" y="162" class="h2" text-anchor="middle" >x</text><text x="610" y="162" class="h2" text-anchor="middle" >x</text><text x="30" y="162" class="numb" text-anchor="middle" >dE</text><text x="30" y="176" class="numb" text-anchor="middle" >dw</text><path d="M20,166 L42,166" class="ln"/><text x="70" y="162" class="h2" text-anchor="middle" >=</text><line x1="878" y1="155" x2="918" y2="155" class="ln" marker-end="url(#ar)"/><text x="926" y="150" class="mut" text-anchor="start" >the</text><text x="926" y="166" class="mut" text-anchor="start" >step</text><text x="215.0" y="204" class="num" text-anchor="middle" >dE/do</text><text x="495.0" y="204" class="num" text-anchor="middle" >do/dnet</text><text x="775.0" y="204" class="num" text-anchor="middle" >dnet/dw</text><path d="M30,226 L930,226" class="lnd"/><text x="30" y="252" class="h2" text-anchor="start" >A product dies if ANY factor dies - so there are exactly three failures</text><text x="36" y="304" class="num" text-anchor="start" >all three alive</text><rect x="320" y="282" width="78" height="34" rx="4" class="pnk"/><text x="359" y="304" class="num" text-anchor="middle" >0.40</text><text x="405" y="304" class="ink" text-anchor="middle" >x</text><rect x="412" y="282" width="78" height="34" rx="4" class="yel"/><text x="451" y="304" class="num" text-anchor="middle" >0.24</text><text x="497" y="304" class="ink" text-anchor="middle" >x</text><rect x="504" y="282" width="78" height="34" rx="4" class="grn"/><text x="543" y="304" class="num" text-anchor="middle" >0.80</text><text x="596" y="304" class="ink" text-anchor="middle" >=</text><rect x="612" y="282" width="60" height="34" rx="4" class="blu"/><text x="642" y="304" class="numb" text-anchor="middle" >0.077</text><text x="690" y="304" class="mut" text-anchor="start" >the weight moves</text><text x="36" y="354" class="num" text-anchor="start" >this output is already right</text><rect x="320" y="332" width="78" height="34" rx="4" class="grey"/><text x="359" y="354" class="numb" text-anchor="middle" >0.00</text><text x="405" y="354" class="ink" text-anchor="middle" >x</text><rect x="412" y="332" width="78" height="34" rx="4" class="yel"/><text x="451" y="354" class="num" text-anchor="middle" >0.24</text><text x="497" y="354" class="ink" text-anchor="middle" >x</text><rect x="504" y="332" width="78" height="34" rx="4" class="grn"/><text x="543" y="354" class="num" text-anchor="middle" >0.80</text><text x="596" y="354" class="ink" text-anchor="middle" >=</text><rect x="612" y="332" width="60" height="34" rx="4" class="note"/><text x="642" y="354" class="numb" text-anchor="middle" >0</text><text x="690" y="354" class="mut" text-anchor="start" >fine - nothing to fix</text><text x="36" y="404" class="num" text-anchor="start" >the node is saturated / dead</text><rect x="320" y="382" width="78" height="34" rx="4" class="pnk"/><text x="359" y="404" class="num" text-anchor="middle" >0.40</text><text x="405" y="404" class="ink" text-anchor="middle" >x</text><rect x="412" y="382" width="78" height="34" rx="4" class="grey"/><text x="451" y="404" class="numb" text-anchor="middle" >0.00</text><text x="497" y="404" class="ink" text-anchor="middle" >x</text><rect x="504" y="382" width="78" height="34" rx="4" class="grn"/><text x="543" y="404" class="num" text-anchor="middle" >0.80</text><text x="596" y="404" class="ink" text-anchor="middle" >=</text><rect x="612" y="382" width="60" height="34" rx="4" class="note"/><text x="642" y="404" class="numb" text-anchor="middle" >0</text><text x="690" y="404" class="hand" text-anchor="start" >FROZEN - the real bug</text><text x="36" y="454" class="num" text-anchor="start" >the input on this link is 0</text><rect x="320" y="432" width="78" height="34" rx="4" class="pnk"/><text x="359" y="454" class="num" text-anchor="middle" >0.40</text><text x="405" y="454" class="ink" text-anchor="middle" >x</text><rect x="412" y="432" width="78" height="34" rx="4" class="yel"/><text x="451" y="454" class="num" text-anchor="middle" >0.24</text><text x="497" y="454" class="ink" text-anchor="middle" >x</text><rect x="504" y="432" width="78" height="34" rx="4" class="grey"/><text x="543" y="454" class="numb" text-anchor="middle" >0.00</text><text x="596" y="454" class="ink" text-anchor="middle" >=</text><rect x="612" y="432" width="60" height="34" rx="4" class="note"/><text x="642" y="454" class="numb" text-anchor="middle" >0</text><text x="690" y="454" class="hand" text-anchor="start" >FROZEN - never updates</text><rect x="30" y="488" width="900" height="80" rx="6" class="note"/><text x="44" y="510" class="h2" text-anchor="start" >The one idea</text><text x="44" y="530" class="handk" text-anchor="start" >Read it as error x responsiveness x signal and you can name what will fail before you train.</text><text x="44" y="548" class="handk" text-anchor="start" >Scaling, initialisation, ReLU and cross-entropy are all ways of keeping one of these off zero.</text></svg>
