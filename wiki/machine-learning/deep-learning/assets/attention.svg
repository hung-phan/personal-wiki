<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="510" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >ATTENTION</text><text x="30" y="62" class="h1" text-anchor="start" >At every output step, look back at all input positions</text><line x1="30" y1="72" x2="840" y2="72" class="uline"/><rect x="60" y="380" width="90" height="40" rx="4" class="yel"/><text x="105" y="405" class="numb" text-anchor="middle" >h1</text><text x="105" y="440" class="num" text-anchor="middle" >how</text><rect x="60" y="290" width="90" height="40" rx="4" class="grey"/><text x="105" y="315" class="num" text-anchor="middle" >score</text><line x1="105" y1="380" x2="105" y2="332" class="ln" marker-end="url(#ar)"/><rect x="75" y="206.0" width="60" height="4.0" rx="2" class="pnk"/><text x="105" y="200.0" class="num" text-anchor="middle" >α=0.05</text><line x1="105" y1="290" x2="105" y2="214" class="ln" marker-end="url(#ar)"/><rect x="180" y="380" width="90" height="40" rx="4" class="yel"/><text x="225" y="405" class="numb" text-anchor="middle" >h2</text><text x="225" y="440" class="num" text-anchor="middle" >are</text><rect x="180" y="290" width="90" height="40" rx="4" class="grey"/><text x="225" y="315" class="num" text-anchor="middle" >score</text><line x1="225" y1="380" x2="225" y2="332" class="ln" marker-end="url(#ar)"/><rect x="195" y="202.0" width="60" height="8.0" rx="2" class="pnk"/><text x="225" y="196.0" class="num" text-anchor="middle" >α=0.1</text><line x1="225" y1="290" x2="225" y2="214" class="ln" marker-end="url(#ar)"/><rect x="300" y="380" width="90" height="40" rx="4" class="yel"/><text x="345" y="405" class="numb" text-anchor="middle" >h3</text><text x="345" y="440" class="num" text-anchor="middle" >you</text><rect x="300" y="290" width="90" height="40" rx="4" class="grey"/><text x="345" y="315" class="num" text-anchor="middle" >score</text><line x1="345" y1="380" x2="345" y2="332" class="ln" marker-end="url(#ar)"/><rect x="315" y="154.0" width="60" height="56.0" rx="2" class="pnk"/><text x="345" y="148.0" class="num" text-anchor="middle" >α=0.7</text><line x1="345" y1="290" x2="345" y2="214" class="ln" marker-end="url(#ar)"/><rect x="420" y="380" width="90" height="40" rx="4" class="yel"/><text x="465" y="405" class="numb" text-anchor="middle" >h4</text><text x="465" y="440" class="num" text-anchor="middle" >today</text><rect x="420" y="290" width="90" height="40" rx="4" class="grey"/><text x="465" y="315" class="num" text-anchor="middle" >score</text><line x1="465" y1="380" x2="465" y2="332" class="ln" marker-end="url(#ar)"/><rect x="435" y="198.0" width="60" height="12.0" rx="2" class="pnk"/><text x="465" y="192.0" class="num" text-anchor="middle" >α=0.15</text><line x1="465" y1="290" x2="465" y2="214" class="ln" marker-end="url(#ar)"/><text x="60" y="456" class="mut" text-anchor="start" >bidirectional encoder: one vector per input word</text><text x="560" y="322" class="num" text-anchor="start" >score = Dense(1)( tanh( Dense(10)( [s_(t−1); h_j] ) ) )</text><text x="560" y="340" class="mut" text-anchor="start" >the same tiny network for every position j</text><text x="560" y="196" class="num" text-anchor="start" >α = softmax over the input positions</text><text x="560" y="214" class="mut" text-anchor="start" >(sums to 1 across time, not across features)</text><rect x="560" y="100" width="170" height="50" rx="6" class="grn"/><text x="645" y="122" class="numb" text-anchor="middle" >context_t</text><text x="645" y="140" class="num" text-anchor="middle" >Σ α_j · h_j</text><rect x="780" y="100" width="150" height="50" rx="6" class="blu"/><text x="855" y="122" class="numb" text-anchor="middle" >decoder step t</text><text x="855" y="140" class="mut" text-anchor="middle" >input: [prev word; context]</text><line x1="730" y1="125" x2="780" y2="125" class="ln" marker-end="url(#ar)"/><path d="M855,150 L855,290 L770,290" class="lnd" marker-end="url(#ar)"/><text x="845" y="230" class="hand" text-anchor="end" >s_(t−1) goes into</text><text x="845" y="246" class="hand" text-anchor="end" >every score</text><rect x="560" y="380" width="370" height="110" rx="6" class="note"/><text x="574" y="402" class="h2" text-anchor="start" >Why it helps</text><text x="574" y="422" class="handk" text-anchor="start" >no single vector has to hold the whole input;</text><text x="574" y="440" class="handk" text-anchor="start" >cost: Tx scores at each of Ty steps.</text><text x="574" y="458" class="handk" text-anchor="start" >Transformers keep this idea and drop the RNN.</text></svg>
