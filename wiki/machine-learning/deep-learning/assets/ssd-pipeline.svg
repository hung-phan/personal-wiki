<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="750" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >SSD: SINGLE SHOT DETECTOR</text><text x="30" y="62" class="h1" text-anchor="start" >A fixed grid of guesses, then a cleanup</text><line x1="30" y1="72" x2="615" y2="72" class="uline"/><path d="M70,100 L760,100" class="ln"/><text x="430" y="92" class="mut" text-anchor="start" >concatenate every head</text><rect x="27" y="116" width="86" height="50" rx="3" class="blu"/><text x="70" y="132" class="num" text-anchor="middle" >k=4 anchors</text><text x="70" y="147" class="num" text-anchor="middle" >3x3 conv -&gt;</text><text x="70" y="162" class="num" text-anchor="middle" >k*(4+21)</text><line x1="70" y1="116" x2="70" y2="102" class="ln" marker-end="url(#ar)"/><line x1="70" y1="198.0" x2="70" y2="170" class="lnd" marker-end="url(#ar)"/><rect x="36.0" y="198.0" width="68" height="84" rx="2" class="grn"/><text x="70" y="300" class="numb" text-anchor="middle" >38x38</text><text x="70" y="316" class="mut" text-anchor="middle" >sees ~7px</text><line x1="108.0" y1="240" x2="142.0" y2="240" class="ln" marker-end="url(#ar)"/><rect x="132" y="116" width="86" height="50" rx="3" class="blu"/><text x="175" y="132" class="num" text-anchor="middle" >k=6 anchors</text><text x="175" y="147" class="num" text-anchor="middle" >3x3 conv -&gt;</text><text x="175" y="162" class="num" text-anchor="middle" >k*(4+21)</text><line x1="175" y1="116" x2="175" y2="102" class="ln" marker-end="url(#ar)"/><line x1="175" y1="205.0" x2="175" y2="170" class="lnd" marker-end="url(#ar)"/><rect x="146.0" y="205.0" width="58" height="70" rx="2" class="grn"/><text x="175" y="300" class="numb" text-anchor="middle" >19x19</text><text x="175" y="316" class="mut" text-anchor="middle" >~15px</text><line x1="208.0" y1="240" x2="252.0" y2="240" class="ln" marker-end="url(#ar)"/><rect x="237" y="116" width="86" height="50" rx="3" class="blu"/><text x="280" y="132" class="num" text-anchor="middle" >k=6 anchors</text><text x="280" y="147" class="num" text-anchor="middle" >3x3 conv -&gt;</text><text x="280" y="162" class="num" text-anchor="middle" >k*(4+21)</text><line x1="280" y1="116" x2="280" y2="102" class="ln" marker-end="url(#ar)"/><line x1="280" y1="211.0" x2="280" y2="170" class="lnd" marker-end="url(#ar)"/><rect x="256.0" y="211.0" width="48" height="58" rx="2" class="grn"/><text x="280" y="300" class="numb" text-anchor="middle" >10x10</text><text x="280" y="316" class="mut" text-anchor="middle" >~30px</text><line x1="308.0" y1="240" x2="361.0" y2="240" class="ln" marker-end="url(#ar)"/><rect x="342" y="116" width="86" height="50" rx="3" class="blu"/><text x="385" y="132" class="num" text-anchor="middle" >k=6 anchors</text><text x="385" y="147" class="num" text-anchor="middle" >3x3 conv -&gt;</text><text x="385" y="162" class="num" text-anchor="middle" >k*(4+21)</text><line x1="385" y1="116" x2="385" y2="102" class="ln" marker-end="url(#ar)"/><line x1="385" y1="217.0" x2="385" y2="170" class="lnd" marker-end="url(#ar)"/><rect x="365.0" y="217.0" width="40" height="46" rx="2" class="grn"/><text x="385" y="300" class="numb" text-anchor="middle" >5x5</text><text x="385" y="316" class="mut" text-anchor="middle" >~60px</text><line x1="409.0" y1="240" x2="470.0" y2="240" class="ln" marker-end="url(#ar)"/><rect x="447" y="116" width="86" height="50" rx="3" class="blu"/><text x="490" y="132" class="num" text-anchor="middle" >k=4 anchors</text><text x="490" y="147" class="num" text-anchor="middle" >3x3 conv -&gt;</text><text x="490" y="162" class="num" text-anchor="middle" >k*(4+21)</text><line x1="490" y1="116" x2="490" y2="102" class="ln" marker-end="url(#ar)"/><line x1="490" y1="222.0" x2="490" y2="170" class="lnd" marker-end="url(#ar)"/><rect x="474.0" y="222.0" width="32" height="36" rx="2" class="grn"/><text x="490" y="300" class="numb" text-anchor="middle" >3x3</text><text x="490" y="316" class="mut" text-anchor="middle" >~100px</text><line x1="510.0" y1="240" x2="579.0" y2="240" class="ln" marker-end="url(#ar)"/><rect x="552" y="116" width="86" height="50" rx="3" class="blu"/><text x="595" y="132" class="num" text-anchor="middle" >k=4 anchors</text><text x="595" y="147" class="num" text-anchor="middle" >3x3 conv -&gt;</text><text x="595" y="162" class="num" text-anchor="middle" >k*(4+21)</text><line x1="595" y1="116" x2="595" y2="102" class="ln" marker-end="url(#ar)"/><line x1="595" y1="228.0" x2="595" y2="170" class="lnd" marker-end="url(#ar)"/><rect x="583.0" y="228.0" width="24" height="24" rx="2" class="grn"/><text x="595" y="300" class="numb" text-anchor="middle" >1x1</text><text x="595" y="316" class="mut" text-anchor="middle" >~300px</text><text x="125" y="186" class="mut" text-anchor="middle" >conv + pool</text><text x="655" y="150" class="numb" text-anchor="start" >8732 rows</text><text x="655" y="166" class="mut" text-anchor="start" >one per anchor</text><text x="655" y="192" class="mut" text-anchor="start" >each row:</text><text x="655" y="208" class="mut" text-anchor="start" >4 box offsets</text><text x="655" y="224" class="mut" text-anchor="start" >+ 21 class scores</text><text x="655" y="252" class="hand" text-anchor="start" >fixed size,</text><text x="655" y="270" class="hand" text-anchor="start" >always</text><path d="M760,100 L820,100 L820,130" class="ln" marker-end="url(#ar)"/><rect x="770" y="130" width="100" height="210" rx="4" class="pur"/><text x="820" y="152" class="num" text-anchor="middle" >38x38x4=5776</text><path d="M770,165 L870,165" class="lnd"/><text x="820" y="187" class="num" text-anchor="middle" >19x19x6=2166</text><path d="M770,200 L870,200" class="lnd"/><text x="820" y="222" class="num" text-anchor="middle" >10x10x6= 600</text><path d="M770,235 L870,235" class="lnd"/><text x="820" y="257" class="num" text-anchor="middle" >5x5x6  = 150</text><path d="M770,270 L870,270" class="lnd"/><text x="820" y="292" class="num" text-anchor="middle" >3x3x4  =  36</text><path d="M770,305 L870,305" class="lnd"/><text x="820" y="327" class="num" text-anchor="middle" >1x1x4  =   4</text><line x1="820" y1="340" x2="820" y2="404" class="ln" marker-end="url(#ar)"/><text x="810" y="370" class="hand" text-anchor="end" >variable length starts HERE, outside the net</text><rect x="745" y="404" width="150" height="30" rx="4" class="grey"/><text x="820" y="424" class="num" text-anchor="middle" >score &gt; threshold</text><line x1="820" y1="434" x2="820" y2="452" class="ln" marker-end="url(#ar)"/><rect x="745" y="452" width="150" height="46" rx="4" class="grey"/><text x="820" y="472" class="num" text-anchor="middle" >per-class NMS:</text><text x="820" y="490" class="num" text-anchor="middle" >IoU &gt; 0.5 dropped</text><line x1="820" y1="498" x2="820" y2="516" class="ln" marker-end="url(#ar)"/><rect x="720" y="516" width="200" height="120" rx="4" class="blu"/><text x="820" y="534" class="num" text-anchor="middle" >3 boxes survive</text><rect x="734" y="546" width="86" height="40" rx="2" class="cell"/><text x="777" y="570" class="num" text-anchor="middle" >dog 0.91</text><rect x="828" y="542" width="78" height="32" rx="2" class="cell"/><text x="867" y="562" class="num" text-anchor="middle" >car 0.88</text><rect x="760" y="592" width="110" height="34" rx="2" class="cell"/><text x="815" y="613" class="num" text-anchor="middle" >person 0.76</text><rect x="40" y="410" width="96" height="96" rx="2" class="cell"/><rect x="44.0" y="414.0" width="88" height="88" rx="2" class="pur"/><rect x="44.0" y="438.0" width="88" height="40" rx="2" class="blu"/><rect x="68.0" y="414.0" width="40" height="88" rx="2" class="grn"/><rect x="59.0" y="429.0" width="58" height="58" rx="2" class="yel"/><text x="88" y="522" class="num" text-anchor="middle" >k=4 (38x38 head)</text><rect x="180" y="410" width="96" height="96" rx="2" class="cell"/><rect x="184.0" y="414.0" width="88" height="88" rx="2" class="pur"/><rect x="184.0" y="436.0" width="88" height="44" rx="2" class="blu"/><rect x="206.0" y="414.0" width="44" height="88" rx="2" class="grn"/><rect x="184.0" y="445.0" width="88" height="26" rx="2" class="pnk"/><rect x="215.0" y="414.0" width="26" height="88" rx="2" class="grey"/><rect x="200.0" y="430.0" width="56" height="56" rx="2" class="yel"/><text x="228" y="522" class="num" text-anchor="middle" >k=6 (10x10 head)</text><path d="M88,410 L88,356 L70,356 L70,332" class="lnd" marker-end="url(#ar)"/><path d="M228,410 L228,356 L280,356 L280,332" class="lnd" marker-end="url(#ar)"/><text x="300" y="404" class="h2" text-anchor="start" >the k default boxes inside ONE cell</text><text x="300" y="428" class="mut" text-anchor="start" >4 shapes: small square, big square, tall, wide</text><text x="300" y="444" class="mut" text-anchor="start" >6 adds two more aspect ratios (1:3, 3:1)</text><text x="300" y="460" class="mut" text-anchor="start" >anchor shapes are FIXED; the head predicts</text><text x="300" y="476" class="mut" text-anchor="start" >only an offset (dx, dy, dw, dh) per anchor</text><text x="300" y="504" class="hand" text-anchor="start" >early/large maps carry SMALL objects,</text><text x="300" y="522" class="hand" text-anchor="start" >late/small maps carry the BIG ones</text><rect x="30" y="656" width="900" height="76" rx="6" class="note"/><text x="44" y="678" class="h2" text-anchor="start" >The one idea</text><text x="44" y="698" class="handk" text-anchor="start" >The network always emits the same fixed-size tensor, 8732 x (4 offsets + 21 scores). The variable number</text><text x="44" y="716" class="handk" text-anchor="start" >of objects is produced after it, by thresholding and NMS - and the map that fires tells you the object's size.</text></svg>
