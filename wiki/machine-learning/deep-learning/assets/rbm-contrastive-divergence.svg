<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >BOLTZMANN MACHINES</text><text x="30" y="62" class="h1" text-anchor="start" >Contrastive divergence: compare data with a dream</text><line x1="30" y1="72" x2="765" y2="72" class="uline"/><text x="40" y="104" class="h2" text-anchor="start" >1. the Gibbs chain (one user's row)</text><rect x="35" y="130" width="90" height="60" rx="8" class="yel"/><text x="80" y="166" class="h1" text-anchor="middle" >v⁰</text><text x="80" y="210" class="mut" text-anchor="middle" >the real ratings</text><rect x="175" y="130" width="90" height="60" rx="8" class="pur"/><text x="220" y="166" class="h1" text-anchor="middle" >h⁰</text><text x="220" y="210" class="mut" text-anchor="middle" >tastes it implies</text><rect x="315" y="130" width="90" height="60" rx="8" class="yel"/><text x="360" y="166" class="h1" text-anchor="middle" >v¹</text><text x="360" y="210" class="mut" text-anchor="middle" >reconstruction</text><rect x="455" y="130" width="90" height="60" rx="8" class="pur"/><text x="500" y="166" class="h1" text-anchor="middle" >h¹</text><text x="500" y="210" class="mut" text-anchor="middle" >tastes of that</text><line x1="125" y1="160" x2="175" y2="160" class="ln" marker-end="url(#ar)"/><text x="150.0" y="150" class="mut" text-anchor="middle" >sample h|v</text><line x1="265" y1="160" x2="315" y2="160" class="ln" marker-end="url(#ar)"/><text x="290.0" y="150" class="mut" text-anchor="middle" >sample v|h</text><line x1="405" y1="160" x2="455" y2="160" class="ln" marker-end="url(#ar)"/><text x="430.0" y="150" class="mut" text-anchor="middle" >sample h|v</text><text x="40" y="250" class="h2" text-anchor="start" >ΔW ∝  h⁰·v⁰ᵀ   −   h¹·v¹ᵀ</text><text x="40" y="272" class="mut" text-anchor="start" >first term from the data, second from the model's dream</text><text x="40" y="300" class="handk" text-anchor="start" >CD-1 = stop after one round trip. CD-k = k round trips.</text><text x="40" y="318" class="handk" text-anchor="start" >Unrated movies are clamped out of v at every step.</text><text x="600" y="104" class="h2" text-anchor="start" >2. what the update does to the energy</text><polyline points="600.0,215.0 605.5,213.2 611.0,211.5 616.5,209.8 622.0,208.4 627.5,207.2 633.0,206.5 638.5,206.7 644.0,208.0 649.5,210.8 655.0,215.6 660.5,222.1 666.0,229.7 671.5,237.1 677.0,242.8 682.5,245.7 688.0,245.1 693.5,241.5 699.0,236.2 704.5,230.6 710.0,225.9 715.5,222.7 721.0,221.0 726.5,220.7 732.0,221.3 737.5,222.2 743.0,223.4 748.5,224.5 754.0,225.5 759.5,226.2 765.0,226.7 770.5,227.0 776.0,227.0 781.5,226.7 787.0,226.3 792.5,226.0 798.0,226.3 803.5,228.2 809.0,233.1 814.5,242.1 820.0,255.2 825.5,270.2 831.0,282.7 836.5,287.8 842.0,283.0 847.5,269.5 853.0,251.6 858.5,234.2 864.0,220.6 869.5,211.7 875.0,206.8 880.5,204.3 886.0,203.4 891.5,203.2 897.0,203.4 902.5,203.9 908.0,204.7 913.5,205.8 919.0,207.0 924.5,208.5 930.0,210.1" class="ln" stroke-width="2"/><circle cx="682.5" cy="236.66312163734494" r="9" class="grn"/><text x="682.5" y="183.66312163734494" class="hand" text-anchor="middle" >real data</text><line x1="682.5" y1="189.66312163734494" x2="682.5" y2="223.66312163734494" class="lnr" marker-end="url(#arr)"/><text x="694.5" y="211.66312163734494" class="handk" text-anchor="start" >push energy DOWN</text><circle cx="837.6" cy="278.65344181879345" r="9" class="pnk"/><text x="837.6" y="317.65344181879345" class="hand" text-anchor="middle" >model's dream</text><line x1="807.6" y1="283.65344181879345" x2="807.6" y2="243.65344181879345" class="lnr" marker-end="url(#arr)"/><text x="799.6" y="257.65344181879345" class="handk" text-anchor="end" >push UP</text><text x="600" y="360" class="handk" text-anchor="start" >Repeat until the dream looks like the data —</text><text x="600" y="378" class="handk" text-anchor="start" >then the lowest valleys sit on real ratings.</text><rect x="30" y="400" width="900" height="144" rx="6" class="note"/><text x="44" y="422" class="h2" text-anchor="start" >Why not backprop?</text><text x="44" y="442" class="handk" text-anchor="start" >There's no target to compare against — the model must match a whole probability distribution.</text><text x="44" y="460" class="handk" text-anchor="start" >The exact gradient needs an average over every possible state (Z): impossible for 100+ units.</text><text x="44" y="478" class="handk" text-anchor="start" >CD estimates it with a short sampling chain started at the data. Cheap, biased, works well enough.</text><text x="44" y="496" class="handk" text-anchor="start" >Stack trained RBMs → a deep belief network (2006): the trick that first made deep nets trainable.</text></svg>
