<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 645" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="645" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >TRANSFER LEARNING</text><text x="30" y="62" class="h1" text-anchor="start" >Body plus head: what you chop, freeze and precompute</text><line x1="30" y1="72" x2="810" y2="72" class="uline"/><text x="30" y="104" class="h2" text-anchor="start" >A. surgery</text><rect x="45" y="120" width="120" height="24" rx="4" class="cell"/><text x="105" y="136" class="num" text-anchor="middle" >input image</text><line x1="105" y1="144" x2="105" y2="160" class="ln" marker-end="url(#ar)"/><rect x="45" y="160" width="120" height="22" rx="2" class="grey"/><text x="105" y="175" class="num" text-anchor="middle" >conv/pool 1</text><path d="M105,182 L105,186" class="ln"/><rect x="45" y="186" width="120" height="22" rx="2" class="grey"/><text x="105" y="201" class="num" text-anchor="middle" >conv/pool 2</text><path d="M105,208 L105,212" class="ln"/><rect x="45" y="212" width="120" height="22" rx="2" class="grey"/><text x="105" y="227" class="num" text-anchor="middle" >conv/pool 3</text><path d="M105,234 L105,238" class="ln"/><rect x="45" y="238" width="120" height="22" rx="2" class="grey"/><text x="105" y="253" class="num" text-anchor="middle" >conv/pool 4</text><path d="M105,260 L105,264" class="ln"/><rect x="45" y="264" width="120" height="22" rx="2" class="grey"/><text x="105" y="279" class="num" text-anchor="middle" >conv/pool 5</text><text x="175" y="208" class="mut" text-anchor="start" >pretrained on</text><text x="175" y="224" class="mut" text-anchor="start" >ImageNet;</text><text x="175" y="240" class="mut" text-anchor="start" >weights kept</text><path d="M105,286 L105,296 L285,296 L285,436 L167,436" class="ln" marker-end="url(#ar)"/><text x="175" y="290" class="mut" text-anchor="start" >features z</text><path d="M35,312 L275,312" class="lnd"/><text x="35" y="330" class="hand" text-anchor="start" >chop here: include_top=False</text><rect x="45" y="344" width="120" height="18" rx="2" class="grey"/><text x="105" y="357" class="num" text-anchor="middle" >Dense 4096</text><rect x="45" y="366" width="120" height="18" rx="2" class="grey"/><text x="105" y="379" class="num" text-anchor="middle" >Dense 4096</text><rect x="45" y="388" width="120" height="18" rx="2" class="grey"/><text x="105" y="401" class="num" text-anchor="middle" >Dense 1000</text><path d="M45,344 L165,406" class="lnr"/><path d="M165,344 L45,406" class="lnr"/><text x="175" y="360" class="mut" text-anchor="start" >ImageNet head:</text><text x="175" y="376" class="mut" text-anchor="start" >1000 classes -</text><text x="175" y="392" class="mut" text-anchor="start" >useless to you</text><rect x="45" y="414" width="120" height="44" rx="4" class="grn"/><text x="105" y="434" class="num" text-anchor="middle" >your head</text><text x="105" y="450" class="num" text-anchor="middle" >Dense(K, softmax)</text><text x="30" y="480" class="mut" text-anchor="start" >a network = feature transformer</text><text x="30" y="496" class="mut" text-anchor="start" >+ a linear model</text><text x="300" y="104" class="h2" text-anchor="start" >B. two modes</text><text x="300" y="140" class="numb" text-anchor="start" >1. feature extractor (body FROZEN)</text><rect x="305" y="152" width="32" height="34" rx="2" class="grey"/><text x="321" y="173" class="num" text-anchor="middle" >b1</text><rect x="341" y="152" width="32" height="34" rx="2" class="grey"/><text x="357" y="173" class="num" text-anchor="middle" >b2</text><rect x="377" y="152" width="32" height="34" rx="2" class="grey"/><text x="393" y="173" class="num" text-anchor="middle" >b3</text><line x1="411" y1="169" x2="423" y2="169" class="ln" marker-end="url(#ar)"/><rect x="425" y="152" width="56" height="34" rx="4" class="grn"/><text x="453" y="173" class="num" text-anchor="middle" >head</text><line x1="483" y1="169" x2="495" y2="169" class="ln" marker-end="url(#ar)"/><rect x="497" y="152" width="56" height="34" rx="4" class="pnk"/><text x="525" y="173" class="num" text-anchor="middle" >loss</text><rect x="305" y="190" width="104" height="16" rx="2" class="yel"/><text x="357" y="202" class="num" text-anchor="middle" >FROZEN</text><path d="M525,186 L525,218 L459,218" class="lnr" marker-end="url(#arr)"/><path d="M451,208 L451,228" class="lnr"/><text x="305" y="240" class="hand" text-anchor="start" >gradients stop here</text><text x="300" y="260" class="mut" text-anchor="start" >seconds to train; safe on small data</text><text x="300" y="300" class="numb" text-anchor="start" >2. fine-tune (body TRAINABLE)</text><rect x="305" y="312" width="32" height="34" rx="2" class="grey"/><text x="321" y="333" class="num" text-anchor="middle" >b1</text><rect x="341" y="312" width="32" height="34" rx="2" class="grey"/><text x="357" y="333" class="num" text-anchor="middle" >b2</text><rect x="377" y="312" width="32" height="34" rx="2" class="grey"/><text x="393" y="333" class="num" text-anchor="middle" >b3</text><line x1="411" y1="329" x2="423" y2="329" class="ln" marker-end="url(#ar)"/><rect x="425" y="312" width="56" height="34" rx="4" class="grn"/><text x="453" y="333" class="num" text-anchor="middle" >head</text><line x1="483" y1="329" x2="495" y2="329" class="ln" marker-end="url(#ar)"/><rect x="497" y="312" width="56" height="34" rx="4" class="pnk"/><text x="525" y="333" class="num" text-anchor="middle" >loss</text><rect x="305" y="350" width="104" height="16" rx="2" class="grn"/><text x="357" y="362" class="num" text-anchor="middle" >TRAINABLE</text><path d="M525,346 L525,378 L309,378 L309,368" class="lnr" marker-end="url(#arr)"/><text x="305" y="400" class="hand" text-anchor="start" >gradients reach the body</text><text x="300" y="420" class="mut" text-anchor="start" >better ceiling; low LR, top blocks only</text><text x="600" y="104" class="h2" text-anchor="start" >C. two pipelines</text><rect x="600" y="130" width="330" height="185" rx="6" class="cell"/><text x="614" y="152" class="h2" text-anchor="start" >augment in the loop</text><rect x="660" y="166" width="190" height="22" rx="3" class="blu"/><text x="755" y="181" class="num" text-anchor="middle" >images (batch)</text><line x1="755" y1="188" x2="755" y2="192" class="ln" marker-end="url(#ar)"/><rect x="660" y="192" width="190" height="22" rx="3" class="blu"/><text x="755" y="207" class="num" text-anchor="middle" >random flip / zoom</text><line x1="755" y1="214" x2="755" y2="218" class="ln" marker-end="url(#ar)"/><rect x="660" y="218" width="190" height="22" rx="3" class="blu"/><text x="755" y="233" class="num" text-anchor="middle" >frozen body -&gt; z</text><line x1="755" y1="240" x2="755" y2="244" class="ln" marker-end="url(#ar)"/><rect x="660" y="244" width="190" height="22" rx="3" class="blu"/><text x="755" y="259" class="num" text-anchor="middle" >head -&gt; loss</text><path d="M655,255 L625,255 L625,177 L655,177" class="lnr" marker-end="url(#arr)"/><text x="614" y="286" class="mut" text-anchor="start" >the cycle runs every batch, every epoch</text><text x="614" y="302" class="mut" text-anchor="start" >slow: body re-run each epoch; augmentation works</text><rect x="600" y="335" width="330" height="200" rx="6" class="cell"/><text x="614" y="357" class="h2" text-anchor="start" >precompute Z</text><text x="614" y="375" class="mut" text-anchor="start" >once, up front:</text><rect x="614" y="382" width="96" height="24" rx="3" class="grey"/><text x="662" y="398" class="num" text-anchor="middle" >all images</text><line x1="712" y1="394" x2="726" y2="394" class="ln" marker-end="url(#ar)"/><rect x="728" y="382" width="96" height="24" rx="3" class="grey"/><text x="776" y="398" class="num" text-anchor="middle" >frozen body</text><line x1="826" y1="394" x2="840" y2="394" class="ln" marker-end="url(#ar)"/><rect x="846" y="382" width="60" height="78" rx="3" class="blu"/><path d="M846,401 L906,401" class="lnd"/><path d="M846,420 L906,420" class="lnd"/><path d="M846,439 L906,439" class="lnd"/><text x="876" y="474" class="num" text-anchor="middle" >Z: N x D</text><text x="614" y="420" class="mut" text-anchor="start" >body never touched again</text><text x="614" y="436" class="mut" text-anchor="start" >(fast), one pass only</text><rect x="614" y="470" width="96" height="24" rx="3" class="grn"/><text x="662" y="486" class="num" text-anchor="middle" >Z (fixed)</text><line x1="712" y1="482" x2="726" y2="482" class="ln" marker-end="url(#ar)"/><rect x="728" y="470" width="96" height="24" rx="3" class="grn"/><text x="776" y="486" class="num" text-anchor="middle" >logistic reg</text><path d="M824,494 L832,494 L832,510 L618,510 L618,496" class="lnr" marker-end="url(#arr)"/><text x="614" y="526" class="mut" text-anchor="start" >cycle touches only Z: no images to augment</text><rect x="30" y="552" width="900" height="76" rx="6" class="note"/><text x="44" y="574" class="h2" text-anchor="start" >The one idea</text><text x="44" y="594" class="handk" text-anchor="start" >Freezing is a choice about GRADIENTS; precomputing Z is a choice about COMPUTE - two independent knobs.</text><text x="44" y="612" class="handk" text-anchor="start" >Augmentation is what forces the body to stay inside the loop, which is why the fast path has to give it up.</text></svg>
