<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="604" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >FORWARD PASS</text><text x="30" y="62" class="h1" text-anchor="start" >Many little sums are one matrix multiply</text><line x1="30" y1="72" x2="630" y2="72" class="uline"/><text x="30" y="116" class="h2" text-anchor="start" >what the picture says</text><circle cx="110" cy="170" r="19" class="blu"/><text x="110" y="175" class="num" text-anchor="middle" >i1</text><circle cx="110" cy="234" r="19" class="blu"/><text x="110" y="239" class="num" text-anchor="middle" >i2</text><circle cx="110" cy="298" r="19" class="blu"/><text x="110" y="303" class="num" text-anchor="middle" >i3</text><circle cx="300" cy="170" r="19" class="grn"/><text x="300" y="175" class="num" text-anchor="middle" >h1</text><circle cx="300" cy="234" r="19" class="grn"/><text x="300" y="239" class="num" text-anchor="middle" >h2</text><circle cx="300" cy="298" r="19" class="grn"/><text x="300" y="303" class="num" text-anchor="middle" >h3</text><path d="M129,170 L281,170" class="lnd"/><path d="M129,170 L281,234" class="lnd"/><path d="M129,170 L281,298" class="lnd"/><path d="M129,234 L281,170" class="lnd"/><path d="M129,234 L281,234" class="lnd"/><path d="M129,234 L281,298" class="lnd"/><path d="M129,298 L281,170" class="lnd"/><path d="M129,298 L281,234" class="lnd"/><path d="M129,298 L281,298" class="lnd"/><text x="205" y="142" class="mut" text-anchor="middle" >w(j,i)</text><text x="36" y="346" class="mut" text-anchor="start" >each node sums what arrives,</text><text x="36" y="362" class="mut" text-anchor="start" >then squashes it</text><text x="400" y="116" class="h2" text-anchor="start" >what that means, written out</text><text x="406" y="152" class="num" text-anchor="start" >net(1) = w(1,1) i1 + w(1,2) i2 + w(1,3) i3</text><text x="406" y="174" class="num" text-anchor="start" >net(2) = w(2,1) i1 + w(2,2) i2 + w(2,3) i3</text><text x="406" y="196" class="num" text-anchor="start" >net(3) = w(3,1) i1 + w(3,2) i2 + w(3,3) i3</text><text x="406" y="240" class="hand" text-anchor="start" >the i's repeat down the rows, the w's across</text><path d="M620,254 L620,280" class="lnr" marker-end="url(#arr)"/><rect x="406" y="290" width="430" height="76" rx="6" class="grey"/><text x="621" y="322" class="h1" text-anchor="middle" >X = W . I</text><text x="621" y="350" class="num" text-anchor="middle" >O = sigmoid(X)</text><path d="M30,390 L930,390" class="lnd"/><text x="30" y="418" class="h2" text-anchor="start" >and the shape is forced</text><rect x="36" y="438" width="70" height="54" rx="4" class="yel"/><text x="71" y="462" class="numb" text-anchor="middle" >W</text><text x="71" y="480" class="num" text-anchor="middle" >3 x 3</text><text x="116" y="470" class="ink" text-anchor="middle" >.</text><rect x="126" y="438" width="40" height="54" rx="4" class="blu"/><text x="146" y="462" class="numb" text-anchor="middle" >I</text><text x="146" y="480" class="num" text-anchor="middle" >3 x 1</text><text x="176" y="470" class="ink" text-anchor="middle" >=</text><rect x="186" y="438" width="40" height="54" rx="4" class="grn"/><text x="206" y="462" class="numb" text-anchor="middle" >X</text><text x="206" y="480" class="num" text-anchor="middle" >3 x 1</text><text x="256" y="456" class="num" text-anchor="start" >the sum runs over THIS layer, so this layer must be the</text><text x="256" y="476" class="num" text-anchor="start" >index that cancels - W is (next layer x this layer).</text><rect x="30" y="508" width="900" height="80" rx="6" class="note"/><text x="44" y="530" class="h2" text-anchor="start" >The one idea</text><text x="44" y="550" class="handk" text-anchor="start" >The matrix form is not a different algorithm - it is the same per-node sums, stacked.</text><text x="44" y="568" class="handk" text-anchor="start" >Write it once as W.I and the code stops caring whether the layer has 3 nodes or 3,000.</text></svg>
