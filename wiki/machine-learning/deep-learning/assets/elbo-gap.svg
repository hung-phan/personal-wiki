<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 586" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="586" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >THE ELBO</text><text x="30" y="62" class="h1" text-anchor="start" >A computable bound, and the gap you never see</text><line x1="30" y1="72" x2="705" y2="72" class="uline"/><line x1="120" y1="410" x2="120" y2="120" class="ln" marker-end="url(#ar)"/><text x="130" y="104" class="mut" text-anchor="start" >log-likelihood scale (higher = better fit)</text><path d="M120,410 L860,410" class="ln"/><path d="M120,140 L700,140" class="lnd"/><text x="130" y="132" class="numb" text-anchor="start" >log p(x)   (fixed: does not depend on q)</text><rect x="210" y="142" width="300" height="108" rx="4" class="note"/><text x="360" y="176" class="hand" text-anchor="middle" >the gap must shrink</text><line x1="250" y1="186" x2="250" y2="242" class="lnr" marker-end="url(#arr)"/><path d="M520,142 L534,142 L534,248 L520,248" class="ln"/><text x="546" y="182" class="numb" text-anchor="start" >KL(q(z|x) || p(z|x)) &gt;= 0</text><text x="546" y="200" class="mut" text-anchor="start" >(not computable: needs p(z|x))</text><text x="546" y="224" class="hand" text-anchor="start" >-&gt; q approximates the true posterior</text><rect x="210" y="250" width="300" height="160" rx="4" class="pur"/><text x="360" y="290" class="numb" text-anchor="middle" >ELBO = E_q[log p(x|z)]</text><text x="360" y="308" class="numb" text-anchor="middle" >- KL(q(z|x) || p(z))</text><text x="360" y="334" class="mut" text-anchor="middle" >computable - this is the loss we code</text><line x1="250" y1="394" x2="250" y2="352" class="lnr" marker-end="url(#arr)"/><text x="360" y="372" class="hand" text-anchor="middle" >training raises the ELBO</text><text x="120" y="460" class="numb" text-anchor="start" >log p(x) = ELBO + KL   ==&gt;   log p(x) &gt;= ELBO, hence 'evidence lower bound'</text><rect x="30" y="486" width="900" height="76" rx="6" class="note"/><text x="44" y="508" class="h2" text-anchor="start" >The one idea</text><text x="44" y="528" class="handk" text-anchor="start" >log p(x) does not move when q moves, so every nat the ELBO gains is a nat the KL gap loses.</text><text x="44" y="546" class="handk" text-anchor="start" >Maximising a bound you can compute is the same act as fitting the posterior you cannot compute.</text></svg>
