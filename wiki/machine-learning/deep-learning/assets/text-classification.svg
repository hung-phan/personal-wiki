<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="490" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >TEXT CLASSIFICATION</text><text x="30" y="62" class="h1" text-anchor="start" >Ids, vectors, a CNN or RNN body, one sigmoid per label</text><line x1="30" y1="72" x2="840" y2="72" class="uline"/><rect x="30" y="104" width="166" height="60" rx="6" class="cell"/><text x="113" y="128" class="h2" text-anchor="middle" >text</text><text x="113" y="148" class="mut" text-anchor="middle" >"you are an idiot"</text><line x1="196" y1="134" x2="216" y2="134" class="ln" marker-end="url(#ar)"/><rect x="216" y="104" width="166" height="60" rx="6" class="grey"/><text x="299" y="128" class="h2" text-anchor="middle" >ids</text><text x="299" y="148" class="mut" text-anchor="middle" >[12, 5, 33, 871, 0, 0]</text><line x1="382" y1="134" x2="402" y2="134" class="ln" marker-end="url(#ar)"/><rect x="402" y="104" width="166" height="60" rx="6" class="yel"/><text x="485" y="128" class="h2" text-anchor="middle" >embeddings</text><text x="485" y="148" class="mut" text-anchor="middle" >T x D (lookup rows of V x D)</text><line x1="568" y1="134" x2="588" y2="134" class="ln" marker-end="url(#ar)"/><rect x="588" y="104" width="166" height="60" rx="6" class="blu"/><text x="671" y="128" class="h2" text-anchor="middle" >body</text><text x="671" y="148" class="mut" text-anchor="middle" >Conv1D or (Bi)LSTM</text><line x1="754" y1="134" x2="774" y2="134" class="ln" marker-end="url(#ar)"/><rect x="774" y="104" width="166" height="60" rx="6" class="grn"/><text x="857" y="128" class="h2" text-anchor="middle" >global max pool</text><text x="857" y="148" class="mut" text-anchor="middle" >strongest signal over time</text><rect x="60" y="214" width="120" height="44" rx="4" class="pnk"/><text x="120" y="234" class="numb" text-anchor="middle" >toxic</text><text x="120" y="250" class="mut" text-anchor="middle" >sigmoid: p(yes)</text><rect x="205" y="214" width="120" height="44" rx="4" class="pnk"/><text x="265" y="234" class="numb" text-anchor="middle" >severe</text><text x="265" y="250" class="mut" text-anchor="middle" >sigmoid: p(yes)</text><rect x="350" y="214" width="120" height="44" rx="4" class="pnk"/><text x="410" y="234" class="numb" text-anchor="middle" >obscene</text><text x="410" y="250" class="mut" text-anchor="middle" >sigmoid: p(yes)</text><rect x="495" y="214" width="120" height="44" rx="4" class="pnk"/><text x="555" y="234" class="numb" text-anchor="middle" >threat</text><text x="555" y="250" class="mut" text-anchor="middle" >sigmoid: p(yes)</text><rect x="640" y="214" width="120" height="44" rx="4" class="pnk"/><text x="700" y="234" class="numb" text-anchor="middle" >insult</text><text x="700" y="250" class="mut" text-anchor="middle" >sigmoid: p(yes)</text><rect x="785" y="214" width="120" height="44" rx="4" class="pnk"/><text x="845" y="234" class="numb" text-anchor="middle" >identity</text><text x="845" y="250" class="mut" text-anchor="middle" >sigmoid: p(yes)</text><path d="M837,164 L837,190 L120,190 L120,212" class="ln" marker-end="url(#ar)"/><text x="480" y="186" class="mut" text-anchor="middle" >6 independent yes/no outputs (a comment can be several things at once)</text><text x="40" y="296" class="mut" text-anchor="start" >padding: 0 = no word; ids start at 1</text><rect x="40" y="316" width="430" height="150" rx="6" class="note"/><text x="54" y="338" class="h2" text-anchor="start" >Loss and score</text><text x="54" y="358" class="handk" text-anchor="start" >loss = mean binary cross-entropy over the 6 labels</text><text x="54" y="376" class="handk" text-anchor="start" >(softmax would force exactly one label)</text><text x="54" y="394" class="handk" text-anchor="start" ></text><text x="54" y="412" class="handk" text-anchor="start" >score = AUC per label, then average:</text><text x="54" y="430" class="handk" text-anchor="start" >accuracy is ~90% for 'always clean'</text><text x="500" y="326" class="h2" text-anchor="start" >task shapes (input T x D)</text><text x="500" y="344" class="numb" text-anchor="start" >many-to-one</text><text x="700" y="344" class="mut" text-anchor="start" >sentiment, spam, toxicity</text><text x="930" y="344" class="num" text-anchor="end" >T x D to K</text><text x="500" y="374" class="numb" text-anchor="start" >many-to-many, same T</text><text x="700" y="374" class="mut" text-anchor="start" >part-of-speech tags</text><text x="930" y="374" class="num" text-anchor="end" >T x D to T x K</text><text x="500" y="404" class="numb" text-anchor="start" >many-to-many, different T</text><text x="700" y="404" class="mut" text-anchor="start" >translation (seq2seq)</text><text x="930" y="404" class="num" text-anchor="end" >Tx x D to Ty x K</text><text x="500" y="434" class="numb" text-anchor="start" >one-to-many</text><text x="700" y="434" class="mut" text-anchor="start" >text / poetry generation</text><text x="930" y="434" class="num" text-anchor="end" >1 to T x K</text></svg>
