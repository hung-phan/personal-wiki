<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >ANN · PART 1</text><text x="30" y="62" class="h1" text-anchor="start" >How a network learns: guess, measure, nudge</text><line x1="30" y1="72" x2="675" y2="72" class="uline"/><text x="40" y="100" class="h2" text-anchor="start" >1. one training step</text><rect x="40" y="118" width="300" height="48" rx="8" class="cell"/><text x="56" y="140" class="h2" text-anchor="start" >forward</text><text x="56" y="158" class="mut" text-anchor="start" >rows → prediction ŷ</text><rect x="40" y="183" width="300" height="48" rx="8" class="cell"/><text x="56" y="205" class="h2" text-anchor="start" >loss</text><text x="56" y="223" class="mut" text-anchor="start" >how wrong? e.g. cross-entropy</text><rect x="40" y="248" width="300" height="48" rx="8" class="cell"/><text x="56" y="270" class="h2" text-anchor="start" >backward</text><text x="56" y="288" class="mut" text-anchor="start" >backprop: blame per weight</text><rect x="40" y="313" width="300" height="48" rx="8" class="cell"/><text x="56" y="335" class="h2" text-anchor="start" >update</text><text x="56" y="353" class="mut" text-anchor="start" >w ← w − lr · gradient</text><line x1="190" y1="168" x2="190" y2="182" class="ln" marker-end="url(#ar)"/><line x1="190" y1="233" x2="190" y2="247" class="ln" marker-end="url(#ar)"/><line x1="190" y1="298" x2="190" y2="312" class="ln" marker-end="url(#ar)"/><path d="M342,335 C 400,335 400,140 342,140" class="lnr" marker-end="url(#arr)"/><text x="404" y="240" class="hand" text-anchor="start" >repeat</text><text x="470" y="100" class="h2" text-anchor="start" >2. step size (learning rate) on a 1-D cost bowl</text><polyline points="530,186.6 535,196.7 540,206.4 545,215.8 550,225.0 555,233.8 560,242.4 565,250.6 570,258.6 575,266.2 580,273.6 585,280.6 590,287.4 595,293.9 600,300.0 605,305.9 610,311.4 615,316.6 620,321.6 625,326.2 630,330.6 635,334.6 640,338.4 645,341.9 650,345.0 655,347.9 660,350.4 665,352.6 670,354.6 675,356.2 680,357.6 685,358.6 690,359.4 695,359.9 700,360.0 705,359.9 710,359.4 715,358.6 720,357.6 725,356.2 730,354.6 735,352.6 740,350.4 745,347.9 750,345.0 755,341.9 760,338.4 765,334.6 770,330.6 775,326.2 780,321.6 785,316.6 790,311.4 795,305.9 800,300.0 805,293.9 810,287.4 815,280.6 820,273.6 825,266.2 830,258.6 835,250.6 840,242.4 845,233.8 850,225.0 855,215.8 860,206.4 865,196.7 870,186.6" class="ln" stroke-width="2"/><path d="M550,225 Q558,195 565,251" class="lnd" marker-end="url(#ar)"/><path d="M565,251 Q572,221 578,271" class="lnd" marker-end="url(#ar)"/><path d="M578,271 Q584,241 590,287" class="lnd" marker-end="url(#ar)"/><circle cx="550" cy="225.0" r="5" class="pur"/><circle cx="565" cy="250.64999999999998" r="5" class="pur"/><circle cx="578" cy="270.696" r="5" class="pur"/><circle cx="590" cy="287.4" r="5" class="pur"/><circle cx="478" cy="116" r="5" class="pur"/><text x="488" y="120" class="mut" text-anchor="start" >too small: crawls</text><path d="M550,225 Q605,195 660,350" class="lnd" marker-end="url(#ar)"/><path d="M660,350 Q676,320 692,360" class="lnd" marker-end="url(#ar)"/><path d="M692,360 Q696,330 699,360" class="lnd" marker-end="url(#ar)"/><circle cx="550" cy="225.0" r="5" class="grn"/><circle cx="660" cy="350.4" r="5" class="grn"/><circle cx="692" cy="359.616" r="5" class="grn"/><circle cx="699" cy="359.994" r="5" class="grn"/><circle cx="478" cy="136" r="5" class="grn"/><text x="488" y="140" class="mut" text-anchor="start" >good: settles at the bottom</text><path d="M550,225 Q705,176 860,206" class="lnd" marker-end="url(#ar)"/><path d="M860,206 Q698,167 535,197" class="lnd" marker-end="url(#ar)"/><path d="M535,197 Q702,161 868,191" class="lnd" marker-end="url(#ar)"/><circle cx="550" cy="225.0" r="5" class="pnk"/><circle cx="860" cy="206.4" r="5" class="pnk"/><circle cx="535" cy="196.65" r="5" class="pnk"/><circle cx="868" cy="190.656" r="5" class="pnk"/><circle cx="478" cy="156" r="5" class="pnk"/><text x="