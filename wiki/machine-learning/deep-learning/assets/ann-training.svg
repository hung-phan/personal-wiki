"493" x2="391" y2="523" class="lnr"/><rect x="392" y="496" width="20" height="24" rx="2" class="blu"/><line x1="413" y1="493" x2="413" y2="523" class="lnr"/><rect x="414" y="496" width="20" height="24" rx="2" class="yel"/><line x1="435" y1="493" x2="435" y2="523" class="lnr"/><rect x="436" y="496" width="20" height="24" rx="2" class="blu"/><line x1="457" y1="493" x2="457" y2="523" class="lnr"/><rect x="458" y="496" width="20" height="24" rx="2" class="yel"/><line x1="479" y1="493" x2="479" y2="523" class="lnr"/><rect x="480" y="496" width="20" height="24" rx="2" class="blu"/><line x1="501" y1="493" x2="501" y2="523" class="lnr"/><text x="520" y="432" class="hand" text-anchor="start" >red tick = one weight update</text><text x="520" y="452" class="handk" text-anchor="start" >batch: 1 smooth step per pass</text><text x="520" y="472" class="handk" text-anchor="start" >stochastic: 1 noisy step per row</text><text x="520" y="492" class="handk" text-anchor="start" >mini-batch (32–256): the usual compromise —</text><text x="520" y="512" class="handk" text-anchor="start" >GPU-friendly, still many steps per pass</text></svg>
