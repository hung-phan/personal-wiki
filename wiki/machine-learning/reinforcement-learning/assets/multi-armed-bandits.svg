,312.5 740.0,316.2 744.0,319.6 748.0,322.6 752.0,325.2 756.0,327.6 760.0,329.6 764.0,331.4 768.0,332.9 772.0,334.2 776.0,335.2 780.0,336.1 784.0,336.9 788.0,337.5 792.0,338.0 796.0,338.4 800.0,338.8 804.0,339.1 808.0,339.3 812.0,339.4 816.0,339.6 820.0,339.7 824.0,339.8 828.0,339.8 832.0,339.9 836.0,339.9 840.0,339.9 844.0,339.9 848.0,340.0 852.0,340.0 856.0,340.0 860.0,340.0 864.0,340.0 868.0,340.0 872.0,340.0 876.0,340.0 880.0,340.0 884.0,340.0 888.0,340.0 892.0,340.0 896.0,340.0 900.0,340.0 904.0,340.0 908.0,340.0 912.0,340.0 916.0,340.0" class="ln" fill="none"/><polyline points="524.0,336.3 528.0,332.9 532.0,329.6 536.0,326.6 540.0,323.8 544.0,321.1 548.0,318.6 552.0,316.4 556.0,314.2 560.0,312.3 564.0,310.4 568.0,308.8 572.0,307.3 576.0,305.9 580.0,304.6 584.0,303.5 588.0,302.5 592.0,301.6 596.0,300.8 600.0,300.1 604.0,299.5 608.0,299.0 612.0,298.6 616.0,298.3 620.0,298.1 624.0,297.9 628.0,297.8 632.0,297.8 636.0,297.9 640.0,298.0 644.0,298.1 648.0,298.3 652.0,298.6 656.0,298.9 660.0,299.3 664.0,299.7 668.0,300.1 672.0,300.6 676.0,301.1 680.0,301.7 684.0,302.2 688.0,302.8 692.0,303.4 696.0,304.1 700.0,304.7 704.0,305.4 708.0,306.1 712.0,306.8 716.0,307.5 720.0,308.2 724.0,309.0 728.0,309.7 732.0,310.4 736.0,311.2 740.0,311.9 744.0,312.7 748.0,313.4 752.0,314.2 756.0,314.9 760.0,315.6 764.0,316.4 768.0,317.1 772.0,317.8 776.0,318.5 780.0,319.2 784.0,319.9 788.0,320.6 792.0,321.3 796.0,322.0 800.0,322.6 804.0,323.3 808.0,323.9 812.0,324.5 816.0,325.1 820.0,325.7 824.0,326.3 828.0,326.9 832.0,327.4 836.0,328.0 840.0,328.5 844.0,329.0 848.0,329.5 852.0,330.0 856.0,330.5 860.0,330.9 864.0,331.4 868.0,331.8 872.0,332.2 876.0,332.6 880.0,333.0 884.0,333.4 888.0,333.7 892.0,334.1 896.0,334.4 900.0,334.7 904.0,335.0 908.0,335.3 912.0,335.6 916.0,335.9" class="lnd" fill="none"/><path d="M520,340 L920,340" class="ln"/><text x="720" y="360" class="mut" text-anchor="middle" >click rate</text><text x="800" y="300" class="hand" text-anchor="start" >few shows: wide (dashed)</text><text x="700" y="222" class="mut" text-anchor="start" >more shows: narrower</text><text x="500" y="404" class="num" text-anchor="start" >posterior: Beta(clicks + 1, misses + 1); sample one value per ad,</text><text x="500" y="422" class="num" text-anchor="start" >show the ad with the highest sample, update its counts</text><rect x="40" y="444" width="890" height="100" rx="6" class="note"/><text x="54" y="466" class="h2" text-anchor="start" >Explore vs exploit</text><text x="54" y="486" class="handk" text-anchor="start" >Every round spent on a bad ad costs a click (regret); never trying alternatives risks missing the best one.</text><text x="54" y="504" class="handk" text-anchor="start" >UCB is deterministic and must update every round; Thompson is random, handles delayed or batched feedback,</text><text x="54" y="522" class="handk" text-anchor="start" >and usually earns more. A/B testing explores all the way, then exploits.</text></svg>
