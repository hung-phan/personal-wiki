<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 632" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="632" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >EVOLUTION STRATEGIES</text><text x="30" y="62" class="h1" text-anchor="start" >A reward-weighted average of random parameter nudges</text><line x1="30" y1="72" x2="810" y2="72" class="uline"/><text x="30" y="104" class="h2" text-anchor="start" >1. One generation in parameter space</text><text x="30" y="128" class="mut" text-anchor="start" >dashed arcs: contours of expected return F(theta)</text><path d="M345,170 A55,55 0 0,0 400,225" class="lnd"/><path d="M290,170 A110,110 0 0,0 400,280" class="lnd"/><path d="M235,170 A165,165 0 0,0 400,335" class="lnd"/><path d="M180,170 A220,220 0 0,0 400,390" class="lnd"/><text x="412" y="152" class="hand" text-anchor="start" >higher -&gt;</text><path d="M231,287 a52,52 0 1,0 104,0 a52,52 0 1,0 -104,0" class="lnd"/><path d="M283,287 L331,307" class="lnd"/><circle cx="331" cy="307" r="4" class="blu"/><path d="M283,287 L303,335" class="lnd"/><circle cx="303" cy="335" r="4" class="blu"/><path d="M283,287 L263,335" class="lnd"/><circle cx="263" cy="335" r="4" class="blu"/><path d="M283,287 L235,307" class="lnd"/><circle cx="235" cy="307" r="4" class="blu"/><path d="M283,287 L235,267" class="lnd"/><circle cx="235" cy="267" r="4" class="blu"/><path d="M283,287 L263,239" class="lnd"/><circle cx="263" cy="239" r="4" class="blu"/><path d="M283,287 L303,239" class="lnd"/><circle cx="303" cy="239" r="4" class="blu"/><path d="M283,287 L331,267" class="lnd"/><circle cx="331" cy="267" r="4" class="blu"/><rect x="298.6146745892072" y="202.08963739909706" width="30" height="14" rx="0" class="bg"/><text x="314" y="213" class="numb" text-anchor="middle" >+1.1</text><rect x="345.27406610312545" y="255.29447639179836" width="30" height="14" rx="0" class="bg"/><text x="360" y="266" class="numb" text-anchor="middle" >+1.4</text><rect x="345.27406610312545" y="296.70552360820164" width="30" height="14" rx="0" class="bg"/><text x="360" y="308" class="numb" text-anchor="middle" >+0.9</text><rect x="237.38532541079283" y="349.91036260090294" width="30" height="14" rx="0" class="bg"/><text x="252" y="361" class="numb" text-anchor="middle" >-1.2</text><rect x="194.08963739909706" y="306.6146745892072" width="30" height="14" rx="0" class="bg"/><text x="209" y="318" class="numb" text-anchor="middle" >-0.8</text><rect x="194.08963739909706" y="245.3853254107928" width="30" height="14" rx="0" class="bg"/><text x="209" y="256" class="numb" text-anchor="middle" >-1.0</text><rect x="280.67614204812793" y="357.30139886099323" width="72" height="14" rx="0" class="bg"/><text x="317" y="368" class="mut" text-anchor="middle" >sigma*eps_i</text><rect x="213.32385795187213" y="194.69860113900677" width="72" height="14" rx="0" class="bg"/><text x="249" y="206" class="mut" text-anchor="middle" >sigma*eps_i</text><circle cx="283" cy="287" r="7" class="grn"/><path d="M223,287 L184,287" class="lnd"/><rect x="130" y="276" width="56" height="16" rx="0" class="bg"/><text x="182" y="291" class="handk" text-anchor="end" >theta_t</text><path d="M291,287 L333,287" class="lnr"/><rect x="336" y="278" width="44" height="16" rx="0" class="bg"/><text x="340" y="291" class="hand" text-anchor="start" >sigma</text><line x1="283" y1="287" x2="389" y2="181" class="hi" marker-end="url(#arr)"/><text x="396" y="174" class="hand" text-anchor="start" >update step</text><text x="30" y="412" class="mut" text-anchor="start" >numbers: standardised return A_i = (F_i - mean F) / std F</text><text x="30" y="430" class="mut" text-anchor="start" >each thin vector is one offspring at theta_t + sigma * eps_i</text><rect x="30" y="448" width="490" height="58" rx="6" class="yel"/><text x="275" y="472" class="numb" text-anchor="middle" >theta_(t+1) = theta_t + (eta / (N sigma)) * sum_i A_i eps_i</text><text x="275" y="492" class="mut" text-anchor="middle" >positive A_i pulls toward that offspring, negative pushes away</text><text x="545" y="104" class="h2" text-anchor="start" >2. Why it parallelises</text><rect x="560" y="118" width="330" height="40" rx="6" class="pur"/><text x="725" y="143" class="num" text-anchor="middle" >theta_t (identical on every worker)</text><text x="725" y="176" class="mut" text-anchor="middle" >broadcast seed_i</text><path d="M560,158 L560,380" class="ln"/><rect x="600" y="196" width="270" height="44" rx="6" class="blu"/><text x="608" y="222" class="numb" text-anchor="start" >W1</text><text x="636" y="214" class="num" text-anchor="start" >eps_i = randn(seed_i)</text><text x="636" y="232" class="num" text-anchor="start" >run 1 episode -&gt; F_i</text><line x1="560" y1="218" x2="600" y2="218" class="ln" marker-end="url(#ar)"/><line x1="870" y1="218" x2="890" y2="218" class="ln" marker-end="url(#ar)"/><rect x="600" y="250" width="270" height="44" rx="6" class="blu"/><text x="608" y="276" class="numb" text-anchor="start" >W2</text><text x="636" y="268" class="num" text-anchor="start" >eps_i = randn(seed_i)</text><text x="636" y="286" class="num" text-anchor="start" >run 1 episode -&gt; F_i</text><line x1="560" y1="272" x2="600" y2="272" class="ln" marker-end="url(#ar)"/><line x1="870" y1="272" x2="890" y2="272" class="ln" marker-end="url(#ar)"/><rect x="600" y="304" width="270" height="44" rx="6" class="blu"/><text x="608" y="330" class="numb" text-anchor="start" >W3</text><text x="636" y="322" class="num" text-anchor="start" >eps_i = randn(seed_i)</text><text x="636" y="340" class="num" text-anchor="start" >run 1 episode -&gt; F_i</text><line x1="560" y1="326" x2="600" y2="326" class="ln" marker-end="url(#ar)"/><line x1="870" y1="326" x2="890" y2="326" class="ln" marker-end="url(#ar)"/><rect x="600" y="358" width="270" height="44" rx="6" class="blu"/><text x="608" y="384" class="numb" text-anchor="start" >W4</text><text x="636" y="376" class="num" text-anchor="start" >eps_i = randn(seed_i)</text><text x="636" y="394" class="num" text-anchor="start" >run 1 episode -&gt; F_i</text><line x1="560" y1="380" x2="600" y2="380" class="ln" marker-end="url(#ar)"/><line x1="870" y1="380" x2="890" y2="380" class="ln" marker-end="url(#ar)"/><path d="M890,218 L890,447 L874,447" class="ln" marker-end="url(#ar)"/><text x="735" y="420" class="mut" text-anchor="middle" >2 numbers per offspring</text><rect x="600" y="430" width="270" height="34" rx="6" class="grn"/><text x="735" y="451" class="num" text-anchor="middle" >reduce: (seed_i, F_i)</text><line x1="735" y1="464" x2="735" y2="476" class="ln" marker-end="url(#ar)"/><rect x="600" y="476" width="270" height="34" rx="6" class="yel"/><text x="735" y="497" class="numb" text-anchor="middle" >theta_(t+1)</text><rect x="30" y="530" width="900" height="86" rx="6" class="note"/><text x="44" y="552" class="h2" text-anchor="start" >The one idea</text><text x="44" y="572" class="handk" text-anchor="start" >The step is a reward-weighted average of parameter-space nudges: good A_i pulls you in, bad A_i pushes away.</text><text x="44" y="590" class="handk" text-anchor="start" >Each worker gets a seed and sends back one scalar, so a whole generation costs two numbers per offspring -</text><text x="44" y="608" class="handk" text-anchor="start" >no gradients, no weight vectors and no episodes ever cross the network.</text></svg>
