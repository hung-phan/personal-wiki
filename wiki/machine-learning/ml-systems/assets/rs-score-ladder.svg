<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="500" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >RECOMMENDERS</text><text x="30" y="62" class="h1" text-anchor="start" >One ladder of scores, and the axis that is not a rung</text><line x1="30" y1="72" x2="825" y2="72" class="uline"/><text x="556" y="100" class="mut" text-anchor="middle" >rungs 2 and 4-6: the same correction - distrust small samples, distrust old evidence</text><path d="M182,116 L182,108 L930,108 L930,116" class="lnd"/><rect x="30" y="120" width="140" height="92" rx="6" class="yel"/><text x="100" y="144" class="numb" text-anchor="middle" >Popularity</text><text x="100" y="170" class="num" text-anchor="middle" >s = count(j)</text><text x="100" y="230" class="mut" text-anchor="middle" >nothing - this is</text><text x="100" y="246" class="mut" text-anchor="middle" >the baseline</text><rect x="182" y="120" width="140" height="92" rx="6" class="yel"/><text x="252" y="144" class="numb" text-anchor="middle" >Age-decayed</text><text x="252" y="170" class="num" text-anchor="middle" >s = votes^0.8</text><text x="252" y="186" class="num" text-anchor="middle" >/ (age+2)^1.8</text><text x="252" y="230" class="mut" text-anchor="middle" >stale items holding</text><text x="252" y="246" class="mut" text-anchor="middle" >the top forever</text><rect x="334" y="120" width="140" height="92" rx="6" class="pnk"/><text x="404" y="144" class="numb" text-anchor="middle" >Raw mean rating</text><text x="404" y="170" class="num" text-anchor="middle" >s = (sum r) / n</text><text x="404" y="230" class="mut" text-anchor="middle" >item quality - but</text><text x="404" y="246" class="mut" text-anchor="middle" >breaks at small n</text><rect x="486" y="120" width="140" height="92" rx="6" class="yel"/><text x="556" y="144" class="numb" text-anchor="middle" >Smoothed mean</text><text x="556" y="170" class="num" text-anchor="middle" >(sum r + lambda*mu0)</text><text x="556" y="186" class="num" text-anchor="middle" >/ (n + lambda)</text><text x="556" y="230" class="mut" text-anchor="middle" >small n: pulls</text><text x="556" y="246" class="mut" text-anchor="middle" >toward a prior</text><rect x="638" y="120" width="140" height="92" rx="6" class="yel"/><text x="708" y="144" class="numb" text-anchor="middle" >Lower bound</text><text x="708" y="170" class="num" text-anchor="middle" >5th pct of the</text><text x="708" y="186" class="num" text-anchor="middle" >posterior</text><text x="708" y="230" class="mut" text-anchor="middle" >small n,</text><text x="708" y="246" class="mut" text-anchor="middle" >pessimistically</text><rect x="790" y="120" width="140" height="92" rx="6" class="yel"/><text x="860" y="144" class="numb" text-anchor="middle" >Sampled</text><text x="860" y="170" class="num" text-anchor="middle" >draw from the</text><text x="860" y="186" class="num" text-anchor="middle" >posterior</text><text x="860" y="230" class="mut" text-anchor="middle" >small n AND</text><text x="860" y="246" class="mut" text-anchor="middle" >it explores</text><text x="404" y="266" class="hand" text-anchor="middle" >small-n trap</text><line x1="480" y1="274" x2="480" y2="308" class="ln" marker-end="url(#ar)"/><text x="492" y="296" class="hand" text-anchor="start" >a different axis</text><rect x="130" y="312" width="700" height="72" rx="6" class="blu"/><text x="480" y="336" class="h2" text-anchor="middle" >Personalised</text><text x="480" y="356" class="num" text-anchor="middle" >s(i,j) = r_bar_i + weighted average of neighbours' deviations</text><text x="480" y="376" class="mut" text-anchor="middle" >same sorting problem - one score per user, not one per item</text><rect x="30" y="404" width="900" height="86" rx="6" class="note"/><text x="44" y="426" class="h2" text-anchor="start" >The one idea</text><text x="44" y="446" class="handk" text-anchor="start" >Rungs 2 and 4-6 are all the SAME correction applied to rung 3: distrust a small sample, distrust old evidence.</text><text x="44" y="464" class="handk" text-anchor="start" >Personalisation is a different axis, not a seventh rung - it changes whose score, not how you smooth it.</text></svg>
