<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >THE INDUSTRY WORKHORSE</text><text x="30" y="62" class="h1" text-anchor="start" >Two-tower retrieval: train together, serve apart</text><line x1="30" y1="72" x2="750" y2="72" class="uline"/><text x="240" y="104" class="h2" text-anchor="middle" >TRAINING</text><rect x="40" y="118" width="180" height="88" rx="6" class="pur"/><text x="130" y="140" class="h2" text-anchor="middle" >user features</text><text x="130" y="160" class="mut" text-anchor="middle" >user id, last 50 items,</text><text x="130" y="176" class="mut" text-anchor="middle" >country, device, time</text><rect x="260" y="118" width="180" height="88" rx="6" class="yel"/><text x="350" y="140" class="h2" text-anchor="middle" >item features</text><text x="350" y="160" class="mut" text-anchor="middle" >item id, category,</text><text x="350" y="176" class="mut" text-anchor="middle" >title text, price</text><line x1="130" y1="208" x2="130" y2="228" class="ln" marker-end="url(#ar)"/><line x1="350" y1="208" x2="350" y2="228" class="ln" marker-end="url(#ar)"/><rect x="70" y="230" width="120" height="40" rx="6" class="blu"/><text x="130" y="255" class="ink" text-anchor="middle" >user tower</text><rect x="290" y="230" width="120" height="40" rx="6" class="blu"/><text x="350" y="255" class="ink" text-anchor="middle" >item tower</text><line x1="130" y1="272" x2="130" y2="292" class="ln" marker-end="url(#ar)"/><line x1="350" y1="272" x2="350" y2="292" class="ln" marker-end="url(#ar)"/><circle cx="130" cy="306" r="13" class="pur"/><text x="130" y="311" class="h2" text-anchor="middle" >u</text><circle cx="350" cy="306" r="13" class="yel"/><text x="350" y="311" class="h2" text-anchor="middle" >v</text><path d="M144,306 L336,306" class="lnd"/><text x="240" y="300" class="hand" text-anchor="middle" >score = u · v</text><rect x="40" y="336" width="400" height="78" rx="6" class="note"/><text x="56" y="358" class="h2" text-anchor="start" >in-batch softmax over the batch's items</text><text x="56" y="376" class="handk" text-anchor="start" >logit = u·v − log Q(item)   ← logQ fix:</text><text x="56" y="394" class="handk" text-anchor="start" >popular items show up as negatives more often</text><line x1="480" y1="96" x2="480" y2="420" class="lnd"/><text x="710" y="104" class="h2" text-anchor="middle" >SERVING</text><rect x="520" y="118" width="190" height="60" rx="6" class="yel"/><text x="615" y="142" class="h2" text-anchor="middle" >OFFLINE: item tower</text><text x="615" y="162" class="mut" text-anchor="middle" >embed all 10M items nightly</text><line x1="615" y1="180" x2="615" y2="206" class="ln" marker-end="url(#ar)"/><rect x="520" y="208" width="190" height="52" rx="6" class="cell"/><text x="615" y="232" class="h2" text-anchor="middle" >ANN index</text><text x="615" y="250" class="mut" text-anchor="middle" >(FAISS / HNSW / ScaNN)</text><rect x="740" y="118" width="190" height="60" rx="6" class="pur"/><text x="835" y="142" class="h2" text-anchor="middle" >ONLINE: user tower</text><text x="835" y="162" class="mut" text-anchor="middle" >1 forward pass per request</text><path d="M835,180 C 835,234 760,234 712,234" class="lnr" marker-end="url(#arr)"/><text x="728" y="262" class="hand" text-anchor="start" >nearest neighbours of u</text><line x1="615" y1="262" x2="615" y2="288" class="ln" marker-end="url(#ar)"/><rect x="520" y="290" width="410" height="50" rx="6" class="grn"/><text x="725" y="312" class="h2" text-anchor="middle" >top ~500 candidates in a few ms</text><text x="725" y="330" class="mut" text-anchor="middle" >→ then a heavier ranking model reorders them</text><text x="520" y="372" class="handk" text-anchor="start" >Towers never see each other's features —</text><text x="520" y="390" class="handk" text-anchor="start" >that's what lets items be pre-computed.</text><rect x="30" y="436" width="900" height="108" rx="6" class="note"/><text x="44" y="458" class="h2" text-anchor="start" >Why this shape</text><text x="44" y="478" class="handk" text-anchor="start" >Scoring 10M items with a full model per request is impossible; a dot product + ANN index is a few ms.</text><text x="44" y="496" class="handk" text-anchor="start" >Price: no feature crosses between user and item (a ranker adds them back on the short list).</text><text x="44" y="514" class="handk" text-anchor="start" >Cold start: item tower can embed a brand-new item from its text/category before anyone clicks it.</text></svg>
