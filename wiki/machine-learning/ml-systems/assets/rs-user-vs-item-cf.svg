<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >COLLABORATIVE FILTERING</text><text x="30" y="62" class="h1" text-anchor="start" >One matrix, two directions to read it</text><line x1="30" y1="72" x2="585" y2="72" class="uline"/><text x="30" y="96" class="mut" text-anchor="start" >same 6 x 4 ratings matrix on both sides; ? = unrated; the pink cell is the target r(u3,i3)</text><path d="M480,112 L480,446" class="lnd"/><text x="30" y="124" class="h2" text-anchor="start" >user-user: who is like me?</text><text x="102.0" y="152" class="mut" text-anchor="middle" >i1</text><text x="142.0" y="152" class="mut" text-anchor="middle" >i2</text><text x="182.0" y="152" class="mut" text-anchor="middle" >i3</text><text x="222.0" y="152" class="mut" text-anchor="middle" >i4</text><text x="76" y="178" class="mut" text-anchor="end" >u1</text><rect x="82" y="160" width="40" height="28" rx="0" class="cell"/><text x="102.0" y="179" class="num" text-anchor="middle" >4</text><rect x="122" y="160" width="40" height="28" rx="0" class="cell"/><text x="142.0" y="179" class="num" text-anchor="middle" >?</text><rect x="162" y="160" width="40" height="28" rx="0" class="cell"/><text x="182.0" y="179" class="num" text-anchor="middle" >5</text><rect x="202" y="160" width="40" height="28" rx="0" class="cell"/><text x="222.0" y="179" class="num" text-anchor="middle" >3</text><text x="76" y="206" class="mut" text-anchor="end" >u2</text><rect x="82" y="188" width="40" height="28" rx="0" class="cell"/><text x="102.0" y="207" class="num" text-anchor="middle" >5</text><rect x="122" y="188" width="40" height="28" rx="0" class="cell"/><text x="142.0" y="207" class="num" text-anchor="middle" >2</text><rect x="162" y="188" width="40" height="28" rx="0" class="cell"/><text x="182.0" y="207" class="num" text-anchor="middle" >4</text><rect x="202" y="188" width="40" height="28" rx="0" class="cell"/><text x="222.0" y="207" class="num" text-anchor="