ext-anchor="middle" >3</text><rect x="622" y="272" width="40" height="28" rx="0" class="cell"/><text x="642.0" y="291" class="num" text-anchor="middle" >5</text><rect x="662" y="272" width="40" height="28" rx="0" class="cell"/><text x="682.0" y="291" class="num" text-anchor="middle" >?</text><text x="536" y="318" class="mut" text-anchor="end" >u6</text><rect x="542" y="300" width="40" height="28" rx="0" class="cell"/><text x="562.0" y="319" class="num" text-anchor="middle" >2</text><rect x="582" y="300" width="40" height="28" rx="0" class="cell"/><text x="602.0" y="319" class="num" text-anchor="middle" >?</text><rect x="622" y="300" width="40" height="28" rx="0" class="cell"/><text x="642.0" y="319" class="num" text-anchor="middle" >4</text><rect x="662" y="300" width="40" height="28" rx="0" class="cell"/><text x="682.0" y="319" class="num" text-anchor="middle" >5</text><rect x="622" y="216" width="40" height="28" rx="0" class="hi"/><rect x="582" y="160" width="40" height="168" rx="0" class="hi"/><rect x="622" y="160" width="40" height="168" rx="0" class="hi"/><path d="M586,336 L586,348 L658,348 L658,336 M622,348 L622,360" class="lnr"/><text x="622" y="378" class="num" text-anchor="middle" >w from co-rating users</text><text x="622" y="394" class="mut" text-anchor="middle" >long list -&gt; steadier w</text><text x="542" y="420" class="num" text-anchor="start" >all pairs: O(M^2 N)</text><text x="542" y="436" class="mut" text-anchor="start" >cheaper whenever N &gt; M</text><rect x="30" y="460" width="900" height="86" rx="6" class="note"/><text x="44" y="482" class="h2" text-anchor="start" >The one idea</text><text x="44" y="502" class="handk" text-anchor="start" >Same matrix, same formula - the only thing that changes is the direction you read it in.</text><text x="44" y="520" class="handk" text-anchor="start" >Columns win twice: more co-raters behind each weight, and M^2 &lt; N^2 pairs whenever N &gt; M - the usual case, not a law.</text></svg>
