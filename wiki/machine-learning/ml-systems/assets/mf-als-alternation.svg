<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="590" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >MATRIX FACTORIZATION</text><text x="30" y="62" class="h1" text-anchor="start" >ALS: a non-convex problem cut into two convex halves</text><line x1="30" y1="72" x2="810" y2="72" class="uline"/><path d="M225,112 L225,470" class="lnd"/><path d="M615,112 L615,470" class="lnd"/><text x="30" y="124" class="h2" text-anchor="start" >1. the data</text><text x="36" y="150" class="mut" text-anchor="start" >R: N users x M items</text><rect x="40" y="158" width="26" height="20" rx="0" class="grn"/><text x="53" y="172" class="num" text-anchor="middle" >4</text><rect x="66" y="158" width="26" height="20" rx="0" class="grey"/><rect x="92" y="158" width="26" height="20" rx="0" class="grn"/><text x="105" y="172" class="num" text-anchor="middle" >2</text><rect x="118" y="158" width="26" height="20" rx="0" class="grey"/><rect x="144" y="158" width="26" height="20" rx="0" class="grn"/><text x="157" y="172" class="num" text-anchor="middle" >5</text><rect x="170" y="158" width="26" height="20" rx="0" class="grey"/><rect x="40" y="178" width="26" height="20" rx="0" class="grey"/><rect x="66" y="178" width="26" height="20" rx="0" class="grey"/><rect x="92" y="178" width="26" height="20" rx="0" class="grey"/><rect x="118" y="178" width="26" height="20" rx="0" class="grey"/><rect x="144" y="178" width="26" height="20" rx="0" class="grey"/><rect x="170" y="178" width="26" height="20" rx="0" class="grey"/><rect x="40" y="198" width="26" height="20" rx="0" class="grey"/><rect x="66" y="198" width="26" height="20" rx="0" class="grey"/><rect x="92" y="198" width="26" height="20" rx="0" class="grey"/><rect x="118" y="198" width="26" height="20" rx="0" class="grey"/><rect x="144" y="198" width="26" height="20" rx="0" class="grey"/><rect x="170" y="198" width="26" height="20" rx="0" class="grey"/><rect x="40" y="218" width="26" height="20" rx="0" class="grey"/><rect x="66" y="218" width="26" height="20" rx="0" class="grn"/><text x="79" y="232" class="num" text-anchor="middle" >3</text><rect x="92" y="218" width="26" height="20" rx="0" class="grey"/><rect x="118" y="218" width="26" height="20" rx="0" class="grn"/><text x="131" y="232" class="num" text-anchor="middle" >4</text><rect x="144" y="218" width="26" height="20" rx="0" class="grey"/><rect x="170" y="218" width="26" height="20" rx="0" class="grn"/><text x="183" y="232" class="num" text-anchor="middle" >1</text><rect x="40" y="238" width="26" height="20" rx="0" class="grey"/><rect x="66" y="238" width="26" height="20" rx="0" class="grey"/><rect x="92" y="238" width="26" height="20" rx="0" class="grey"/><rect x="118" y="238" width="26" height="20" rx="0" class="grey"/><rect x="144" y="238" width="26" height="20" rx="0" class="grey"/><rect x="170" y="238" width="26" height="20" rx="0" class="grey"/><rect x="40" y="258" width="26" height="20" rx="0" class="grey"/><rect x="66" y="258" width="26" height="20" rx="0" class="grey"/><rect x="92" y="258" width="26" height="20" rx="0" class="grey"/><rect x="118" y="258" width="26" height="20" rx="0" class="grey"/><rect x="144" y="258" width="26" height="20" rx="0" class="grey"/><rect x="170" y="258" width="26" height="20" rx="0" class="grey"/><rect x="40" y="278" width="26" height="20" rx="0" class="grn"/><text x="53" y="292" class="num" text-anchor="middle" >5</text><rect x="66" y="278" width="26" height="20" rx="0" class="grey"/><rect x="92" y="278" width="26" height="20" rx="0" class="grn"/><text x="105" y="292" class="num" text-anchor="middle" >3</text><rect x="118" y="278" width="26" height="20" rx="0" class="grey"/><rect x="144" y="278" width="26" height="20" rx="0" class="grn"/><text x="157" y="292" class="num" text-anchor="middle" >4</text><rect x="170" y="278" width="26" height="20" rx="0" class="grey"/><text x="36" y="322" class="mut" text-anchor="start" >only Omega (the observed</text><text x="36" y="338" class="mut" text-anchor="start" >cells) is known - under 1%</text><text x="36" y="354" class="mut" text-anchor="start" >filled in MovieLens-20M</text><text x="230" y="124" class="h2" text-anchor="start" >2. the model</text><rect x="250" y="158" width="36" height="110" rx="0" class="cell"/><rect x="250" y="158" width="36" height="22" rx="0" class="pur"/><text x="246" y="174" class="num" text-anchor="end" >w_i</text><text x="268" y="284" class="num" text-anchor="middle" >W: N x K</text><text x="268" y="298" class="mut" text-anchor="middle" >(users)</text><text x="294" y="216" class="ink" text-anchor="middle" >x</text><rect x="306" y="158" width="100" height="36" rx="0" class="cell"/><rect x="386" y="158" width="20" height="36" rx="0" class="pur"/><text x="396" y="150" class="num" text-anchor="middle" >u_j</text><text x="356" y="212" class="num" text-anchor="middle" >U^T: K x M</text><text x="356" y="226" class="mut" text-anchor="middle" >(items)</text><text x="419" y="216" class="ink" text-anchor="middle" >=</text><rect x="432" y="158" width="20" height="20" rx="0" class="cell"/><rect x="452" y="158" width="20" height="20" rx="0" class="cell"/><rect x="472" y="158" width="20" height="20" rx="0" class="cell"/><rect x="492" y="158" width="20" height="20" rx="0" class="cell"/><rect x="512" y="158" width="20" height="20" rx="0" class="pnk"/><rect x="432" y="178" width="20" height="20" rx="0" class="cell"/><rect x="452" y="178" width="20" height="20" rx="0" class="cell"/><rect x="472" y="178" width="20" height="20" rx="0" class="cell"/><rect x="492" y="178" width="20" height="20" rx="0" class="cell"/><rect x="512" y="178" width="20" height="20" rx="0" class="cell"/><rect x="432" y="198" width="20" height="20" rx="0" class="cell"/><rect x="452" y="198" width="20" height="20" rx="0" class="cell"/><rect x="472" y="198" width="20" height="20" rx="0" class="cell"/><rect x="492" y="198" width="20" height="20" rx="0" class="cell"/><rect x="512" y="198" width="20" height="20" rx="0" class="cell"/><rect x="432" y="218" width="20" height="20" rx="0" class="cell"/><rect x="452" y="218" width="20" height="20" rx="0" class="cell"/><rect x="472" y="218" width="20" height="20" rx="0" class="cell"/><rect x="492" y="218" width="20" height="20" rx="0" class="cell"/><rect x="512" y="218" width="20" height="20" rx="0" class="cell"/><rect x="432" y="238" width="20" height="20" rx="0" class="cell"/><rect x="452" y="238" width="20" height="20" rx="0" class="cell"/><rect x="472" y="238" width="20" height="20" rx="0" class="cell"/><rect x="492" y="238" width="20" height="20" rx="0" class="cell"/><rect x="512" y="238" width="20" height="20" rx="0" class="cell"/><rect x="512" y="158" width="20" height="20" rx="0" class="hi"/><text x="482" y="276" class="mut" text-anchor="middle" >one cell of R-hat</text><text x="400" y="320" class="num" text-anchor="middle" >r_hat(i,j) = w_i . u_j + b_i + c_j + mu</text><path d="M548,316 L560,316 L560,192" class="lnd"/><line x1="560" y1="192" x2="537" y2="182" class="lnr" marker-end="url(#arr)"/><text x="240" y="344" class="mut" text-anchor="start" >K = the inner dim summed over = latent factors (10-50)</text><rect x="300" y="364" width="110" height="50" rx="6" class="grey"/><path d="M306,368 L404,410" class="lnr"/><path d="M404,368 L306,410" class="lnr"/><text x="422" y="386" class="numb" text-anchor="start" >W @ U^T</text><text x="422" y="402" class="mut" text-anchor="start" >(N x M)</text><text x="420" y="434" class="hand" text-anchor="middle" >never materialise this</text><text x="620" y="124" class="h2" text-anchor="start" >3. the training loop</text><rect x="620" y="152" width="284" height="136" rx="6" class="cell"/><rect x="634" y="162" width="78" height="26" rx="4" class="grey"/><text x="673" y="179" class="num" text-anchor="middle" >freeze U</text><line x1="716" y1="175" x2="736" y2="175" class="ln" marker-end="url(#ar)"/><rect x="740" y="162" width="78" height="26" rx="4" class="pur"/><text x="779" y="179" class="num" text-anchor="middle" >solve W</text><text x="634" y="206" class="mut" text-anchor="start" >each row of W is an independent</text><text x="634" y="222" class="mut" text-anchor="start" >ridge regression (an exact solve):</text><text x="634" y="238" class="num" text-anchor="start" >(sum u_j u_j^T + lambda I) w_i</text><text x="634" y="254" class="num" text-anchor="start" >  = sum (r_ij - b_i - c_j - mu) u_j</text><text x="634" y="270" class="mut" text-anchor="start" >-&gt; one np.linalg.solve per user</text><rect x="620" y="304" width="284" height="136" rx="6" class="cell"/><rect x="634" y="314" width="78" height="26" rx="4" class="grey"/><text x="673" y="331" class="num" text-anchor="middle" >freeze W</text><line x1="716" y1="327" x2="736" y2="327" class="ln" marker-end="url(#ar)"/><rect x="740" y="314" width="78" height="26" rx="4" class="pur"/><text x="779" y="331" class="num" text-anchor="middle" >solve U</text><text x="634" y="358" class="mut" text-anchor="start" >each row of U is an independent</text><text x="634" y="374" class="mut" text-anchor="start" >ridge regression (an exact solve):</text><text x="634" y="390" class="num" text-anchor="start" >(sum w_i w_i^T + lambda I) u_j</text><text x="634" y="406" class="num" text-anchor="start" >  = sum (r_ij - b_i - c_j - mu) w_i</text><text x="634" y="422" class="mut" text-anchor="start" >-&gt; one np.linalg.solve per item</text><line x1="762" y1="288" x2="762" y2="302" class="ln" marker-end="url(#ar)"/><path d="M904,372 L918,372 L918,220 L904,220" class="lnr" marker-end="url(#arr)"/><text x="762" y="460" class="hand" text-anchor="middle" >repeat; loss never increases</text><rect x="30" y="482" width="900" height="86" rx="6" class="note"/><text x="44" y="504" class="h2" text-anchor="start" >The one idea</text><text x="44" y="524" class="handk" text-anchor="start" >Jointly over (W, U) the loss is NOT convex - the product w_i . u_j makes it bilinear in the parameters.</text><text x="44" y="542" class="handk" text-anchor="start" >Freeze one side and every row of the other is an exact convex ridge solve, so the loss can only go down.</text><text x="44" y="560" class="handk" text-anchor="start" >Price: ALS promises a stationary point, not the global optimum - different seeds land in different places.</text></svg>
