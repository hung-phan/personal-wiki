<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >BEHAVIOR SIGNALS</text><text x="30" y="62" class="h1" text-anchor="start" >From user behavior to training pairs</text><line x1="30" y1="72" x2="570" y2="72" class="uline"/><text x="30" y="104" class="h2" text-anchor="start" >Signal</text><text x="300" y="104" class="h2" text-anchor="start" >What becomes a training example</text><text x="640" y="104" class="h2" text-anchor="start" >Typical model</text><rect x="30" y="118" width="240" height="70" rx="6" class="pur"/><text x="44" y="146" class="h2" text-anchor="start" >Implicit: clicks, buys</text><text x="44" y="168" class="mut" text-anchor="start" >only positives — no explicit “no”</text><line x1="272" y1="153" x2="296" y2="153" class="ln" marker-end="url(#ar)"/><rect x="300" y="118" width="316" height="70" rx="6" class="note"/><text x="316" y="158" class="handk" text-anchor="start" >(user, bought item) vs (user, random item)</text><line x1="618" y1="153" x2="636" y2="153" class="ln" marker-end="url(#ar)"/><rect x="640" y="118" width="290" height="70" rx="6" class="cell"/><text x="656" y="158" class="ink" text-anchor="start" >MF / ALS · BPR · two-tower</text><rect x="30" y="204" width="240" height="70" rx="6" class="yel"/><text x="44" y="232" class="h2" text-anchor="start" >Explicit preference</text><text x="44" y="254" class="mut" text-anchor="start" >rating, thumbs, “A over B”</text><line x1="272" y1="239" x2="296" y2="239" class="ln" marker-end="url(#ar)"/><rect x="300" y="204" width="316" height="70" rx="6" class="note"/><text x="316" y="244" class="handk" text-anchor="start" >(user, A) should score above (user, B)</text><line x1="618" y1="239" x2="636" y2="239" class="ln" marker-end="url(#ar)"/><rect x="640" y="204" width="290" height="70" rx="6" class="cell"/><text x="656" y="244" class="ink" text-anchor="start" >BPR · Bradley-Terry · pairwise LTR</text><rect x="30" y="290" width="240" height="70" rx="6" class="grn"/><text x="44" y="318" class="h2" text-anchor="start" >Sequence / session</text><text x="44" y="340" class="mut" text-anchor="start" >order matters: tent → stove → ?</text><line x1="272" y1="325" x2="296" y2="325" class="ln" marker-end="url(#ar)"/><rect x="300" y="290" width="316" height="70" rx="6" class="note"/><text x="316" y="330" class="handk" text-anchor="start" >(item, next item) · (history, next item)</text><line x1="618" y1="325" x2="636" y2="325" class="ln" marker-end="url(#ar)"/><rect x="640" y="290" width="290" height="70" rx="6" class="cell"/><text x="656" y="330" class="ink" text-anchor="start" >item2vec · SASRec · BERT4Rec</text><rect x="30" y="376" width="240" height="70" rx="6" class="blu"/><text x="44" y="404" class="h2" text-anchor="start" >Graph</text><text x="44" y="426" class="mut" text-anchor="start" >user–item, co-purchase, follows</text><line x1="272" y1="411" x2="296" y2="411" class="ln" marker-end="url(#ar)"/><rect x="300" y="376" width="316" height="70" rx="6" class="note"/><text x="316" y="416" class="handk" text-anchor="start" >nodes close in the graph should be close</text><line x1="618" y1="411" x2="636" y2="411" class="ln" marker-end="url(#ar)"/><rect x="640" y="376" width="290" height="70" rx="6" class="cell"/><text x="656" y="416" class="ink" text-anchor="start" >DeepWalk · LightGCN · PinSage</text><rect x="30" y="470" width="900" height="76" rx="6" class="note"/><text x="44" y="492" class="h2" text-anchor="start" >The common core</text><text x="44" y="512" class="handk" text-anchor="start" >Every row ends in the same move: score(positive) should beat score(negatives).</text><text x="44" y="530" class="handk" text-anchor="start" >What changes is where positives come from and how you pick negatives — that's where projects fail.</text></svg>
