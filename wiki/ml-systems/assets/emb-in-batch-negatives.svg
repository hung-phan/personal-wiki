<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >CONTRASTIVE TRAINING</text><text x="30" y="62" class="h1" text-anchor="start" >In-batch negatives: one batch, B² comparisons</text><line x1="30" y1="72" x2="705" y2="72" class="uline"/><text x="350.0" y="116" class="mut" text-anchor="middle" >passages in the batch (each query's positive is on the diagonal)</text><text x="222.0" y="134" class="h2" text-anchor="middle" >p1</text><text x="286.0" y="134" class="h2" text-anchor="middle" >p2</text><text x="350.0" y="134" class="h2" text-anchor="middle" >p3</text><text x="414.0" y="134" class="h2" text-anchor="middle" >p4</text><text x="478.0" y="134" class="h2" text-anchor="middle" >p5</text><text x="182" y="167" class="ink" text-anchor="end" >q1: reset password</text><text x="182" y="211" class="ink" text-anchor="end" >q2: refund order</text><text x="182" y="255" class="ink" text-anchor="end" >q3: track parcel</text><text x="182" y="299" class="ink" text-anchor="end" >q4: change email</text><text x="182" y="343" class="ink" text-anchor="end" >q5: cancel plan</text><rect x="190" y="140" width="64" height="44" rx="0" class="grn"/><text x="222.0" y="166.0" class="numb" text-anchor="middle" >0.82</text><rect x="254" y="140" width="64" height="44" rx="0" class="cell"/><text x="286.0" y="166.0" class="num" text-anchor="middle" >0.11</text><rect x="318" y="140" width="64" height="44" rx="0" class="cell"/><text x="350.0" y="166.0" class="num" text-anchor="middle" >0.05</text><rect x="382" y="140" width="64" height="44" rx="0" class="pnk"/><text x="414.0" y="166.0" class="num" text-anchor="middle" >0.31</text><rect x="446" y="140" width="64" height="44" rx="0" class="cell"/><text x="478.0" y="166.0" class="num" text-anchor="middle" >0.02</text><rect x="190" y="184" width="64" height="44" rx="0" class="cell"/><text x="222.0" y="210.0" class="num" text-anchor="middle" >0.08</text><rect x="254" y="184" width="64" height="44" rx="0" class="grn"/><text x="286.0" y="210.0" class="numb" text-anchor="middle" >0.77</text><rect x="318" y="184" width="64" height="44" rx="0" class="cell"/><text x="350.0" y="210.0" class="num" text-anchor="middle" >0.21</text><rect x="382" y="184" width="64" height="44" rx="0" class="cell"/><text x="414.0" y="210.0" class="num" text-anchor="middle" >0.03</text><rect x="446" y="184" width="64" height="44" rx="0" class="cell"/><text x="478.0" y="210.0" class="num" text-anchor="middle" >0.29</text><rect x="190" y="228" width="64" height="44" rx="0" class="cell"/><text x="222.0" y="254.0" class="num" text-anchor="middle" >0.04</text><rect x="254" y="228" width="64" height="44" rx="0" class="cell"/><text x="286.0" y="254.0" class="num" text-anchor="middle" >0.18</text><rect x="318" y="228" width="64" height="44" rx="0" class="grn"/><text x="350.0" y="254.0" class="numb" text-anchor="middle" >0.85</text><rect x="382" y="228" width="64" height="44" rx="0" class="cell"/><text x="414.0" y="254.0" class="num" text-anchor="middle" >0.06</text><rect x="446" y="228" width="64" height="44" rx="0" class="cell"/><text x="478.0" y="254.0" class="num" text-anchor="middle" >0.09</text><rect x="190" y="272" width="64" height="44" rx="0" class="pnk"/><text x="222.0" y="298.0" class="num" text-anchor="middle" >0.36</text><rect x="254" y="272" width="64" height="44" rx="0" class="cell"/><text x="286.0" y="298.0" class="num" text-anchor="middle" >0.02</text><rect x="318" y="272" width="64" height="44" rx="0" class="cell"/><text x="350.0" y="298.0" class="num" text-anchor="middle" >0.07</text><rect x="382" y="272" width="64" height="44" rx="0" class="grn"/><text x="414.0" y="298.0" class="numb" text-anchor="middle" >0.79</text><rect x="446" y="272" width="64" height="44" rx="0" class="cell"/><text x="478.0" y="298.0" class="num" text-anchor="middle" >0.12</text><rect x="190" y="316" width="64" height="44" rx="0" class="cell"/><text x="222.0" y="342.0" class="num" text-anchor="middle" >0.01</text><rect x="254" y="316" width="64" height="44" rx="0" class="cell"/><text x="286.0" y="342.0" class="num" text-anchor="middle" >0.33</text><rect x="318" y="316" width="64" height="44" rx="0" class="cell"/><text x="350.0" y="342.0" class="num" text-anchor="middle" >0.05</text><rect x="382" y="316" width="64" height="44" rx="0" class="cell"/><text x="414.0" y="342.0" class="num" text-anchor="middle" >0.10</text><rect x="446" y="316" width="64" height="44" rx="0" class="grn"/><text x="478.0" y="342.0" class="numb" text-anchor="middle" >0.74</text><rect x="528" y="140" width="64" height="220" rx="0" class="pnk"/><text x="560.0" y="134" class="hand" text-anchor="middle" >hard −</text><text x="560.0" y="167" class="num" text-anchor="middle" >.61</text><text x="560.0" y="211" class="num" text-anchor="middle" >.55</text><text x="560.0" y="255" class="num" text-anchor="middle" >.58</text><text x="560.0" y="299" class="num" text-anchor="middle" >.49</text><text x="560.0" y="343" class="num" text-anchor="middle" >.52</text><rect x="190" y="140" width="320" height="44" rx="0" class="hi"/><text x="350.0" y="384" class="mut" text-anchor="middle" >cosine(q_i, p_j) — scaled by 1/temperature, then softmax per row</text><rect x="640" y="100" width="290" height="300" rx="6" class="note"/><text x="654" y="122" class="h2" text-anchor="start" >How to read it</text><text x="654" y="146" class="hand" text-anchor="start" >Each ROW is a classification:</text><text x="654" y="166" class="hand" text-anchor="start" >“which column is mine?”</text><text x="654" y="186" class="handk" text-anchor="start" ></text><text x="654" y="206" class="handk" text-anchor="start" >green = the true pair</text><text x="654" y="226" class="handk" text-anchor="start" >white = free negatives (other</text><text x="654" y="246" class="handk" text-anchor="start" >rows' positives)</text><text x="654" y="266" class="handk" text-anchor="start" >pink = hard negatives: look</text><text x="654" y="286" class="handk" text-anchor="start" >similar, but wrong</text><text x="654" y="306" class="handk" text-anchor="start" ></text><text x="654" y="326" class="handk" text-anchor="start" >B=5 pairs → 20 negatives</text><text x="654" y="346" class="handk" text-anchor="start" >for the price of 5.</text><text x="654" y="366" class="handk" text-anchor="start" >Bigger batch = more negatives.</text><rect x="30" y="430" width="900" height="110" rx="6" class="note"/><text x="44" y="452" class="h2" text-anchor="start" >Knobs that matter</text><text x="44" y="472" class="handk" text-anchor="start" >Temperature τ ≈ 0.01–0.1: smaller = sharper softmax, punishes near-misses harder.</text><text x="44" y="490" class="handk" text-anchor="start" >Hard negatives (BM25 hits, last model's false positives) give the biggest quality jump.</text><text x="44" y="508" class="handk" text-anchor="start" >False negatives: another row's passage may truly answer your query too (duplicates, same intent) — dedupe or mask.</text></svg>
