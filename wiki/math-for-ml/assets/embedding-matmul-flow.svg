<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .txt      { fill: #0f172a; }
    .tick     { fill: #475569; font-size: 12px; }
    .title    { font-weight: 700; font-size: 15px; fill: #0f172a; }
    .caption  { font-size: 12px; fill: #475569; font-style: italic; }

    .box      { stroke: #0f172a; stroke-width: 1.5; fill: none; }
    .brace    { stroke: #64748b; stroke-width: 1; fill: none; }
    .row-doc  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
    .row-doc-highlight { fill: #93c5fd; stroke: #1e40af; stroke-width: 2; }
    .col-q    { fill: #fde68a; stroke: #a16207; stroke-width: 1; }
    .row-sim  { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; }
    .row-sim-highlight { fill: #86efac; stroke: #14532d; stroke-width: 2; }

    .lbl-dim  { font-size: 13px; fill: #0f172a; font-weight: 600; }
    .lbl-lbl  { font-size: 12px; fill: #475569; }

    .arrow    { stroke: #dc2626; stroke-width: 2; fill: none; }

    @media (prefers-color-scheme: dark) {
      .txt, .title { fill: #e2e8f0; }
      .tick, .caption, .lbl-lbl { fill: #cbd5e1; }
      .lbl-dim { fill: #e2e8f0; }
      .box, .brace { stroke: #cbd5e1; }
      .row-doc { fill: #1e3a8a; stroke: #60a5fa; }
      .row-doc-highlight { fill: #3b82f6; stroke: #93c5fd; }
      .col-q { fill: #78350f; stroke: #fde68a; }
      .row-sim { fill: #14532d; stroke: #4ade80; }
      .row-sim-highlight { fill: #16a34a; stroke: #86efac; }
      .arrow { stroke: #f87171; }
    }
  </style>

  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="480" y="32" text-anchor="middle">One matrix-multiply computes all M cosine similarities at once</text>
  <text class="caption" x="480" y="54" text-anchor="middle">All rows unit-length, so the raw dot product IS cosine similarity</text>

  <!-- ============ D_norm ============ -->
  <!-- x=100..280 (w=180), y=110..410 (h=300) -->
  <g>
    <text class="lbl-dim" x="190" y="100" text-anchor="middle">D_norm</text>

    <rect class="box" x="100" y="110" width="180" height="300"/>

    <!-- 10 rows, 30px tall each -->
    <rect class="row-doc" x="102" y="112" width="176" height="28"/>
    <rect class="row-doc" x="102" y="142" width="176" height="28"/>
    <rect class="row-doc-highlight" x="102" y="172" width="176" height="28"/>
    <rect class="row-doc" x="102" y="202" width="176" height="28"/>
    <rect class="row-doc" x="102" y="232" width="176" height="28"/>
    <rect class="row-doc" x="102" y="262" width="176" height="28"/>
    <rect class="row-doc" x="102" y="292" width="176" height="28"/>
    <rect class="row-doc" x="102" y="322" width="176" height="28"/>
    <rect class="row-doc" x="102" y="352" width="176" height="28"/>
    <rect class="row-doc" x="102" y="382" width="176" height="28"/>

    <!-- entries inside the highlighted row (y=172..200, center y=190) -->
    <text class="tick" x="112" y="192" text-anchor="start">0.03</text>
    <text class="tick" x="152" y="192" text-anchor="middle">-0.12</text>
    <text class="tick" x="192" y="192" text-anchor="middle">0.44</text>
    <text class="tick" x="230" y="192" text-anchor="middle">...</text>
    <text class="tick" x="268" y="192" text-anchor="end">0.07</text>

    <!-- Top brace: d dimension -->
    <line class="brace" x1="102" y1="106" x2="278" y2="106"/>
    <line class="brace" x1="102" y1="102" x2="102" y2="110"/>
    <line class="brace" x1="278" y1="102" x2="278" y2="110"/>
    <text class="lbl-dim" x="190" y="88" text-anchor="middle">d = 384 (embed dim)</text>

    <!-- Left brace: M dimension -->
    <line class="brace" x1="90" y1="112" x2="90" y2="410"/>
    <line class="brace" x1="86" y1="112" x2="94" y2="112"/>
    <line class="brace" x1="86" y1="410" x2="94" y2="410"/>
    <text class="lbl-dim" x="72" y="261" text-anchor="middle" transform="rotate(-90 72,261)">M = 10,000 docs</text>

    <!-- Row callout -->
    <text class="lbl-lbl" x="190" y="435" text-anchor="middle" fill="#1e40af" font-weight="700">highlighted = doc i (unit-length)</text>
  </g>

  <!-- @ operator, placed BELOW the title band and ABOVE any dim labels -->
  <text class="title" x="336" y="270" text-anchor="middle" font-size="30">@</text>

  <!-- ============ q_norm ============ -->
  <!-- x=380..430 (w=50), y=110..410 -->
  <g>
    <text class="lbl-dim" x="405" y="100" text-anchor="middle">q_norm</text>

    <rect class="box" x="380" y="110" width="50" height="300"/>
    <rect class="col-q" x="382" y="112" width="46" height="296"/>

    <text class="tick" x="405" y="140" text-anchor="middle">0.11</text>
    <text class="tick" x="405" y="165" text-anchor="middle">-0.05</text>
    <text class="tick" x="405" y="190" text-anchor="middle">0.28</text>
    <text class="tick" x="405" y="215" text-anchor="middle">0.02</text>
    <text class="tick" x="405" y="240" text-anchor="middle">...</text>
    <text class="tick" x="405" y="265" text-anchor="middle">-0.19</text>
    <text class="tick" x="405" y="290" text-anchor="middle">0.06</text>
    <text class="tick" x="405" y="315" text-anchor="middle">...</text>
    <text class="tick" x="405" y="340" text-anchor="middle">-0.03</text>
    <text class="tick" x="405" y="380" text-anchor="middle">0.14</text>

    <!-- right brace showing d -->
    <line class="brace" x1="440" y1="112" x2="440" y2="408"/>
    <line class="brace" x1="436" y1="112" x2="444" y2="112"/>
    <line class="brace" x1="436" y1="408" x2="444" y2="408"/>
    <text class="lbl-dim" x="458" y="261" text-anchor="middle" transform="rotate(-90 458,261)">d = 384</text>

    <text class="lbl-lbl" x="405" y="435" text-anchor="middle">query, shape (d,)</text>
  </g>

  <!-- = operator -->
  <text class="title" x="516" y="270" text-anchor="middle" font-size="30">=</text>

  <!-- ============ sims ============ -->
  <!-- x=560..640 (w=80), y=110..410 -->
  <g>
    <text class="lbl-dim" x="600" y="100" text-anchor="middle">sims</text>

    <rect class="box" x="560" y="110" width="80" height="300"/>

    <rect class="row-sim" x="562" y="112" width="76" height="28"/>
    <rect class="row-sim" x="562" y="142" width="76" height="28"/>
    <rect class="row-sim-highlight" x="562" y="172" width="76" height="28"/>
    <rect class="row-sim" x="562" y="202" width="76" height="28"/>
    <rect class="row-sim" x="562" y="232" width="76" height="28"/>
    <rect class="row-sim" x="562" y="262" width="76" height="28"/>
    <rect class="row-sim" x="562" y="292" width="76" height="28"/>
    <rect class="row-sim" x="562" y="322" width="76" height="28"/>
    <rect class="row-sim" x="562" y="352" width="76" height="28"/>
    <rect class="row-sim" x="562" y="382" width="76" height="28"/>

    <text class="tick" x="600" y="131" text-anchor="middle">0.977</text>
    <text class="tick" x="600" y="161" text-anchor="middle">0.945</text>
    <text class="tick" x="600" y="191" text-anchor="middle" font-weight="700">0.743</text>
    <text class="tick" x="600" y="221" text-anchor="middle">0.021</text>
    <text class="tick" x="600" y="251" text-anchor="middle">-0.013</text>
    <text class="tick" x="600" y="281" text-anchor="middle">0.612</text>
    <text class="tick" x="600" y="311" text-anchor="middle">0.318</text>
    <text class="tick" x="600" y="341" text-anchor="middle">...</text>
    <text class="tick" x="600" y="371" text-anchor="middle">0.089</text>
    <text class="tick" x="600" y="401" text-anchor="middle">0.402</text>

    <line class="brace" x1="550" y1="112" x2="550" y2="410"/>
    <line class="brace" x1="546" y1="112" x2="554" y2="112"/>
    <line class="brace" x1="546" y1="410" x2="554" y2="410"/>
    <text class="lbl-dim" x="528" y="261" text-anchor="middle" transform="rotate(-90 528,261)">M = 10,000</text>

    <text class="lbl-lbl" x="600" y="435" text-anchor="middle">all M cosine sims</text>
  </g>

  <!-- ============ Right-side explanation block ============ -->
  <!-- Kept BELOW the diagram to avoid overlap -->
  <g>
    <rect class="box" x="680" y="130" width="270" height="120" rx="6" fill="rgba(148,163,184,0.08)"/>
    <text class="title" x="815" y="152" text-anchor="middle" font-size="13">Each output entry is one dot product</text>
    <text class="tick" x="815" y="180" text-anchor="middle" font-family="monospace">sims[i]</text>
    <text class="tick" x="815" y="200" text-anchor="middle" font-family="monospace">= D_norm[i, :] . q_norm</text>
    <text class="tick" x="815" y="220" text-anchor="middle" font-weight="700">= cos_sim(doc i, query)</text>
    <text class="tick" x="815" y="240" text-anchor="middle" fill="#dc2626">(traced by the red arrows)</text>
  </g>

  <!-- Red arrow: highlighted row -> highlighted output -->
  <!-- doc row center y = 186, sim row center y = 186 -->
  <path class="arrow" d="M 280 186 C 320 186, 320 260, 380 260" marker-end="url(#ah-red)"/>
  <path class="arrow" d="M 430 260 C 470 260, 470 186, 560 186" marker-end="url(#ah-red)"/>

  <!-- ============ Bottom shape summary ============ -->
  <rect class="box" x="80" y="470" width="800" height="130" rx="8" fill="rgba(148,163,184,0.08)"/>
  <text class="txt" x="480" y="500" text-anchor="middle" font-size="16" font-weight="700">
    (M x d)  @  (d,)  =  (M,)
  </text>
  <text class="lbl-lbl" x="480" y="522" text-anchor="middle">
    one BLAS call - one shot - ~1000x faster than a Python loop
  </text>
  <text class="txt" x="480" y="555" text-anchor="middle" font-weight="700">
    All-pairs generalization
  </text>
  <text class="lbl-lbl" x="480" y="575" text-anchor="middle">
    (M x d)  @  (d x N)  =  (M x N)   -   every doc vs every query in one matmul
  </text>
  <text class="lbl-lbl" x="480" y="591" text-anchor="middle" font-style="italic">
    This is the primitive under every vector database (FAISS, Pinecone, Weaviate, pgvector, ...)
  </text>
</svg>
