<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .txt      { fill: #0f172a; }
    .tick     { fill: #475569; font-size: 12px; }
    .title    { font-weight: 700; font-size: 15px; fill: #0f172a; }
    .caption  { font-size: 12px; fill: #475569; font-style: italic; }

    .box      { stroke: #0f172a; stroke-width: 1.5; fill: none; }
    .row-doc  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; }
    .row-doc-highlight { fill: #93c5fd; stroke: #1e40af; stroke-width: 2; }
    .col-q    { fill: #fde68a; stroke: #a16207; stroke-width: 1; }
    .row-sim  { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; }
    .row-sim-highlight { fill: #86efac; stroke: #14532d; stroke-width: 2; }

    .lbl-dim  { font-size: 13px; fill: #0f172a; font-weight: 600; }
    .lbl-lbl  { font-size: 12px; fill: #475569; }

    .arrow    { stroke: #dc2626; stroke-width: 2; fill: none; }

    @media (prefers-color-scheme: dark) {
      .txt, .title { fill: #e2e8f0; }
      .tick, .caption, .lbl-lbl { fill: #cbd5e1; }
      .lbl-dim { fill: #e2e8f0; }
      .box { stroke: #cbd5e1; }
      .row-doc { fill: #1e3a8a; stroke: #60a5fa; }
      .row-doc-highlight { fill: #3b82f6; stroke: #93c5fd; }
      .col-q { fill: #78350f; stroke: #fde68a; }
      .row-sim { fill: #14532d; stroke: #4ade80; }
      .row-sim-highlight { fill: #16a34a; stroke: #86efac; }
      .arrow { stroke: #f87171; }
    }
  </style>

  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text class="title" x="470" y="30" text-anchor="middle">One matrix-multiply computes all M cosine similarities at once</text>
  <text class="caption" x="470" y="52" text-anchor="middle">All rows unit-length &nbsp;⇒&nbsp; the raw dot product IS cosine similarity</text>

  <g>
    <text class="lbl-dim" x="180" y="80" text-anchor="middle">D_norm</text>
    <text class="lbl-lbl" x="180" y="405" text-anchor="middle">(M × d)</text>
    <text class="lbl-lbl" x="180" y="422" text-anchor="middle">M docs, each row unit-length</text>

    <rect class="box" x="80" y="90" width="200" height="290"/>

    <rect class="row-doc" x="82"  y="93"  width="196" height="26"/>
    <rect class="row-doc" x="82"  y="121" width="196" height="26"/>
    <rect class="row-doc-highlight" x="82" y="149" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="177" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="205" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="233" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="261" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="289" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="317" width="196" height="26"/>
    <rect class="row-doc" x="82"  y="345" width="196" height="26"/>

    <text class="tick" x="92"  y="167" text-anchor="start">0.03</text>
    <text class="tick" x="140" y="167" text-anchor="middle">−0.12</text>
    <text class="tick" x="185" y="167" text-anchor="middle">0.44</text>
    <text class="tick" x="228" y="167" text-anchor="middle">···</text>
    <text class="tick" x="266" y="167" text-anchor="end">0.07</text>

    <line class="box" x1="82" y1="83" x2="278" y2="83" stroke="#64748b"/>
    <line class="box" x1="82" y1="79" x2="82"  y2="87" stroke="#64748b"/>
    <line class="box" x1="278" y1="79" x2="278" y2="87" stroke="#64748b"/>
    <text class="lbl-dim" x="180" y="76" text-anchor="middle">← d = 384 →</text>

    <line class="box" x1="72" y1="93" x2="72" y2="380" stroke="#64748b"/>
    <line class="box" x1="68" y1="93" x2="76" y2="93" stroke="#64748b"/>
    <line class="box" x1="68" y1="380" x2="76" y2="380" stroke="#64748b"/>
    <text class="lbl-dim" x="52" y="240" text-anchor="middle" transform="rotate(-90 52,240)">M = 10,000</text>

    <text class="lbl-lbl" x="180" y="163" text-anchor="middle" fill="#1e40af" font-weight="700">doc i (unit-length)</text>
  </g>

  <text class="title" x="325" y="240" text-anchor="middle" font-size="28">@</text>

  <g>
    <text class="lbl-dim" x="405" y="80" text-anchor="middle">q_norm</text>
    <text class="lbl-lbl" x="405" y="405" text-anchor="middle">(d,)</text>
    <text class="lbl-lbl" x="405" y="422" text-anchor="middle">query</text>

    <rect class="box" x="380" y="90" width="50" height="290"/>
    <rect class="col-q" x="382" y="93" width="46" height="284"/>

    <text class="tick" x="405" y="115" text-anchor="middle">0.11</text>
    <text class="tick" x="405" y="140" text-anchor="middle">−0.05</text>
    <text class="tick" x="405" y="165" text-anchor="middle">0.28</text>
    <text class="tick" x="405" y="190" text-anchor="middle">0.02</text>
    <text class="tick" x="405" y="215" text-anchor="middle">···</text>
    <text class="tick" x="405" y="240" text-anchor="middle">−0.19</text>
    <text class="tick" x="405" y="265" text-anchor="middle">0.06</text>
    <text class="tick" x="405" y="290" text-anchor="middle">···</text>
    <text class="tick" x="405" y="315" text-anchor="middle">−0.03</text>
    <text class="tick" x="405" y="340" text-anchor="middle">0.14</text>

    <line class="box" x1="440" y1="93" x2="440" y2="377" stroke="#64748b"/>
    <line class="box" x1="436" y1="93" x2="444" y2="93" stroke="#64748b"/>
    <line class="box" x1="436" y1="377" x2="444" y2="377" stroke="#64748b"/>
    <text class="lbl-dim" x="464" y="240" text-anchor="middle" transform="rotate(-90 464,240)">d = 384</text>
  </g>

  <text class="title" x="510" y="240" text-anchor="middle" font-size="28">=</text>

  <g>
    <text class="lbl-dim" x="600" y="80" text-anchor="middle">sims</text>
    <text class="lbl-lbl" x="600" y="405" text-anchor="middle">(M,)</text>
    <text class="lbl-lbl" x="600" y="422" text-anchor="middle">all M cosine similarities</text>

    <rect class="box" x="560" y="90" width="80" height="290"/>

    <rect class="row-sim" x="562"  y="93"  width="76" height="26"/>
    <rect class="row-sim" x="562"  y="121" width="76" height="26"/>
    <rect class="row-sim-highlight" x="562" y="149" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="177" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="205" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="233" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="261" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="289" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="317" width="76" height="26"/>
    <rect class="row-sim" x="562"  y="345" width="76" height="26"/>

    <text class="tick" x="600" y="110" text-anchor="middle">0.977</text>
    <text class="tick" x="600" y="138" text-anchor="middle">0.945</text>
    <text class="tick" x="600" y="167" text-anchor="middle" font-weight="700">0.743</text>
    <text class="tick" x="600" y="195" text-anchor="middle">0.021</text>
    <text class="tick" x="600" y="223" text-anchor="middle">−0.013</text>
    <text class="tick" x="600" y="251" text-anchor="middle">0.612</text>
    <text class="tick" x="600" y="279" text-anchor="middle">0.318</text>
    <text class="tick" x="600" y="307" text-anchor="middle">···</text>
    <text class="tick" x="600" y="335" text-anchor="middle">0.089</text>
    <text class="tick" x="600" y="363" text-anchor="middle">0.402</text>

    <line class="box" x1="550" y1="93" x2="550" y2="380" stroke="#64748b"/>
    <line class="box" x1="546" y1="93" x2="554" y2="93" stroke="#64748b"/>
    <line class="box" x1="546" y1="380" x2="554" y2="380" stroke="#64748b"/>
    <text class="lbl-dim" x="530" y="240" text-anchor="middle" transform="rotate(-90 530,240)">M = 10,000</text>
  </g>

  <g>
    <text class="lbl-lbl" x="750" y="112" text-anchor="start" font-style="italic">Each output entry is one dot product:</text>
    <text class="lbl-lbl" x="750" y="132" text-anchor="start">sims[i] = D_norm[i, :] · q_norm</text>
    <text class="lbl-lbl" x="750" y="152" text-anchor="start" font-weight="700">= cosine_similarity(doc i, query)</text>

    <path class="arrow" d="M 280 162 C 340 162, 340 240, 380 240" marker-end="url(#ah-red)"/>
    <path class="arrow" d="M 430 240 C 470 240, 470 162, 560 162" marker-end="url(#ah-red)"/>

    <text class="lbl-lbl" x="440" y="470" text-anchor="middle" fill="#dc2626" font-weight="700">
      row i · q_norm  →  sims[i]
    </text>
  </g>

  <rect class="box" x="60" y="440" width="820" height="60" rx="6" fill="rgba(148,163,184,0.08)"/>
  <text class="txt" x="470" y="465" text-anchor="middle" font-size="14" font-weight="700">
    (M × d) &nbsp;@&nbsp; (d,) &nbsp;=&nbsp; (M,)   —   one BLAS call, one shot, ~1000× faster than a Python loop
  </text>
  <text class="lbl-lbl" x="470" y="486" text-anchor="middle">
    All-pairs generalization: (M × d) @ (d × N) = (M × N)  — every doc vs every query in one matmul
  </text>
</svg>
