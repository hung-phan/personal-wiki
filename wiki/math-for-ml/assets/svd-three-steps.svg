<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <style>
    .ax     { stroke: #64748b; stroke-width: 1.2; }
    .grid   { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 4; }
    .shape-fill { fill: #94a3b8; opacity: 0.15; stroke: #64748b; stroke-width: 1.5; }
    .v1     { stroke: #dc2626; stroke-width: 3; fill: none; }
    .v2     { stroke: #2563eb; stroke-width: 3; fill: none; }
    .txt    { fill: #0f172a; }
    .title  { font-weight: 700; font-size: 15px; fill: #0f172a; }
    .sub    { font-size: 12px; fill: #475569; }
    .op     { font-weight: 700; font-size: 18px; fill: #0f172a; font-family: ui-monospace, Menlo, monospace; }
    .lbl-red  { fill: #b91c1c; font-weight: 700; }
    .lbl-blue { fill: #1d4ed8; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .shape-fill { fill: #64748b; opacity: 0.24; stroke: #cbd5e1; }
      .v1 { stroke: #f87171; }
      .v2 { stroke: #60a5fa; }
      .txt, .title, .op { fill: #e2e8f0; }
      .sub { fill: #cbd5e1; }
      .lbl-red { fill: #fca5a5; }
      .lbl-blue { fill: #93c5fd; }
    }
  </style>
  <defs>
    <marker id="m-red3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="m-blue3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-op" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <text class="title" x="480" y="24" text-anchor="middle">SVD = rotate  →  stretch  →  rotate.  Every matrix.</text>

  <!-- Panel 1: original circle, tilted v1, v2  (angle 30°) -->
  <g transform="translate(20,60)">
    <text class="title" x="90" y="14" text-anchor="middle">1. Start</text>
    <text class="sub"   x="90" y="30" text-anchor="middle">unit circle,  tilted axes</text>
    <line class="ax" x1="20" y1="130" x2="160" y2="130"/>
    <line class="ax" x1="90"  y1="60"  x2="90"  y2="200"/>
    <circle class="shape-fill" cx="90" cy="130" r="55"/>
    <!-- v1 at 30° from x-axis (screen y is flipped): dx=+47.6, dy=-27.5 -->
    <line class="v1" x1="90" y1="130" x2="137.6" y2="102.5" marker-end="url(#m-red3)"/>
    <!-- v2 perpendicular: at 120° from x-axis: dx=-27.5, dy=-47.6 -->
    <line class="v2" x1="90" y1="130" x2="62.5" y2="82.4" marker-end="url(#m-blue3)"/>
    <text class="lbl-red"  x="142" y="98">v₁</text>
    <text class="lbl-blue" x="52"  y="76">v₂</text>
  </g>

  <!-- Arrow V^T -->
  <g transform="translate(200,140)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#m-op)"/>
    <text class="op" x="15" y="-8" text-anchor="middle">Vᵀ</text>
    <text class="sub" x="15" y="20" text-anchor="middle">rotate</text>
  </g>

  <!-- Panel 2: rotated so v1 on x-axis, v2 on y-axis -->
  <g transform="translate(250,60)">
    <text class="title" x="90" y="14" text-anchor="middle">2. After Vᵀ</text>
    <text class="sub"   x="90" y="30" text-anchor="middle">circle unchanged;  axes align</text>
    <line class="ax" x1="20" y1="130" x2="160" y2="130"/>
    <line class="ax" x1="90"  y1="60"  x2="90"  y2="200"/>
    <circle class="shape-fill" cx="90" cy="130" r="55"/>
    <!-- v1 along +x -->
    <line class="v1" x1="90" y1="130" x2="145" y2="130" marker-end="url(#m-red3)"/>
    <!-- v2 along +y (screen -y) -->
    <line class="v2" x1="90" y1="130" x2="90" y2="75" marker-end="url(#m-blue3)"/>
    <text class="lbl-red"  x="150" y="126">v₁</text>
    <text class="lbl-blue" x="94"  y="72">v₂</text>
  </g>

  <!-- Arrow Σ -->
  <g transform="translate(430,140)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#m-op)"/>
    <text class="op" x="15" y="-8" text-anchor="middle">Σ</text>
    <text class="sub" x="15" y="20" text-anchor="middle">stretch</text>
  </g>

  <!-- Panel 3: axis-aligned ellipse, σ1 along x (bigger), σ2 along y (smaller) -->
  <g transform="translate(480,60)">
    <text class="title" x="90" y="14" text-anchor="middle">3. After Σ</text>
    <text class="sub"   x="90" y="30" text-anchor="middle">ellipse:  σ₁ · x-axis,  σ₂ · y-axis</text>
    <line class="ax" x1="10" y1="130" x2="170" y2="130"/>
    <line class="ax" x1="90"  y1="60"  x2="90"  y2="200"/>
    <ellipse class="shape-fill" cx="90" cy="130" rx="75" ry="35"/>
    <line class="v1" x1="90" y1="130" x2="165" y2="130" marker-end="url(#m-red3)"/>
    <line class="v2" x1="90" y1="130" x2="90" y2="95"  marker-end="url(#m-blue3)"/>
    <text class="lbl-red"  x="170" y="126">σ₁</text>
    <text class="lbl-blue" x="94"  y="90">σ₂</text>
  </g>

  <!-- Arrow U -->
  <g transform="translate(670,140)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#m-op)"/>
    <text class="op" x="15" y="-8" text-anchor="middle">U</text>
    <text class="sub" x="15" y="20" text-anchor="middle">rotate</text>
  </g>

  <!-- Panel 4: rotated ellipse; axes labeled u1, u2 -->
  <g transform="translate(720,60)">
    <text class="title" x="105" y="14" text-anchor="middle">4. After U</text>
    <text class="sub"   x="105" y="30" text-anchor="middle">final: rotated ellipse (= A · unit circle)</text>
    <line class="ax" x1="20" y1="130" x2="190" y2="130"/>
    <line class="ax" x1="105" y1="60"  x2="105" y2="200"/>
    <!-- ellipse rotated by -40° -->
    <ellipse class="shape-fill" cx="105" cy="130" rx="75" ry="35" transform="rotate(-40 105 130)"/>
    <!-- u1 rotated by -40°: (cos(-40), sin(-40)) = (0.766, -0.643) → screen (+0.766, +0.643) after y-flip inversion.
         Actually screen: base (x,y_math); screen_y = 130 - y_math*scale.  y_math=+sinθ, so if θ negative (below x-axis in math space), point goes below on screen. We want the ellipse tilted "upper-right pointing", so let's use math angle +40°: (0.766, 0.643).  screen: (105+0.766·75, 130-0.643·75) = (162.5, 81.8) -->
    <line class="v1" x1="105" y1="130" x2="162" y2="82" marker-end="url(#m-red3)"/>
    <!-- u2 perpendicular: (-sinθ, cosθ) = (-0.643, 0.766). screen: (105-0.643·35, 130-0.766·35) = (82.5, 103.2) -->
    <line class="v2" x1="105" y1="130" x2="82" y2="103" marker-end="url(#m-blue3)"/>
    <text class="lbl-red"  x="167" y="79">u₁</text>
    <text class="lbl-blue" x="65"  y="99">u₂</text>
  </g>

  <text class="sub" x="480" y="320" text-anchor="middle">A · v₁ = σ₁ u₁,   A · v₂ = σ₂ u₂  —  the SVD is exactly this three-step choreography.</text>
</svg>
