<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <style>
    .ax      { stroke: #64748b; stroke-width: 1.5; }
    .contour { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    .sgd     { stroke: #2563eb; stroke-width: 2.5; fill: none; }
    .mom     { stroke: #059669; stroke-width: 2.5; fill: none; }
    .rms     { stroke: #ea580c; stroke-width: 2.5; fill: none; }
    .adam    { stroke: #dc2626; stroke-width: 2.5; fill: none; }
    .dot     { fill: #0f172a; }
    .goal    { fill: #f59e0b; stroke: #78350f; stroke-width: 1; }
    .tick    { fill: #475569; font-size: 12px; }
    .title   { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .txt     { fill: #0f172a; }
    .caption { fill: #475569; font-size: 13px; font-style: italic; }
    .legend-box { fill: rgba(255,255,255,0.92); stroke: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      .ax      { stroke: #94a3b8; }
      .contour { stroke: #475569; }
      .sgd     { stroke: #60a5fa; }
      .mom     { stroke: #6ee7b7; }
      .rms     { stroke: #fdba74; }
      .adam    { stroke: #f87171; }
      .dot     { fill: #e2e8f0; }
      .goal    { fill: #fbbf24; }
      .tick, .caption { fill: #cbd5e1; }
      .title, .txt { fill: #e2e8f0; }
      .legend-box { fill: rgba(15,23,42,0.85); stroke: #475569; }
    }
  </style>

  <text class="title" x="390" y="28" text-anchor="middle">Optimizer trajectories on an ill-conditioned bowl</text>

  <!-- Ill-conditioned ellipses centered at (390, 250). Long axis horizontal (rx=5x ry). -->
  <ellipse class="contour" cx="390" cy="250" rx="60"  ry="12"/>
  <ellipse class="contour" cx="390" cy="250" rx="130" ry="26"/>
  <ellipse class="contour" cx="390" cy="250" rx="200" ry="40"/>
  <ellipse class="contour" cx="390" cy="250" rx="270" ry="54"/>
  <ellipse class="contour" cx="390" cy="250" rx="340" ry="68"/>

  <!-- Goal (minimum) -->
  <circle class="goal" cx="390" cy="250" r="6"/>
  <text class="tick" x="400" y="245">min</text>

  <!-- Start point at (80, 180) - upper left, far from min, off the narrow axis -->
  <circle class="dot" cx="80" cy="180" r="5"/>
  <text class="txt" x="72" y="170">start</text>

  <!-- === SGD: zigzags heavily across the narrow (vertical) axis === -->
  <!-- Big vertical bounces (steep direction has biggest gradient); slow horizontal progress -->
  <path class="sgd" d="
    M 80 180
    L 100 320
    L 120 195
    L 145 305
    L 175 205
    L 210 295
    L 245 215
    L 280 285
    L 315 225
    L 345 275
    L 370 240
    L 385 258
    L 390 250
  "/>

  <!-- === SGD + momentum: dampened oscillation, slight overshoot === -->
  <path class="mom" d="
    M 80 180
    Q 130 260 200 265
    Q 270 268 340 255
    Q 380 250 420 253
    Q 440 254 390 250
  "/>

  <!-- === RMSProp: bigger steps along the flat axis, small along the narrow one === -->
  <!-- Nearly straight but small wiggle vertically -->
  <path class="rms" d="
    M 80 180
    Q 130 220 180 235
    Q 240 250 300 250
    Q 350 250 390 250
  "/>

  <!-- === Adam: smooth and direct === -->
  <path class="adam" d="
    M 80 180
    Q 180 225 280 245
    Q 340 252 390 250
  "/>

  <!-- End dots -->
  <circle class="sgd"  cx="390" cy="250" r="3" fill="#2563eb"/>
  <circle class="adam" cx="390" cy="250" r="3" fill="#dc2626"/>

  <!-- Axes / label -->
  <line class="ax" x1="40"  y1="440" x2="740" y2="440"/>
  <line class="ax" x1="390" y1="60"  x2="390" y2="445"/>
  <text class="tick" x="745" y="445">flat axis (small curvature)</text>
  <text class="tick" x="395" y="60">steep axis (large curvature)</text>

  <!-- Legend -->
  <rect class="legend-box" x="530" y="70" width="215" height="110" rx="6"/>
  <line class="sgd"  x1="545" y1="90"  x2="580" y2="90"/>
  <text class="txt" x="590" y="94">SGD (zigzags)</text>
  <line class="mom"  x1="545" y1="112" x2="580" y2="112"/>
  <text class="txt" x="590" y="116">SGD + momentum</text>
  <line class="rms"  x1="545" y1="134" x2="580" y2="134"/>
  <text class="txt" x="590" y="138">RMSProp</text>
  <line class="adam" x1="545" y1="156" x2="580" y2="156"/>
  <text class="txt" x="590" y="160">Adam (smooth &amp; direct)</text>

  <!-- Caption -->
  <text class="caption" x="390" y="465" text-anchor="middle">Per-parameter learning rates and momentum shine on ill-conditioned surfaces.</text>
</svg>
