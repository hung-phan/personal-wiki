<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <style>
    .ax     { stroke: #64748b; stroke-width: 1.5; }
    .grid   { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 4; }
    .mean   { stroke: #059669; stroke-width: 2; stroke-dasharray: 6 4; }
    .pt     { fill: #0f172a; }
    .bar1   { fill: #2563eb; opacity: 0.75; }
    .bar2   { fill: #dc2626; opacity: 0.75; }
    .outlier{ fill: #f97316; stroke: #9a3412; stroke-width: 1; }
    .txt    { fill: #0f172a; }
    .tick   { fill: #475569; font-size: 12px; }
    .title  { font-weight: 700; font-size: 17px; fill: #0f172a; }
    .subttl { font-weight: 700; font-size: 15px; fill: #0f172a; }
    .note   { fill: #475569; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .mean { stroke: #6ee7b7; }
      .pt { fill: #e2e8f0; }
      .bar1 { fill: #60a5fa; }
      .bar2 { fill: #f87171; }
      .outlier { fill: #fb923c; stroke: #fdba74; }
      .txt, .title, .subttl { fill: #e2e8f0; }
      .tick, .note { fill: #cbd5e1; }
    }
  </style>

  <text class="title" x="450" y="26" text-anchor="middle">|deviation|  vs.  (deviation)²  —  why variance panics at outliers</text>

  <!--
    Data: 8 points around mean=5.
    x_i:   3, 4, 4.5, 5, 5.5, 6, 7, 14   (last is the outlier, ~4σ out if σ≈1)
    deviations (x - 5):  −2, −1, −0.5, 0, 0.5, 1, 2, 9
    |dev|:   2, 1, 0.5, 0, 0.5, 1, 2, 9
    (dev)²:  4, 1, 0.25, 0, 0.25, 1, 4, 81
  -->

  <!-- ============ LEFT PANEL: |deviation| ============ -->
  <g>
    <text class="subttl" x="220" y="60" text-anchor="middle">Left: |x − μ|  (MAD — the honest average deviation)</text>

    <!-- y axis in left panel: baseline at y=380, top at y=100 → 280 px for max value ~10 -->
    <!-- Scale: 25 px per unit -->
    <line class="ax" x1="60" y1="380" x2="440" y2="380"/>
    <line class="ax" x1="60" y1="90"  x2="60"  y2="385"/>

    <!-- y-ticks 0, 2, 4, 6, 8, 10 -->
    <line class="grid" x1="60" y1="330" x2="440" y2="330"/><text class="tick" x="55" y="334" text-anchor="end">2</text>
    <line class="grid" x1="60" y1="280" x2="440" y2="280"/><text class="tick" x="55" y="284" text-anchor="end">4</text>
    <line class="grid" x1="60" y1="230" x2="440" y2="230"/><text class="tick" x="55" y="234" text-anchor="end">6</text>
    <line class="grid" x1="60" y1="180" x2="440" y2="180"/><text class="tick" x="55" y="184" text-anchor="end">8</text>
    <line class="grid" x1="60" y1="130" x2="440" y2="130"/><text class="tick" x="55" y="134" text-anchor="end">10</text>
    <text class="tick" x="55" y="384" text-anchor="end">0</text>
    <text class="tick" x="30" y="240" text-anchor="middle" transform="rotate(-90 30,240)">|deviation|</text>

    <!-- Mean line -->
    <line class="mean" x1="60" y1="380" x2="440" y2="380"/>

    <!-- Point 1: x=3, |dev|=2 → bar height 50 -->
    <rect class="bar1" x="87" y="330" width="12" height="50"/>
    <circle class="pt" cx="93" cy="380" r="3"/>
    <!-- Point 2: x=4, |dev|=1 → bar height 25 -->
    <rect class="bar1" x="127" y="355" width="12" height="25"/>
    <circle class="pt" cx="133" cy="380" r="3"/>
    <!-- Point 3: x=4.5, |dev|=0.5 → bar height 12.5 -->
    <rect class="bar1" x="147" y="367" width="12" height="13"/>
    <circle class="pt" cx="153" cy="380" r="3"/>
    <!-- Point 4: x=5 (=mean), |dev|=0 -->
    <rect class="bar1" x="167" y="378" width="12" height="2"/>
    <circle class="pt" cx="173" cy="380" r="3"/>
    <!-- Point 5: x=5.5, |dev|=0.5 -->
    <rect class="bar1" x="187" y="367" width="12" height="13"/>
    <circle class="pt" cx="193" cy="380" r="3"/>
    <!-- Point 6: x=6, |dev|=1 -->
    <rect class="bar1" x="207" y="355" width="12" height="25"/>
    <circle class="pt" cx="213" cy="380" r="3"/>
    <!-- Point 7: x=7, |dev|=2 -->
    <rect class="bar1" x="247" y="330" width="12" height="50"/>
    <circle class="pt" cx="253" cy="380" r="3"/>
    <!-- Point 8 (outlier): x=14, |dev|=9 → bar height 225 -->
    <rect class="outlier" x="393" y="155" width="12" height="225"/>
    <circle class="outlier" cx="399" cy="380" r="4"/>

    <!-- x-axis labels -->
    <text class="tick" x="93"  y="398" text-anchor="middle">3</text>
    <text class="tick" x="133" y="398" text-anchor="middle">4</text>
    <text class="tick" x="173" y="398" text-anchor="middle">5</text>
    <text class="tick" x="213" y="398" text-anchor="middle">6</text>
    <text class="tick" x="253" y="398" text-anchor="middle">7</text>
    <text class="tick" x="399" y="398" text-anchor="middle">14</text>
    <text class="tick" x="250" y="416" text-anchor="middle">x  (μ = 5, shown as green dashed baseline)</text>

    <!-- Callouts -->
    <text class="note" x="93"  y="322" text-anchor="middle">2</text>
    <text class="note" x="253" y="322" text-anchor="middle">2</text>
    <text class="note" x="399" y="147" text-anchor="middle">9</text>
    <text class="note" x="399" y="130" text-anchor="middle">outlier's bar</text>
    <text class="note" x="399" y="115" text-anchor="middle">4.5× a normal one</text>
  </g>

  <!-- ============ RIGHT PANEL: (deviation)² ============ -->
  <g>
    <text class="subttl" x="680" y="60" text-anchor="middle">Right: (x − μ)²  (variance — squared)</text>

    <!-- y axis: baseline y=380, top y=100, 280 px for max value ~100 -->
    <!-- Scale: 2.8 px per unit (so 81 → 226.8 px) -->
    <line class="ax" x1="520" y1="380" x2="880" y2="380"/>
    <line class="ax" x1="520" y1="90"  x2="520" y2="385"/>

    <!-- y-ticks 0, 20, 40, 60, 80, 100 -->
    <line class="grid" x1="520" y1="324" x2="880" y2="324"/><text class="tick" x="515" y="328" text-anchor="end">20</text>
    <line class="grid" x1="520" y1="268" x2="880" y2="268"/><text class="tick" x="515" y="272" text-anchor="end">40</text>
    <line class="grid" x1="520" y1="212" x2="880" y2="212"/><text class="tick" x="515" y="216" text-anchor="end">60</text>
    <line class="grid" x1="520" y1="156" x2="880" y2="156"/><text class="tick" x="515" y="160" text-anchor="end">80</text>
    <line class="grid" x1="520" y1="100" x2="880" y2="100"/><text class="tick" x="515" y="104" text-anchor="end">100</text>
    <text class="tick" x="515" y="384" text-anchor="end">0</text>
    <text class="tick" x="490" y="240" text-anchor="middle" transform="rotate(-90 490,240)">(deviation)²</text>

    <line class="mean" x1="520" y1="380" x2="880" y2="380"/>

    <!-- Point 1: (dev)²=4 → 11.2 px -->
    <rect class="bar2" x="547" y="369" width="12" height="11"/>
    <circle class="pt" cx="553" cy="380" r="3"/>
    <!-- Point 2: (dev)²=1 → 2.8 px -->
    <rect class="bar2" x="587" y="377" width="12" height="3"/>
    <circle class="pt" cx="593" cy="380" r="3"/>
    <!-- Point 3: 0.25 → 0.7 px -->
    <rect class="bar2" x="607" y="379" width="12" height="1"/>
    <circle class="pt" cx="613" cy="380" r="3"/>
    <!-- Point 4: 0 -->
    <circle class="pt" cx="633" cy="380" r="3"/>
    <!-- Point 5: 0.25 -->
    <rect class="bar2" x="647" y="379" width="12" height="1"/>
    <circle class="pt" cx="653" cy="380" r="3"/>
    <!-- Point 6: 1 -->
    <rect class="bar2" x="667" y="377" width="12" height="3"/>
    <circle class="pt" cx="673" cy="380" r="3"/>
    <!-- Point 7: 4 -->
    <rect class="bar2" x="707" y="369" width="12" height="11"/>
    <circle class="pt" cx="713" cy="380" r="3"/>
    <!-- Point 8 (outlier): 81 → 226.8 px, top at y ≈ 153 -->
    <rect class="outlier" x="853" y="153" width="12" height="227"/>
    <circle class="outlier" cx="859" cy="380" r="4"/>

    <!-- x-axis labels -->
    <text class="tick" x="553" y="398" text-anchor="middle">3</text>
    <text class="tick" x="593" y="398" text-anchor="middle">4</text>
    <text class="tick" x="633" y="398" text-anchor="middle">5</text>
    <text class="tick" x="673" y="398" text-anchor="middle">6</text>
    <text class="tick" x="713" y="398" text-anchor="middle">7</text>
    <text class="tick" x="859" y="398" text-anchor="middle">14</text>
    <text class="tick" x="700" y="416" text-anchor="middle">x  (same points as left)</text>

    <text class="note" x="553" y="361" text-anchor="middle">4</text>
    <text class="note" x="713" y="361" text-anchor="middle">4</text>
    <text class="note" x="859" y="145" text-anchor="middle">81</text>
    <text class="note" x="859" y="128" text-anchor="middle">outlier's bar</text>
    <text class="note" x="859" y="113" text-anchor="middle">20× a normal one</text>
  </g>

  <!-- Bottom caption -->
  <text class="note" x="450" y="446" text-anchor="middle">Same eight points, same outlier.  On the left it's 4.5× a typical bar.  On the right, squaring blows it up to 20×.  That's why MSE — an average of squared bars — is dominated by outliers.</text>
</svg>
