t-anchor="start" >“cat” = ID 5231 → take row 5231.</text><text x="30" y="428" class="handk" text-anchor="start" >An embedding lookup is just indexing.</text><text x="560" y="104" class="h2" text-anchor="start" >3. add position</text><text x="618" y="128" class="ink" text-anchor="middle" >The</text><text x="618" y="144" class="hand" text-anchor="middle" >pos 0</text><rect x="600" y="152" width="36" height="62" rx="3" class="pur"/><text x="618" y="188" class="ink" text-anchor="middle" >…</text><text x="618" y="234" class="h2" text-anchor="middle" >+</text><rect x="600" y="242" width="36" height="62" rx="3" class="grn"/><text x="618" y="278" class="ink" text-anchor="middle" >…</text><text x="618" y="324" class="h2" text-anchor="middle" >=</text><rect x="600" y="332" width="36" height="62" rx="3" class="yel"/><text x="618" y="368" class="ink" text-anchor="middle" >…</text><text x="674" y="128" class="ink" text-anchor="middle" >cat</text><text x="674" y="144" class="hand" text-anchor="middle" >pos 1</text><rect x="656" y="152" width="36" height="62" rx="3" class="pur"/><text x="674" y="188" class="ink" text-anchor="middle" >…</text><text x="674" y="234" class="h2" text-anchor="middle" >+</text><rect x="656" y="242" width="36" height="62" rx="3" class="grn"/><text x="674" y="278" class="ink" text-anchor="middle" >…</text><text x="674" y="324" class="h2" text-anchor="middle" >=</text><rect x="656" y="332" width="36" height="62" rx="3" class="yel"/><text x="674" y="368" class="ink" text-anchor="middle" >…</text><text x="730" y="128" class="ink" text-anchor="middle" >sat</text><text x="730" y="144" class="hand" text-anchor="middle" >pos 2</text><rect x="712" y="152" width="36" height="62" rx="3" class="pur"/><text x="730" y="188" class="ink" text-anchor="middle" >…</text><text x="730" y="234" class="h2" text-anchor="middle" >+</text><rect x="712" y="242" width="36" height="62" rx="3" class="grn"/><text x="730" y="278" class="ink" text-anchor="middle" >…</text><text x="730" y="324" class="h2" text-anchor="middle" >=</text><rect x="712" y="332" width="36" height="62" rx="3" class="yel"/><text x="730" y="368" class="ink" text-anchor="middle" >…</text><text x="786" y="128" class="ink" text-anchor="middle" >on</text><text x="786" y="144" class="hand" text-anchor="middle" >pos 3</text><rect x="768" y="152" width="36" height="62" rx="3" class="pur"/><text x="786" y="188" class="ink" text-anchor="middle" >…</text><text x="786" y="234" class="h2" text-anchor="middle" >+</text><rect x="768" y="242" width="36" height="62" rx="3" class="grn"/><text x="786" y="278" class="ink" text-anchor="middle" >…</text><text x="786" y="324" class="h2" text-anchor="middle" >=</text><rect x="768" y="332" width="36" height="62" rx="3" class="yel"/><text x="786" y="368" class="ink" text-anchor="middle" >…</text><text x="842" y="128" class="ink" text-anchor="middle" >the</text><text x="842" y="144" class="hand" text-anchor="middle" >pos 4</text><rect x="824" y="152" width="36" height="62" rx="3" class="pur"/><text x="842" y="188" class="ink" text-anchor="middle" >…</text><text x="842" y="234" class="h2" text-anchor="middle" >+</text><rect x="824" y="242" width="36" height="62" rx="3" class="grn"/><text x="842" y="278" class="ink" text-anchor="middle" >…</text><text x="842" y="324" class="h2" text-anchor="middle" >=</text><rect x="824" y="332" width="36" height="62" rx="3" class="yel"/><text x="842" y="368" class="ink" text-anchor="middle" >…</text><text x="898" y="128" class="ink" text-anchor="middle" >mat</text><text x="898" y="144" class="hand" text-anchor="middle" >pos 5</text><rect x="880" y="152" width="36" height="62" rx="3" class="pur"/><text x="898" y="188" class="ink" text-anchor="middle" >…</text><text x="898" y="234" class="h2" text-anchor="middle" >+</text><rect x="880" y="242" width="36" height="62" rx="3" class="grn"/><text x="898" y="278" class="ink" text-anchor="middle" >…</text><text x="898" y="324" class="h2" text-anchor="middle" >=</text><rect x="880" y="332" width="36" height="62" rx="3" class="yel"/><text x="898" y="368" class="ink" text-anchor="middle" >…</text><text x="590" y="178" class="ink" text-anchor="end" >word</text><text x="590" y="194" class="mut" text-anchor="end" >(what)</text><text x="590" y="268" class="ink" text-anchor="end" >position</text><text x="590" y="284" class="mut" text-anchor="end" >(where)</text><text x="590" y="358" class="ink" text-anchor="end" >input row</text><text x="590" y="374" class="mut" text-anchor="end" >(both)</text><text x="770" y="418" class="h2" text-anchor="middle" >X = W_E[ids] + W_P[0..5]   →   6 × 512</text><text x="770" y="436" class="mut" text-anchor="middle" >GPT-2/3 learn W_P; the 2017 paper used sin/cos</text><rect x="30" y="460" width="900" height="80" rx="6" class="note"/><text x="44" y="482" class="h2" text-anchor="start" >Key idea</text><text x="44" y="502" class="hand" text-anchor="start" >Meaning comes from WHICH row you pick. Order comes from the vector you ADD.</text><text x="44" y="520" class="hand" text-anchor="start" >From here on the model only ever sees a table: one row of 512 numbers per token.</text></svg>
