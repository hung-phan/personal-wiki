<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >STAGE A · STEPS 1–3</text><text x="30" y="62" class="h1" text-anchor="start" >Text → a 6 × 512 table</text><line x1="30" y1="72" x2="360" y2="72" class="uline"/><text x="30" y="104" class="h2" text-anchor="start" >1. tokenize</text><rect x="150" y="90" width="56" height="30" rx="0" class="cell"/><text x="178" y="110" class="ink" text-anchor="middle" >The</text><line x1="178" y1="121" x2="178" y2="137" class="ln" marker-end="url(#ar)"/><text x="178" y="152" class="hand" text-anchor="middle" >464</text><rect x="206" y="90" width="56" height="30" rx="0" class="cell"/><text x="234" y="110" class="ink" text-anchor="middle" >cat</text><line x1="234" y1="121" x2="234" y2="137" class="ln" marker-end="url(#ar)"/><text x="234" y="152" class="hand" text-anchor="middle" >5231</text><rect x="262" y="90" width="56" height="30" rx="0" class="cell"/><text x="290" y="110" class="ink" text-anchor="middle" >sat</text><line x1="290" y1="121" x2="290" y2="137" class="ln" marker-end="url(#ar)"/><text x="290" y="152" class="hand" text-anchor="middle" >327</text><rect x="318" y="90" width="56" height="30" rx="0" class="cell"/><text x="346" y="110" class="ink" text-anchor="middle" >on</text><line x1="346" y1="121" x2="346" y2="137" class="ln" marker-end="url(#ar)"/><text x="346" y="152" class="hand" text-anchor="middle" >319</text><rect x="374" y="90" width="56" height="30" rx="0" class="cell"/><text x="402" y="110" class="ink" text-anchor="middle" >the</text><line x1="402" y1="121" x2="402" y2="137" class="ln" marker-end="url(#ar)"/><text x="402" y="152" class="hand" text-anchor="middle" >279</text><rect x="430" y="90" width="56" height="30" rx="0" class="cell"/><text x="458" y="110" class="ink" text-anchor="middle" >mat</text><line x1="458" y1="121" x2="458" y2="137" class="ln" marker-end="url(#ar)"/><text x="458" y="152" class="hand" text-anchor="middle" >7724</text><text x