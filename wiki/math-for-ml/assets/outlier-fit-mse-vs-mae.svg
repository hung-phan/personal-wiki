<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <style>
    .ax    { stroke: #64748b; stroke-width: 1.5; }
    .grid  { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 4; }
    .mse   { stroke: #2563eb; stroke-width: 3; fill: none; }
    .mae   { stroke: #dc2626; stroke-width: 3; fill: none; }
    .pt    { fill: #0f172a; stroke: #0f172a; }
    .outlier { fill: #f97316; stroke: #7c2d12; stroke-width: 1.5; }
    .txt   { fill: #0f172a; }
    .tick  { fill: #475569; font-size: 12px; }
    .title { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .note  { fill: #475569; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .mse { stroke: #60a5fa; }
      .mae { stroke: #f87171; }
      .pt { fill: #e2e8f0; stroke: #e2e8f0; }
      .outlier { fill: #fb923c; stroke: #fed7aa; }
      .txt, .title { fill: #e2e8f0; }
      .tick, .note { fill: #cbd5e1; }
    }
  </style>

  <text class="title" x="360" y="30" text-anchor="middle">One outlier bends the MSE line; MAE ignores it</text>

  <line class="ax" x1="60" y1="340" x2="660" y2="340"/>
  <line class="ax" x1="60" y1="60"  x2="60"  y2="345"/>

  <g>
    <line class="grid" x1="150" y1="60" x2="150" y2="340"/>
    <text class="tick" x="150" y="358" text-anchor="middle">1</text>
    <line class="grid" x1="240" y1="60" x2="240" y2="340"/>
    <text class="tick" x="240" y="358" text-anchor="middle">2</text>
    <line class="grid" x1="330" y1="60" x2="330" y2="340"/>
    <text class="tick" x="330" y="358" text-anchor="middle">3</text>
    <line class="grid" x1="420" y1="60" x2="420" y2="340"/>
    <text class="tick" x="420" y="358" text-anchor="middle">4</text>
    <line class="grid" x1="510" y1="60" x2="510" y2="340"/>
    <text class="tick" x="510" y="358" text-anchor="middle">5</text>
    <line class="grid" x1="600" y1="60" x2="600" y2="340"/>
    <text class="tick" x="600" y="358" text-anchor="middle">6</text>
    <text class="tick" x="60"  y="358" text-anchor="middle">0</text>
  </g>
  <text class="tick" x="360" y="378" text-anchor="middle">x</text>

  <g>
    <line class="grid" x1="60" y1="280" x2="660" y2="280"/>
    <text class="tick" x="55" y="284" text-anchor="end">2</text>
    <line class="grid" x1="60" y1="220" x2="660" y2="220"/>
    <text class="tick" x="55" y="224" text-anchor="end">4</text>
    <line class="grid" x1="60" y1="160" x2="660" y2="160"/>
    <text class="tick" x="55" y="164" text-anchor="end">6</text>
    <line class="grid" x1="60" y1="100" x2="660" y2="100"/>
    <text class="tick" x="55" y="104" text-anchor="end">8</text>
    <text class="tick" x="55" y="344" text-anchor="end">0</text>
  </g>
  <text class="tick" x="30" y="200" text-anchor="middle" transform="rotate(-90 30,200)">y</text>

  <circle class="pt" cx="150" cy="280"   r="6"/>
  <circle class="pt" cx="240" cy="274"   r="6"/>
  <circle class="pt" cx="330" cy="283"   r="6"/>
  <circle class="pt" cx="420" cy="277"   r="6"/>

  <circle class="outlier" cx="510" cy="100"  r="8"/>
  <text class="note" x="524" y="98">outlier (bad reading)</text>

  <line class="mse" x1="60" y1="310" x2="660" y2="94"/>
  <text class="txt" x="620" y="120" text-anchor="end" fill="#1d4ed8">MSE fit  → tilts up</text>

  <line class="mae" x1="60" y1="278" x2="660" y2="278"/>
  <text class="txt" x="620" y="270" text-anchor="end" fill="#b91c1c">MAE fit  → ignores outlier</text>
</svg>
