<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <style>
    .ax     { stroke: #64748b; stroke-width: 1.5; }
    .grid   { stroke: #cbd5e1; stroke-width: 1; }
    .square { fill: #94a3b8; opacity: 0.18; stroke: #475569; stroke-width: 1.5; }
    .e1     { stroke: #dc2626; stroke-width: 3; fill: none; }
    .e2     { stroke: #2563eb; stroke-width: 3; fill: none; }
    .xpt    { fill: #f97316; stroke: #7c2d12; stroke-width: 1.5; }
    .xlbl   { fill: #b45309; font-weight: 600; }
    .txt    { fill: #0f172a; }
    .title  { font-weight: 700; font-size: 16px; fill: #0f172a; }
    .sub    { font-size: 12px; fill: #475569; }
    .eq     { font-size: 15px; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tick   { fill: #475569; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #94a3b8; }
      .grid { stroke: #475569; }
      .square { fill: #64748b; opacity: 0.28; stroke: #cbd5e1; }
      .e1 { stroke: #f87171; }
      .e2 { stroke: #60a5fa; }
      .xpt { fill: #fb923c; stroke: #fed7aa; }
      .xlbl { fill: #fdba74; }
      .txt, .title, .eq { fill: #e2e8f0; }
      .sub, .tick { fill: #cbd5e1; }
    }
  </style>

  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar-red-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <text class="title" x="450" y="24" text-anchor="middle">A matrix is a function — columns tell you where the basis vectors land</text>

  <!-- ============ LEFT: Before A ============ -->
  <g transform="translate(30,50)">
    <text class="title" x="200" y="16" text-anchor="middle">Before  (input space)</text>

    <!-- grid: 50 px per unit. origin at (200,220). Show -2..4 x, -2..2 y. -->
    <!-- vertical grid lines -->
    <line class="grid" x1="100" y1="20"  x2="100" y2="320"/>
    <line class="grid" x1="150" y1="20"  x2="150" y2="320"/>
    <line class="grid" x1="200" y1="20"  x2="200" y2="320"/>
    <line class="grid" x1="250" y1="20"  x2="250" y2="320"/>
    <line class="grid" x1="300" y1="20"  x2="300" y2="320"/>
    <line class="grid" x1="350" y1="20"  x2="350" y2="320"/>
    <!-- horizontal -->
    <line class="grid" x1="50"  y1="70"  x2="400" y2="70"/>
    <line class="grid" x1="50"  y1="120" x2="400" y2="120"/>
    <line class="grid" x1="50"  y1="170" x2="400" y2="170"/>
    <line class="grid" x1="50"  y1="220" x2="400" y2="220"/>
    <line class="grid" x1="50"  y1="270" x2="400" y2="270"/>
    <line class="grid" x1="50"  y1="320" x2="400" y2="320"/>

    <!-- axes -->
    <line class="ax" x1="50"  y1="220" x2="400" y2="220"/>
    <line class="ax" x1="200" y1="20"  x2="200" y2="330"/>

    <!-- unit square -->
    <rect class="square" x="200" y="170" width="50" height="50"/>

    <!-- basis vectors: e1=(1,0)→(250,220); e2=(0,1)→(200,170) -->
    <line class="e1" x1="200" y1="220" x2="248" y2="220" marker-end="url(#ar-red)"/>
    <line class="e2" x1="200" y1="220" x2="200" y2="172" marker-end="url(#ar-blue)"/>
    <text class="txt" x="256" y="215" fill="#dc2626" font-weight="700">e₁ = (1,0)</text>
    <text class="txt" x="205" y="165" fill="#2563eb" font-weight="700">e₂ = (0,1)</text>

    <!-- point x = (1.5, 0.5) → (275, 195) -->
    <line stroke="#f97316" stroke-width="2" stroke-dasharray="4 3" x1="200" y1="220" x2="275" y2="195"/>
    <circle class="xpt" cx="275" cy="195" r="5"/>
    <text class="xlbl" x="282" y="192">x = 1.5·e₁ + 0.5·e₂</text>

    <text class="tick" x="245" y="235">1</text>
    <text class="tick" x="295" y="235">2</text>
    <text class="tick" x="345" y="235">3</text>
    <text class="tick" x="210" y="170">1</text>
    <text class="tick" x="210" y="120">2</text>
  </g>

  <!-- Arrow between panels: apply A -->
  <g transform="translate(430,220)">
    <path d="M 0 0 L 40 0" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#ar-red-dark)"/>
    <text class="eq" x="20" y="-8" text-anchor="middle">A</text>
    <text class="sub" x="20" y="20" text-anchor="middle">A = [[2, 1],</text>
    <text class="sub" x="20" y="32" text-anchor="middle">     [0, 1]]</text>
  </g>

  <!-- ============ RIGHT: After A ============ -->
  <g transform="translate(480,50)">
    <text class="title" x="200" y="16" text-anchor="middle">After A  (output space)</text>

    <!-- grid (same scale) -->
    <line class="grid" x1="100" y1="20"  x2="100" y2="320"/>
    <line class="grid" x1="150" y1="20"  x2="150" y2="320"/>
    <line class="grid" x1="200" y1="20"  x2="200" y2="320"/>
    <line class="grid" x1="250" y1="20"  x2="250" y2="320"/>
    <line class="grid" x1="300" y1="20"  x2="300" y2="320"/>
    <line class="grid" x1="350" y1="20"  x2="350" y2="320"/>
    <line class="grid" x1="50"  y1="70"  x2="400" y2="70"/>
    <line class="grid" x1="50"  y1="120" x2="400" y2="120"/>
    <line class="grid" x1="50"  y1="170" x2="400" y2="170"/>
    <line class="grid" x1="50"  y1="220" x2="400" y2="220"/>
    <line class="grid" x1="50"  y1="270" x2="400" y2="270"/>
    <line class="grid" x1="50"  y1="320" x2="400" y2="320"/>

    <line class="ax" x1="50"  y1="220" x2="400" y2="220"/>
    <line class="ax" x1="200" y1="20"  x2="200" y2="330"/>

    <!-- parallelogram: origin(200,220), a1=A e1=(2,0)→(300,220), a2=A e2=(1,1)→(250,170), tip=(350,170) -->
    <polygon class="square" points="200,220 300,220 350,170 250,170"/>

    <!-- transformed basis -->
    <line class="e1" x1="200" y1="220" x2="298" y2="220" marker-end="url(#ar-red)"/>
    <line class="e2" x1="200" y1="220" x2="248" y2="172" marker-end="url(#ar-blue)"/>
    <text class="txt" x="304" y="215" fill="#dc2626" font-weight="700">a₁ = A·e₁ = (2,0)</text>
    <text class="txt" x="252" y="165" fill="#2563eb" font-weight="700">a₂ = A·e₂ = (1,1)</text>
    <text class="sub" x="205" y="257">columns of A</text>

    <!-- image of x: A x = 1.5*(2,0) + 0.5*(1,1) = (3.5, 0.5) → (375, 195) -->
    <line stroke="#f97316" stroke-width="2" stroke-dasharray="4 3" x1="200" y1="220" x2="375" y2="195"/>
    <circle class="xpt" cx="375" cy="195" r="5"/>
    <text class="xlbl" x="290" y="188">Ax = 1.5·a₁ + 0.5·a₂</text>
    <text class="xlbl" x="290" y="202">    = (3.5, 0.5)</text>

    <text class="tick" x="245" y="235">1</text>
    <text class="tick" x="295" y="235">2</text>
    <text class="tick" x="345" y="235">3</text>
    <text class="tick" x="210" y="170">1</text>
  </g>

  <text class="eq" x="450" y="420" text-anchor="middle">Same recipe (1.5, 0.5) — but now applied to where the basis vectors landed.</text>
</svg>
