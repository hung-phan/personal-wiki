<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, DejaVu Sans, sans-serif" font-size="13">
  <style>
    .bg    { fill: #f7f0e1; }
    .ink   { fill: #2b2b2b; }
    .mut   { fill: #6b6256; font-size: 11px; }
    .h1    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 24px; font-weight: 700; }
    .h2    { fill: #2b2b2b; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 15px; font-weight: 700; }
    .kick  { fill: #6b6256; font-family: 'Courier New', Courier, 'DejaVu Sans Mono', monospace; font-size: 13px; }
    .hand  { fill: #b3261e; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .handk { fill: #2b2b2b; font-family: 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', 'DejaVu Sans', cursive; font-size: 13px; }
    .num   { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .numb  { fill: #2b2b2b; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; }
    .numf  { fill: #a39a8c; font-family: ui-monospace, Menlo, 'DejaVu Sans Mono', monospace; font-size: 11px; }
    .red   { fill: #b3261e; }
    .uline { stroke: #b3261e; stroke-width: 2; }
    .ln    { stroke: #2b2b2b; stroke-width: 1.4; fill: none; }
    .lnr   { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .lnd   { stroke: #6b6256; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .cell  { fill: #fbf7ee; stroke: #8a8174; stroke-width: 0.8; }
    .grey  { fill: #e3dccd; stroke: #8a8174; stroke-width: 0.8; }
    .pur   { fill: #e7dcf3; stroke: #7b5ea7; stroke-width: 1; }
    .grn   { fill: #e1edd5; stroke: #5f8a3a; stroke-width: 1; }
    .yel   { fill: #fbe9c4; stroke: #b8860b; stroke-width: 1; }
    .blu   { fill: #dce8f5; stroke: #3d6fa8; stroke-width: 1; }
    .pnk   { fill: #f6d9d4; stroke: #b3261e; stroke-width: 1; }
    .hi    { fill: none; stroke: #b3261e; stroke-width: 2.2; }
    .note  { fill: #fdf9f0; stroke: #8a8174; stroke-width: 1; stroke-dasharray: 6 4; }
    .bar   { fill: #7b5ea7; }
    .barr  { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1f1d1a; }
      .ink, .h1, .h2, .handk, .num, .numb { fill: #ece6d9; }
      .mut, .kick { fill: #b5ab9b; }
      .numf { fill: #6f675c; }
      .hand, .red { fill: #f28b82; }
      .uline, .lnr, .hi { stroke: #f28b82; }
      .ln { stroke: #ece6d9; }
      .lnd { stroke: #b5ab9b; }
      .cell { fill: #2a2723; stroke: #6f675c; }
      .grey { fill: #3a362f; stroke: #6f675c; }
      .note { fill: #26231f; stroke: #8a8174; }
      .pur { fill: #3b2d52; stroke: #b39ddb; }
      .grn { fill: #2c3f22; stroke: #9ccc65; }
      .yel { fill: #4a3a14; stroke: #e0b44c; }
      .blu { fill: #1d3550; stroke: #7fb0e6; }
      .pnk { fill: #4d2420; stroke: #f28b82; }
      .bar { fill: #b39ddb; }
      .barr { fill: #f28b82; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8174"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
<rect x="0" y="0" width="960" height="560" rx="0" class="bg"/><text x="30" y="32" class="kick" text-anchor="start" >BOLTZMANN MACHINES</text><text x="30" y="62" class="h1" text-anchor="start" >Every node talks vs. two layers talk</text><line x1="30" y1="72" x2="570" y2="72" class="uline"/><rect x="30" y="90" width="440" height="320" rx="8" class="note"/><text x="250" y="116" class="h2" text-anchor="middle" >Boltzmann machine (full)</text><line x1="130" y1="330" x2="210" y2="330" class="lnr" stroke-width="1.2"/><line x1="130" y1="330" x2="290" y2="330" class="lnr" stroke-width="1.2"/><line x1="130" y1="330" x2="370" y2="330" class="lnr" stroke-width="1.2"/><line x1="130" y1="330" x2="170" y2="190" class="lnd" stroke-width="0.9"/><line x1="130" y1="330" x2="250" y2="190" class="lnd" stroke-width="0.9"/><line x1="130" y1="330" x2="330" y2="190" class="lnd" stroke-width="0.9"/><line x1="210" y1="330" x2="290" y2="330" class="lnr" stroke-width="1.2"/><line x1="210" y1="330" x2="370" y2="330" class="lnr" stroke-width="1.2"/><line x1="210" y1="330" x2="170" y2="190" class="lnd" stroke-width="0.9"/><line x1="210" y1="330" x2="250" y2="190" class="lnd" stroke-width="0.9"/><line x1="210" y1="330" x2="330" y2="190" class="lnd" stroke-width="0.9"/><line x1="290" y1="330" x2="370" y2="330" class="lnr" stroke-width="1.2"/><line x1="290" y1="330" x2="170" y2="190" class="lnd" stroke-width="0.9"/><line x1="290" y1="330" x2="250" y2="190" class="lnd" stroke-width="0.9"/><line x1="290" y1="330" x2="330" y2="190" class="lnd" stroke-width="0.9"/><line x1="370" y1="330" x2="170" y2="190" class="lnd" stroke-width="0.9"/><line x1="370" y1="330" x2="250" y2="190" class="lnd" stroke-width="0.9"/><line x1="370" y1="330" x2="330" y2="190" class="lnd" stroke-width="0.9"/><line x1="170" y1="190" x2="250" y2="190" class="lnr" stroke-width="1.2"/><line x1="170" y1="190" x2="330" y2="190" class="lnr" stroke-width="1.2"/><line x1="250" y1="190" x2="330" y2="190" class="lnr" stroke-width="1.2"/><circle cx="130" cy="330" r="16" class="yel"/><circle cx="210" cy="330" r="16" class="yel"/><circle cx="290" cy="330" r="16" class="yel"/><circle cx="370" cy="330" r="16" class="yel"/><circle cx="170" cy="190" r="16" class="pur"/><circle cx="250" cy="190" r="16" class="pur"/><circle cx="330" cy="190" r="16" class="pur"/><text x="250" y="380" class="hand" text-anchor="middle" >red = visible–visible / hidden–hidden links</text><text x="250" y="398" class="mut" text-anchor="middle" >too many to sample → impractical</text><rect x="490" y="90" width="440" height="320" rx="8" class="note"/><text x="710" y="116" class="h2" text-anchor="middle" >Restricted (RBM)</text><line x1="590" y1="330" x2="630" y2="190" class="lnd" stroke-width="0.9"/><line x1="590" y1="330" x2="710" y2="190" class="lnd" stroke-width="0.9"/><line x1="590" y1="330" x2="790" y2="190" class="lnd" stroke-width="0.9"/><line x1="670" y1="330" x2="630" y2="190" class="lnd" stroke-width="0.9"/><line x1="670" y1="330" x2="710" y2="190" class="lnd" stroke-width="0.9"/><line x1="670" y1="330" x2="790" y2="190" class="lnd" stroke-width="0.9"/><line x1="750" y1="330" x2="630" y2="190" class="lnd" stroke-width="0.9"/><line x1="750" y1="330" x2="710" y2="190" class="lnd" stroke-width="0.9"/><line x1="750" y1="330" x2="790" y2="190" class="lnd" stroke-width="0.9"/><line x1="830" y1="330" x2="630" y2="190" class="lnd" stroke-width="0.9"/><line x1="830" y1="330" x2="710" y2="190" class="lnd" stroke-width="0.9"/><line x1="830" y1="330" x2="790" y2="190" class="lnd" stroke-width="0.9"/><circle cx="590" cy="330" r="16" class="yel"/><circle cx="670" cy="330" r="16" class="yel"/><circle cx="750" cy="330" r="16" class="yel"/><circle cx="830" cy="330" r="16" class="yel"/><circle cx="630" cy="190" r="16" class="pur"/><circle cx="710" cy="190" r="16" class="pur"/><circle cx="790" cy="190" r="16" class="pur"/><text x="710" y="380" class="hand" text-anchor="middle" >only visible ↔ hidden: a bipartite graph</text><text x="710" y="398" class="mut" text-anchor="middle" >given v, every h is independent → fast</text><text x="60" y="335" class="mut" text-anchor="start" >visible v</text><text x="60" y="195" class="mut" text-anchor="start" >hidden h</text><text x="520" y="335" class="mut" text-anchor="start" >visible v</text><text x="520" y="195" class="mut" text-anchor="start" >hidden h</text><rect x="30" y="426" width="900" height="118" rx="6" class="note"/><text x="44" y="448" class="h2" text-anchor="start" >Energy → probability</text><text x="44" y="468" class="handk" text-anchor="start" >E(v, h) = −b·v − a·h − hᵀWv   and   P(v, h) = e^(−E) / Z,  where Z sums over ALL states.</text><text x="44" y="486" class="handk" text-anchor="start" >Low energy = likely. Training reshapes W so states that look like real data get low energy.</text><text x="44" y="504" class="handk" text-anchor="start" >No arrows, no output layer: the model describes the whole system, it doesn't map input → output.</text></svg>
